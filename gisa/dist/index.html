<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="전기기사">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161d24" media="(prefers-color-scheme: dark)">
<title>전기기사 필기 연습장</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 680px 한 기둥, 위에 붙는 탭 바, 문제만 카드로 띄우고 나머지는 평면 */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f5f7f9;
  --ink: #17202a;
  --muted: #586575;
  --line: #d5dce3;
  --accent: #b14f28; /* 구리선 색 */
  --accent-ink: #ffffff;
  --accent-soft: #f7e8e0;
  --ok: #17734a;
  --ok-soft: #e0f1e7;
  --bad: #b02538;
  --bad-soft: #fae5e8;
  --warn: #855600;
  --warn-soft: #f9efd9;
  --font-body: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1318;
    --surface: #161d24;
    --surface-2: #1b242d;
    --ink: #e4e9ee;
    --muted: #98a6b4;
    --line: #2b3742;
    --accent: #e8895c;
    --accent-ink: #1b0e07;
    --accent-soft: #35231a;
    --ok: #55c78f;
    --ok-soft: #12301f;
    --bad: #ff8292;
    --bad-soft: #3b1a21;
    --warn: #e2b45f;
    --warn-soft: #33290f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1318;
  --surface: #161d24;
  --surface-2: #1b242d;
  --ink: #e4e9ee;
  --muted: #98a6b4;
  --line: #2b3742;
  --accent: #e8895c;
  --accent-ink: #1b0e07;
  --accent-soft: #35231a;
  --ok: #55c78f;
  --ok-soft: #12301f;
  --bad: #ff8292;
  --bad-soft: #3b1a21;
  --warn: #e2b45f;
  --warn-soft: #33290f;
  color-scheme: dark;
}
:root[data-theme="light"] {
  color-scheme: light;
}

* {
  box-sizing: border-box;
}
[hidden] {
  display: none !important;
}
html {
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--surface);
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
}
:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
.wrap {
  max-width: 680px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ── 상단 바 ── */
.appbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 9;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.appbar .wrap {
  padding-block: 10px 0;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 17px;
  letter-spacing: -0.01em;
}
.brand svg {
  width: 30px;
  height: 18px;
  color: var(--accent);
  flex: none;
}
.brand small {
  font-weight: 500;
  color: var(--muted);
  font-size: 13px;
}
.brand .streak {
  margin-left: auto;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  font-family: var(--font-mono);
}
.tabs {
  display: flex;
  gap: 2px;
  margin-top: 6px;
}
.tab {
  flex: 1;
  min-width: 0;
  padding: 10px 4px 11px;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 15px;
  font-weight: 600;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
}
.tab[aria-selected="true"] {
  color: var(--ink);
  border-bottom-color: var(--accent);
}
.badge {
  display: inline-block;
  min-width: 18px;
  padding: 0 5px;
  margin-left: 3px;
  border-radius: 9px;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 11px;
  line-height: 18px;
  text-align: center;
  font-family: var(--font-mono);
  vertical-align: 1px;
}

main .wrap {
  padding-block: 16px 64px;
  display: grid;
  gap: 16px;
}
h2 {
  margin: 4px 0 0;
  font-size: 22px;
  line-height: 1.3;
  text-wrap: balance;
}
h3 {
  margin: 0;
  font-size: 15px;
}
p {
  margin: 0;
}
.muted {
  color: var(--muted);
}
.small {
  font-size: 14px;
}
.eyebrow {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--muted);
}

/* ── 과목 칩 / 개념 선택 ── */
main .wrap > *,
.panel > * {
  min-width: 0;
}
.chips {
  min-width: 0;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  margin: 0 -16px;
  padding: 2px 16px 4px;
}
.chips::-webkit-scrollbar {
  display: none;
}
.chip {
  flex: none;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 600;
}
.chip[aria-pressed="true"] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--bg);
}
.chip .soon {
  font-weight: 500;
  font-size: 12px;
  opacity: 0.75;
  margin-left: 4px;
}
.picker {
  display: flex;
  align-items: center;
  gap: 10px;
}
.picker label {
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
  flex: none;
}
select {
  flex: 1;
  min-width: 0;
  font-size: 16px;
  padding: 9px 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
}

/* ── 잠금 안내 ── */
.lockbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  padding: 10px 14px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  font-size: 14px;
  color: var(--muted);
}
.lockbar strong {
  color: var(--ink);
}
.lockbar-btns {
  display: flex;
  gap: 8px;
  margin-left: auto;
}
.subject-title {
  margin-top: 18px;
  font-size: 19px;
}

/* ── 모드 배너 ── */
.banner {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  padding: 10px 14px;
  border-radius: 12px;
  background: var(--warn-soft);
  color: var(--warn);
  font-size: 14px;
  font-weight: 600;
}
.banner .btn {
  margin-left: auto;
}

/* ── 문제 카드 ── */
.qcard {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 16px 20px;
  display: grid;
  gap: 16px;
  min-width: 0;
}
.qmeta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 8px;
  font-size: 13px;
}
.tag {
  padding: 2px 9px;
  border-radius: 6px;
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 700;
}
.tag.plain {
  background: var(--surface-2);
  color: var(--muted);
}
.tag.review {
  background: var(--warn-soft);
  color: var(--warn);
}
.qid {
  margin-left: auto;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 12px;
}
.qtext {
  font-size: 18px;
  line-height: 1.65;
  font-weight: 500;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
.figure {
  color: var(--ink);
  overflow-x: auto;
  padding: 6px 0;
  border-radius: 10px;
  background: var(--surface-2);
}
.circuit {
  display: block;
  width: 100%;
  max-width: 440px;
  height: auto;
  margin: 0 auto;
}
.circuit text {
  font-size: 14px;
  font-family: var(--font-mono);
}
.circuit .hl {
  fill: var(--accent);
  font-weight: 700;
}
.circuit .zbox {
  fill: var(--surface-2);
}

.hints {
  display: grid;
  gap: 10px;
}
.hint-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.hint-body {
  padding: 12px 14px;
  border-radius: 10px;
  background: var(--surface-2);
  font-size: 15px;
  display: grid;
  gap: 6px;
}
.formula {
  font-family: var(--font-mono);
  font-size: 15px;
  overflow-wrap: anywhere;
}

.choices {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}
.choice {
  width: 100%;
  min-height: 54px;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  padding: 10px 14px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  font-size: 17px;
  font-weight: 500;
  font-family: var(--font-mono);
  overflow-wrap: anywhere;
  transition: border-color 0.15s, background-color 0.15s;
}
.choice:not(:disabled):hover {
  border-color: var(--accent);
}
.choice .no {
  flex: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  border: 1.5px solid currentColor;
  font-size: 14px;
  font-weight: 700;
  color: var(--muted);
  font-family: var(--font-body);
}
.choice .lab {
  min-width: 0;
}
.choice.is-correct {
  border-color: var(--ok);
  background: var(--ok-soft);
}
.choice.is-correct .no {
  background: var(--ok);
  border-color: var(--ok);
  color: var(--surface);
}
.choice.is-wrong {
  border-color: var(--bad);
  background: var(--bad-soft);
}
.choice.is-wrong .no {
  background: var(--bad);
  border-color: var(--bad);
  color: var(--surface);
}
.choice.is-dim {
  opacity: 0.6;
}
.choice:disabled {
  color: var(--ink);
}

/* ── AI에게 묻기 ── */
.ai-box {
  border: 1px dashed var(--line);
  border-radius: 12px;
  padding: 0 14px;
}
.ai-box summary {
  padding: 11px 0;
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
  cursor: pointer;
}
.ai-box[open] {
  padding-bottom: 14px;
}
.ai-body {
  display: grid;
  gap: 10px;
}
.ai-presets {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.ai-chip {
  font-size: 13px;
  padding: 6px 11px;
}
.ai-thread {
  display: grid;
  gap: 8px;
}
.ai-thread:empty {
  display: none;
}
.ai-msg {
  padding: 10px 12px;
  border-radius: 12px;
  font-size: 15px;
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-width: 100%;
}
.ai-msg.me {
  justify-self: end;
  background: var(--ink);
  color: var(--bg);
  max-width: 85%;
}
.ai-msg.ai {
  background: var(--surface-2);
}
.ai-msg.pending {
  color: var(--muted);
}
.ai-form {
  display: flex;
  gap: 8px;
}
.ai-form input {
  flex: 1;
  min-width: 0;
  font-size: 16px;
  padding: 8px 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
}
.ai-note {
  font-size: 12px;
  color: var(--muted);
}

/* ── 해설 ── */
.verdict {
  padding: 12px 14px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 17px;
}
.verdict.ok {
  background: var(--ok-soft);
  color: var(--ok);
}
.verdict.bad {
  background: var(--bad-soft);
  color: var(--bad);
}
.verdict small {
  display: block;
  font-weight: 500;
  font-size: 14px;
  color: var(--ink);
  margin-top: 2px;
}
.explain {
  display: grid;
  gap: 0;
  border-top: 1px solid var(--line);
}
.ex {
  display: grid;
  gap: 8px;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
  min-width: 0;
}
.ex h3 {
  display: flex;
  align-items: center;
  gap: 8px;
}
.ex h3 .n {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: var(--accent);
  color: var(--accent-ink);
  display: grid;
  place-items: center;
  font-size: 13px;
  font-family: var(--font-mono);
  flex: none;
}
.ex .lead {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 600;
  overflow-wrap: anywhere;
}
.ex ol,
.ex ul {
  margin: 0;
  padding-left: 22px;
  display: grid;
  gap: 6px;
}
.ex li {
  overflow-wrap: anywhere;
}
.ex li.check {
  list-style: none;
  margin-left: -22px;
  padding: 8px 12px;
  border-radius: 10px;
  background: var(--ok-soft);
}
.analogy {
  padding: 12px 14px;
  border-radius: 10px;
  background: var(--accent-soft);
  font-size: 15px;
}
.per-choice {
  list-style: none;
  padding: 0 !important;
}
.per-choice li {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 2px 10px;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--surface-2);
}
.per-choice .pc-mark {
  grid-row: span 2;
  font-weight: 700;
  font-size: 13px;
  padding-top: 2px;
}
.per-choice .pc-mark.ok {
  color: var(--ok);
}
.per-choice .pc-mark.bad {
  color: var(--bad);
}
.per-choice .pc-label {
  font-family: var(--font-mono);
  font-weight: 600;
  min-width: 0;
  overflow-wrap: anywhere;
}
.per-choice .pc-why {
  font-size: 15px;
  min-width: 0;
}
.per-choice .mine {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  margin-left: 6px;
  font-family: var(--font-body);
}
.note {
  font-size: 14px;
  color: var(--muted);
}

/* ── 버튼 ── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  padding: 8px 16px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 15px;
  font-weight: 600;
  text-align: center;
}
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.btn.soft {
  background: var(--accent-soft);
  border-color: transparent;
  color: var(--accent);
}
.btn.danger {
  background: var(--bad);
  border-color: var(--bad);
  color: var(--surface);
}
.btn.small {
  min-height: 36px;
  padding: 6px 12px;
  font-size: 14px;
}
.btn:disabled {
  opacity: 0.45;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding-top: 16px;
}
.actions .primary {
  flex: 1 1 160px;
}

/* ── 목록형 화면(개념·복습·기록·설정) ── */
.panel {
  display: grid;
  gap: 12px;
  min-width: 0;
}
.group-title {
  margin-top: 8px;
}
.rows {
  display: grid;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  overflow: hidden;
}
.row {
  display: grid;
  gap: 6px;
  padding: 14px 16px;
  border-top: 1px solid var(--line);
  min-width: 0;
}
.row:first-child {
  border-top: 0;
}
.row-head {
  display: flex;
  align-items: center;
  gap: 8px 10px;
  flex-wrap: wrap;
}
.row-head .name {
  font-weight: 700;
  min-width: 0;
}
.row-head .right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}
.state {
  font-size: 12px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 6px;
}
.state.open {
  background: var(--ok-soft);
  color: var(--ok);
}
.state.locked {
  background: var(--surface-2);
  color: var(--muted);
}
.req {
  font-size: 14px;
  color: var(--muted);
  display: grid;
  gap: 2px;
}
.req .met {
  color: var(--ok);
}
details summary {
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  color: var(--accent);
}
details[open] summary {
  margin-bottom: 6px;
}
details p {
  font-size: 15px;
}
details p + p {
  margin-top: 8px;
}

.tiles {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.tile {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  min-width: 0;
}
.tile .v {
  font-family: var(--font-mono);
  font-size: 26px;
  font-weight: 600;
  line-height: 1.2;
}
.tile .k {
  font-size: 13px;
  color: var(--muted);
}
.bar {
  height: 8px;
  border-radius: 4px;
  background: var(--surface-2);
  overflow: hidden;
}
.bar > i {
  display: block;
  height: 100%;
  background: var(--ok);
  border-radius: 4px;
}
.bar.low > i {
  background: var(--bad);
}
.stat-line {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 14px;
  color: var(--muted);
  font-family: var(--font-mono);
}
.dots {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.dots i {
  width: 14px;
  height: 14px;
  border-radius: 4px;
  background: var(--bad);
}
.dots i.ok {
  background: var(--ok);
}

.field {
  display: grid;
  gap: 8px;
  padding: 14px 16px;
}
.switch {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  cursor: pointer;
}
.switch input {
  width: 22px;
  height: 22px;
  margin: 2px 0 0;
  accent-color: var(--accent);
  flex: none;
}
.inline {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.inline input {
  flex: 1 1 180px;
  min-width: 0;
}
input[type="text"],
textarea {
  font-size: 16px;
  padding: 9px 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  width: 100%;
}
textarea {
  font-family: var(--font-mono);
  font-size: 13px;
  min-height: 90px;
  resize: vertical;
}
.msg {
  font-size: 14px;
}
.msg.err {
  color: var(--bad);
}
.msg.ok {
  color: var(--ok);
}
.empty {
  padding: 28px 18px;
  text-align: center;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  color: var(--muted);
  display: grid;
  gap: 10px;
  justify-items: center;
}

.toast {
  position: fixed;
  left: 50%;

      '<svg class="circuit" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(title || '회로도') + '"' +
      ' fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      body + '</svg>'

  // 직렬 루프: 전원 왼쪽, 소자는 윗변, (선택) 오른쪽 변에 소자 하나
  // o = { source:{kind:'dc'|'ac', label}, parts:[{type, label, mark?}], right?:{type,label,mark} }
  function series(o) {
    const n = o.parts.length;
    const left = 46;
    const W = 120 + 110 * n + (o.right ? 70 : 0);
    const right = W - (o.right ? 90 : 40);
    const top = 44;
    const bottom = 140;
    const cy = (top + bottom) / 2;
    let body = '';
    let labels = '';
    const src = source(o.source.kind, left, cy);
    body += src.svg;
    body += '<path d="M' + left + ' ' + (cy - src.h) + 'V' + top + '"/>';
    if (o.right) {
      body += '<path d="M' + left + ' ' + (cy + src.h) + 'V' + bottom + 'H' + right + 'V' + (cy + 30) + '"/>';
      body += '<path d="M' + right + ' ' + (cy - 30) + 'V' + top + '"/>';
    } else {
      body += '<path d="M' + left + ' ' + (cy + src.h) + 'V' + bottom + 'H' + right + 'V' + top + '"/>';
    }
    let x = left;
    for (let i = 0; i < n; i++) {
      const cx = left + ((right - left) * (i + 1)) / (n + 1);
      body += '<path d="M' + x + ' ' + top + 'H' + (cx - 30) + '"/>';
      body += part(o.parts[i].type, cx, top, false);
      labels += text(cx, top - 16, o.parts[i].label);
      if (o.parts[i].mark) labels += text(cx, top + 30, o.parts[i].mark, 'middle', 'hl');
      x = cx + 30;
    }
    body += '<path d="M' + x + ' ' + top + 'H' + right + '"/>';
    if (o.right) {
      // 오른쪽 변의 소자는 출력 단자와 함께 그린다
      body += part(o.right.type, right, cy, true);
      labels += text(right - 14, cy + 4, o.right.label, 'end');
      body += '<path d="M' + right + ' ' + top + 'H' + (right + 40) + 'M' + right + ' ' + bottom + 'H' + (right + 40) + '"/>';
      body += '<circle cx="' + (right + 42) + '" cy="' + top + '" r="3"/><circle cx="' + (right + 42) + '" cy="' + bottom + '" r="3"/>';
      if (o.right.mark) labels += text(right + 44, cy + 4, o.right.mark, 'middle', 'hl');
    }
    labels += text(left + 22, cy + 5, o.source.label, 'start');
    return wrapAll(W, 160, body, labels, o.title);
  }

  // 병렬: 전원 왼쪽, 갈래마다 세로 소자
  function parallel(o) {
    const n = o.branches.length;
    const left = 46;
    const W = 150 + 110 * n;
    const top = 36;
    const bottom = 140;
    const cy = (top + bottom) / 2;
    let body = '';
    let labels = '';
    const src = source(o.source.kind, left, cy);
    body += src.svg;
    const lastX = left + 110 * n;
    body += '<path d="M' + left + ' ' + (cy - src.h) + 'V' + top + 'H' + lastX + '"/>';
    body += '<path d="M' + left + ' ' + (cy + src.h) + 'V' + bottom + 'H' + lastX + '"/>';
    for (let i = 0; i < n; i++) {
      const bx = left + 110 * (i + 1);
      body += '<path d="M' + bx + ' ' + top + 'V' + (cy - 30) + 'M' + bx + ' ' + (cy + 30) + 'V' + bottom + '"/>';
      body += part(o.branches[i].type, bx, cy, true);
      labels += text(bx + 14, cy + 5, o.branches[i].label, 'start');
      if (i < n - 1 || n === 1) {
        body += '<circle cx="' + bx + '" cy="' + top + '" r="2.5" fill="currentColor"/>';
        body += '<circle cx="' + bx + '" cy="' + bottom + '" r="2.5" fill="currentColor"/>';

  function threePhase(o) {
    const W = 260;
    const H = 190;
    let body = '';
    let labels = '';
    const zbox = (x1, y1, x2, y2) => {
      const mx = (x1 + x2) / 2;
      const my = (y1 + y2) / 2;
      const ang = (Math.atan2(y2 - y1, x2 - x1) * 180) / Math.PI;
      return (
        '<path d="M' + x1 + ' ' + y1 + 'L' + x2 + ' ' + y2 + '"/>' +
        '<rect x="-17" y="-7" width="34" height="14" transform="translate(' + mx.toFixed(1) + ' ' + my.toFixed(1) +
        ') rotate(' + ang.toFixed(1) + ')" class="zbox"/>'
      );
    };
    if (o.type === 'Y') {
      const c = [130, 105];
      const pts = [[130, 30], [65, 145], [195, 145]];
      pts.forEach((p) => (body += zbox(c[0], c[1], p[0], p[1])));
      body += '<circle cx="130" cy="105" r="3" fill="currentColor"/>';
      labels += text(130, 22, 'a') + text(52, 160, 'b') + text(208, 160, 'c') + text(146, 112, 'N', 'start');
    } else {
      const pts = [[130, 30], [55, 155], [205, 155]];
      body += zbox(pts[0][0], pts[0][1], pts[1][0], pts[1][1]);
      body += zbox(pts[1][0], pts[1][1], pts[2][0], pts[2][1]);
      body += zbox(pts[2][0], pts[2][1], pts[0][0], pts[0][1]);
      pts.forEach((p) => (body += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3" fill="currentColor"/>'));
      labels += text(130, 22, 'a') + text(42, 170, 'b') + text(218, 170, 'c');
    }
    labels += text(W / 2, H - 4, o.label || '', 'middle', 'hl');
    return wrapAll(W, H, body, labels, o.title);
  }

  // 피드백 블록선도: R → (+/−) → [G] → C, C → [H] → 합산점
  function feedback(o) {
    const W = 330;
    const H = 150;
    let body = '';
    let labels = '';
    const arrow = (x, y, dir) => {
      const d = {
        r: 'M' + x + ' ' + y + 'l-8-4v8z',
        l: 'M' + x + ' ' + y + 'l8-4v8z',
        u: 'M' + x + ' ' + y + 'l-4 8h8z',

    body += '<circle cx="96" cy="50" r="13"/><path d="M87 41l18 18M105 41l-18 18" stroke-width="1.5"/>';
    body += '<path d="M109 50H140"/>' + arrow(140, 50, 'r');
    body += '<rect x="140" y="30" width="70" height="40" rx="3"/>';
    body += '<path d="M210 50H300"/>' + arrow(300, 50, 'r');
    body += '<path d="M260 50V115H210"/>' + arrow(210, 115, 'l');
    body += '<rect x="140" y="95" width="70" height="40" rx="3"/>';
    body += '<path d="M140 115H96V64"/>' + arrow(96, 64, 'u');
    labels += text(175, 55, o.g) + text(175, 120, o.h);
    labels += text(20, 40, 'R(s)', 'start') + text(300, 40, 'C(s)', 'end');
    labels += text(76, 40, '+') + text(84, 82, '−');

  function wrapAll(w, h, body, labels, title) {
    return wrap(w, h, body + '<g class="lbl" fill="currentColor" stroke="none">' + labels + '</g>', title);

// 배우기(읽기) 레슨 등록. 레슨 순서 = 커리큘럼 순서.
// 형식: { id, part, concept|null, title, goal, sections:[{h, p:[...], list:[...]}], how:[...], example:'템플릿#시드'|null, points:[...] }
(function (G) {
  'use strict';
  G.lessons = [];
  G.lessonMap = {};
  G.lessonParts = [];

  G.defineLesson = function (l) {
    if (G.lessonMap[l.id]) throw new Error('레슨 id 중복: ' + l.id);
    if (G.lessonParts.indexOf(l.part) === -1) G.lessonParts.push(l.part);
    G.lessons.push(l);
    G.lessonMap[l.id] = l;
  };

  G.lessonFor = function (conceptId) {
    return G.lessons.find((l) => l.concept === conceptId) || null;
  };
})(globalThis.GISA);

// 기초 수학 도구 문제 템플릿
(function (G) {
  'use strict';
  const F = G.fmt;
  const n = F.num;
  const T = G.defineTemplate;
  const ratioLabel = (v) => F.ratio(v) + '배';

  // ───────── 단위와 접두어 ─────────
  const PREFIX = { G: 9, M: 6, k: 3, '': 0, m: -3, μ: -6, n: -9, p: -12 };
  const QTY = [
    { unit: 'Ω', name: '저항', prefixes: ['M', 'k', ''] },
    { unit: 'A', name: '전류', prefixes: ['k', '', 'm', 'μ'] },
    { unit: 'V', name: '전압', prefixes: ['k', '', 'm'] },
    { unit: 'W', name: '전력', prefixes: ['M', 'k', ''] },
    { unit: 'F', name: '정전용량', prefixes: ['', 'm', 'μ', 'n', 'p'] },
    { unit: 'H', name: '인덕턴스', prefixes: ['', 'm', 'μ'] },
  ];
  const pname = { G: '기가', M: '메가', k: '킬로', '': '(접두어 없음)', m: '밀리', μ: '마이크로', n: '나노', p: '피코' };

  T({
    id: 'base-prefix',
    concept: 'base-units',
    gen(r) {
      const Q = r.pick(QTY);
      const from = r.pick(Q.prefixes);
      const to = r.pick(Q.prefixes);
      if (from === to || Math.abs(PREFIX[from] - PREFIX[to]) > 6) return null;
      const v = r.pick([1, 1.5, 2, 2.2, 3.3, 4.7, 5, 10, 25, 47, 100, 250, 500]);
      const diff = PREFIX[from] - PREFIX[to];
      const ans = v * Math.pow(10, diff);
      const u = to + Q.unit;
      const lab = (x) => F.qs(x, u);
      const sup = (k) => '10' + F.sup(k);
      return {
        params: { v, from, to },
        text: Q.name + ' ' + n(v) + ' ' + from + Q.unit + ' → ' + u + ' 단위로 바꾸면?',
        formula: [from, to].map((x) => (x ? pname[x] + '(' + x + ') = ' + sup(PREFIX[x]) : '접두어 없음 = 10⁰')).join(',  '),
        label: lab,
        answer: ans,
        distractors: [
          { v: v * Math.pow(10, -diff), why: '방향을 거꾸로 했어. ' + (diff > 0 ? '큰 단위에서 작은 단위로 가면 숫자가 커져야 해.' : '작은 단위에서 큰 단위로 가면 숫자가 작아져야 해.') },
          { v: v * Math.pow(10, diff - 3), why: '자릿수를 1000배(10³) 덜 옮겼어. 두 접두어 사이는 10' + F.sup(Math.abs(diff)) + '배 차이야.' },
          { v: v * Math.pow(10, diff + 3), why: '자릿수를 1000배(10³) 더 옮겼어. 두 접두어 사이는 10' + F.sup(Math.abs(diff)) + '배 차이야.' },
        ],
        conclusion: n(v) + ' ' + from + Q.unit + ' = ' + n(v) + ' × ' + sup(diff) + ' ' + u + (lab(ans) === n(v) + ' × ' + sup(diff) + ' ' + u ? '' : ' = ' + lab(ans)),
        steps: [

          '차이: 10^(' + PREFIX[from] + ' − (' + PREFIX[to] + ')) = ' + sup(diff) + '.',

        check: '거꾸로: ' + lab(ans) + ' × ' + sup(-diff) + ' = ' + n(v) + ' ' + from + Q.unit + '. 처음 값으로 돌아와.',
        traps: ['k와 m 사이는 10⁶, μ와 p 사이도 10⁶. 한 칸이 아니라 1000배씩 두 칸이야.'],

    },

  // ───────── 직각삼각형·sin·cos ─────────
  const TRI = [[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25], [20, 21, 29]];

      };
    },
  });

  T({
    id: 'base-pythag',
    concept: 'base-trig',
    gen(r) {

          ],
          conclusion: '√(' + n(a) + '² + ' + n(b) + '²) = √' + n(c * c) + ' = ' + n(c),
          steps: [n(a) + '² = ' + n(a * a) + ', ' + n(b) + '² = ' + n(b * b) + '.', '더하면 ' + n(c * c) + '.', '√' + n(c * c) + ' = ' + n(c) + '.'],
          check: n(c) + ' × ' + n(c) + ' = ' + n(c * c) + '. 맞아.',
          traps: ['임피던스 Z = √(R² + X²), 피상전력 S = √(P² + Q²) 모두 이 계산이야.'],

      return {

    const w0 = r.pick([100, 200, 250, 500, 1000, 2000, 2500, 5000, 10000]);
    const LmH = r.pick([1, 2, 4, 5, 10, 20, 25, 40, 50, 100, 200]);

    return { w0, LmH, CuF };
  }

        formula: 'sin ωt → ω/(s² + ω²),  cos ωt → s/(s² + ω²)',

        check: '초기값으로 확인: sF(s)에서 s → ∞이면 ' + (isSin ? '0 (sin 0 = 0)' : n(K) + ' (cos 0 = 1이라 ' + n(K) + ')') + '. 맞아.',

// 학습 기록 로직(순수 함수). 저장은 storage.js가 맡는다.
(function (G) {
  'use strict';

  const UNLOCK_MIN_ATTEMPTS = 3;
  const UNLOCK_MIN_RATE = 0.6;
  const REVIEW_DAYS = [1, 3, 7]; // 틀림 → 1일 뒤 → (맞히면) 3일 뒤 → (맞히면) 7일 뒤 → (맞히면) 졸업
  const HISTORY_MAX = 500;

  function emptyState() {
    return {
      v: 1,
      settings: { skipOrder: false, mixStatic: true, subject: 'all', focus: 'auto', theme: 'system', allSubjects: true },
      concepts: {},
      streak: { cur: 0, best: 0 },
      total: { n: 0, c: 0 },
      reviews: {},
      history: [],
      lessons: {},
    };
  }

  // 날짜는 기기 현지 기준 'YYYY-MM-DD'
  function today(d) {
    const x = d || new Date();
    const p = (k) => String(k).padStart(2, '0');
    return x.getFullYear() + '-' + p(x.getMonth() + 1) + '-' + p(x.getDate());
  }

  function addDays(day, k) {
    const [y, m, d] = day.split('-').map(Number);
    return today(new Date(y, m - 1, d + k));
  }

  function conceptStat(state, id) {
    return state.concepts[id] || { n: 0, c: 0 };
  }

  function prereqMet(state, id) {
    const s = conceptStat(state, id);
    return s.n >= UNLOCK_MIN_ATTEMPTS && s.c / s.n >= UNLOCK_MIN_RATE;
  }

  // 레슨을 읽은 개념도 열린다(읽기 = 레벨업)
  function lessonRead(state, conceptId) {
    const l = G.lessonFor ? G.lessonFor(conceptId) : null;
    return !!(l && state.lessons && state.lessons[l.id]);
  }

  function markLessonRead(state, lessonId) {
    if (!state.lessons) state.lessons = {};
    if (!state.lessons[lessonId]) state.lessons[lessonId] = { t: Date.now() };
  }

  function isUnlocked(state, id) {
    if (state.settings.skipOrder) return true;
    if (lessonRead(state, id)) return true;
    const c = G.conceptMap[id];
    return !!c && c.prereqs.every((p) => prereqMet(state, p));
  }

  // 잠금 해제 조건 진행도: [{id, name, n, rate, met}]
  function unlockStatus(state, id) {
    return G.conceptMap[id].prereqs.map((p) => {
      const s = conceptStat(state, p);
      return { id: p, name: G.conceptMap[p].name, n: s.n, rate: s.n ? s.c / s.n : 0, met: prereqMet(state, p) };
    });
  }

  // 정답 기록. opts.day = 오늘 날짜(테스트용 주입)
  function record(state, q, ok, opts) {
    const day = (opts && opts.day) || today();
    const cs = state.concepts[q.conceptId] || (state.concepts[q.conceptId] = { n: 0, c: 0 });
    cs.n += 1;
    if (ok) cs.c += 1;
    state.total.n += 1;
    if (ok) state.total.c += 1;
    state.streak.cur = ok ? state.streak.cur + 1 : 0;
    state.streak.best = Math.max(state.streak.best, state.streak.cur);

    const rv = state.reviews[q.key];
    let reviewEvent = null;
    if (!ok) {
      state.reviews[q.key] = { k: q.key, cid: q.conceptId, stage: 0, due: addDays(day, REVIEW_DAYS[0]) };
      reviewEvent = rv ? 'reset' : 'added';
    } else if (rv && rv.due <= day) {
      const next = rv.stage + 1;
      if (next >= REVIEW_DAYS.length) {
        delete state.reviews[q.key];
        reviewEvent = 'graduated';
      } else {
        rv.stage = next;
        rv.due = addDays(day, REVIEW_DAYS[next]);
        reviewEvent = 'advanced';
      }
    }
    state.history.push({ k: q.key, cid: q.conceptId, ok: !!ok, t: Date.now() });
    if (state.history.length > HISTORY_MAX) state.history.splice(0, state.history.length - HISTORY_MAX);
    return reviewEvent;
  }

  function dueReviews(state, day) {
    const d = day || today();
    return Object.values(state.reviews)
      .filter((r) => r.due <= d)
      .sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : 0));
  }

  function upcomingReviews(state, day) {
    const d = day || today();
    return Object.values(state.reviews)
      .filter((r) => r.due > d)
      .sort((a, b) => (a.due < b.due ? -1 : 1));
  }

  // 정답률 낮고 덜 푼 개념에 가중치
  function pickConcept(state, ids, rand) {
    const weights = ids.map((id) => {
      const s = conceptStat(state, id);
      let w = 1;
      if (s.n < 5) w += 2;
      if (s.n > 0 && s.c / s.n < UNLOCK_MIN_RATE) w += 2;
      return w;
    });
    const total = weights.reduce((a, b) => a + b, 0);
    let x = (rand || Math.random)() * total;
    for (let i = 0; i < ids.length; i++) {
      x -= weights[i];
      if (x < 0) return ids[i];
    }
    return ids[ids.length - 1];
  }

  // 저장본을 현재 형식에 맞춰 채움(필드가 빠졌거나 깨진 경우 대비)
  function normalize(raw) {
    const base = emptyState();
    if (!raw || typeof raw !== 'object') return base;
    const out = base;
    if (raw.settings && typeof raw.settings === 'object') Object.assign(out.settings, raw.settings);
    // 1단계(회로만 있던 때) 저장본은 한 번만 "전체" 과목으로 옮겨 준다
    if (!out.settings.allSubjects) {
      out.settings.subject = 'all';
      out.settings.focus = 'auto';
      out.settings.allSubjects = true;
    }
    if (raw.concepts && typeof raw.concepts === 'object') out.concepts = raw.concepts;
    if (raw.streak) out.streak = { cur: raw.streak.cur | 0, best: raw.streak.best | 0 };
    if (raw.total) out.total = { n: raw.total.n | 0, c: raw.total.c | 0 };
    if (raw.reviews && typeof raw.reviews === 'object') out.reviews = raw.reviews;
    if (Array.isArray(raw.history)) out.history = raw.history.slice(-HISTORY_MAX);
    if (raw.lessons && typeof raw.lessons === 'object') out.lessons = raw.lessons;
    return out;
  }

  G.progress = {
    UNLOCK_MIN_ATTEMPTS,
    UNLOCK_MIN_RATE,
    REVIEW_DAYS,
    emptyState,
    normalize,
    today,
    addDays,
    conceptStat,
    prereqMet,
    isUnlocked,
    lessonRead,
    markLessonRead,
    unlockStatus,
    record,
    dueReviews,
    upcomingReviews,
    pickConcept,
  };
})(globalThis.GISA);

// localStorage 저장. 사파리 개인정보 보호 모드처럼 저장이 막혀도 앱은 돌아가게 한다.
(function (G) {
  'use strict';
  const KEY = 'gisa.v1';
  let available = true;

  function load() {
    try {
      const raw = window.localStorage.getItem(KEY);
      return G.progress.normalize(raw ? JSON.parse(raw) : null);
    } catch (e) {
      available = false;
      return G.progress.emptyState();
    }
  }

  function save(state) {
    try {
      window.localStorage.setItem(KEY, JSON.stringify(state));
      available = true;
      return true;
    } catch (e) {
      available = false;
      return false;
    }
  }

  function clear() {
    try {
      window.localStorage.removeItem(KEY);
    } catch (e) {
      /* 저장소가 막혀 있으면 지울 것도 없음 */
    }
  }

  G.store = { KEY, load, save, clear, isAvailable: () => available };
})(globalThis.GISA);

// 그냥 파일로 열면 window.claude가 없어서 아예 나타나지 않는다.
(function (G) {
  'use strict';

  let sample = null; // claude.use('sample') 결과. null이면 기능 숨김
  let onReady = null;
  const panels = new WeakMap(); // 문제 객체 → 패널 DOM(다시 그려도 대화·입력이 유지되게)

  if (typeof window !== 'undefined' && window.claude && typeof window.claude.use === 'function') {
    window.claude
      .use('sample')
      .then((fn) => {

        if (sample && onReady) onReady();
      })
      .catch(() => (sample = null));
  }

  const NUMS = ['1', '2', '3', '4'];

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // 튜터 규칙 + 이 문제의 검증된 데이터 (매 호출 맨 앞 user 턴으로 보냄)
  function rules(q, st) {
    const lines = [
      '너는 한국 전기기사 필기시험을 준비하는 학생을 돕는 튜터야. 학생은 이론을 거의 몰라.',
      '규칙:',
      '- 반말(~야, ~해)로, 쉬운 말과 일상 비유로 설명해. 전문용어는 처음 나올 때 한 번 풀어 줘.',
      '- 아래 [문제 데이터]의 정답·풀이는 코드로 검산한 값이야. 이걸 기준으로 설명하고, 다른 답을 주장하지 마.',
      '- 확실하지 않은 공식이나 수치는 지어내지 말고 "확실하지 않아"라고 말해.',
      '- 짧게: 보통 3~8문장. 단계가 필요하면 1) 2) 3)으로 줄을 나눠. 마크다운 표·제목·굵게(**)는 쓰지 마.',
      '- 학생 질문이 이 문제나 전기기사 공부와 관계없으면 한 문장으로 공부 이야기로 돌려.',
      st.answered
        ? '- 학생은 이미 답을 골랐어. 정답과 이유를 자유롭게 설명해도 돼.'
        : '- 학생은 아직 답을 고르지 않았어. 정답 값이나 정답 번호를 절대 말하지 말고, 힌트와 생각하는 순서로만 이끌어. 학생이 답을 알려 달라고 하면 "보기를 먼저 골라 보면 해설이 바로 나와"라고 해.',
      '',
      '[문제 데이터]',
      '개념: ' + G.conceptMap[q.conceptId].name,
      '문제: ' + q.text,
      '보기: ' + q.choices.map((c, i) => NUMS[i] + ') ' + c.label).join('  '),
      '정답: ' + NUMS[q.answerIndex] + ') ' + q.choices[q.answerIndex].label,
      '한 줄 결론: ' + q.explain.conclusion,
      '풀이 단계: ' + q.explain.steps.join(' / '),
      '오답 이유: ' + q.choices.map((c, i) => (c.correct ? '' : NUMS[i] + ') ' + c.why)).filter(Boolean).join(' / '),
      '함정: ' + q.explain.traps.join(' / '),
      '개념 카드: ' + q.explain.card,

    if (st.answered) lines.push('학생이 고른 답: ' + NUMS[st.chosen] + ') ' + q.choices[st.chosen].label + (q.choices[st.chosen].correct ? ' (정답)' : ' (오답)'));

  const ERR = {

    session_expired: 'claude.ai 로그인이 풀렸어. 다시 로그인한 뒤 물어봐.',

  function panel(q, getState) {

      p.refresh();

    const turns = []; // {role, content} — 규칙 턴은 보낼 때마다 앞에 붙임
    let ctl = null;
    let busy = false;

    const node = el('details', 'ai-box');
    const summary = el('summary', null, 'AI에게 묻기');
    const body = el('div', 'ai-body');
    const thread = el('div', 'ai-thread');
    const presets = el('div', 'ai-presets');
    const form = el('form', 'ai-form');

    input.setAttribute('aria-label', 'AI에게 질문');
    input.id = 'ai-input';
    const send = el('button', 'btn small primary', '보내기');
    send.type = 'submit';
    const stop = el('button', 'btn small', '멈추기');
    stop.type = 'button';
    stop.hidden = true;
    const note = el('p', 'ai-note', '답은 AI가 써. 이 앱의 정답·해설을 기준으로 설명하게 해 뒀지만, 이상하면 해설을 믿어 줘.');
    form.append(input, send, stop);
    body.append(presets, thread, form, note);

    function presetList() {
      const st = getState();
      if (!st.answered) return ['힌트만 줘', '이 문제가 묻는 게 뭐야?', '어떤 공식을 써야 해?'];

      return (mine ? ['내가 고른 답은 왜 틀려?'] : []).concat(['풀이를 더 쉽게 설명해 줘', '비유로 다시 설명해 줘', '비슷한 문제 하나 내 줘']);
    }
    function refresh() {
      presets.textContent = '';
      presetList().forEach((t) => {
        const b = el('button', 'chip ai-chip', t);
        b.type = 'button';
        b.disabled = busy;
        b.onclick = () => ask(t);
        presets.append(b);

    }
    function setBusy(v) {
      busy = v;
      send.disabled = v;
      input.disabled = v;

      presets.querySelectorAll('button').forEach((b) => (b.disabled = v));

    }

      text = String(text || '').trim();
      if (!text || busy || !sample) return;
      bubble('user', text);
      turns.push({ role: 'user', content: text });
      const out = bubble('assistant', '생각 중…');
      out.classList.add('pending');
      setBusy(true);
      ctl = new AbortController();
      const recent = turns.slice(-10);
      try {
        const res = await sample([{ role: 'user', content: rules(q, getState()) }].concat(recent[0].role === 'user' ? recent : recent.slice(1)), {
          cache: false,
          signal: ctl.signal,
          onText: ({ text: t }) => {
            out.classList.remove('pending');
            out.textContent = t;
          },
        });
        out.classList.remove('pending');
        out.textContent = res.text + (res.truncated ? '\n(답이 길어서 중간에 끊겼어. 더 짧게 물어봐 줘.)' : '');
        turns.push({ role: 'assistant', content: res.text });
      } catch (e) {
        const code = (e && e.code) || 'upstream_error';
        out.classList.remove('pending');
        if (code === 'cancelled') {
          out.textContent = (e.text || '') + (e.text ? '\n' : '') + '(멈췄어)';

        setBusy(false);

      e.preventDefault();
      const t = input.value;
      input.value = '';
      ask(t);
    });
    stop.onclick = () => ctl && ctl.abort();
    refresh();
    p = { node, refresh };
    panels.set(q, p);
    return node;
  }

    panel,
    available: () => !!sample,
    onReady: (fn) => {
      onReady = fn;
      if (sample) fn();
    },
  };
})(globalThis.GISA);

              { class: 'tab', role: 'tab', 'aria-selected': String(view.tab === id), onclick: () => goTab(id), id: 'tab-' + id },
              label,
              id === 'review' && due ? h('span', { class: 'badge' }, due) : null
            )
          )
        )
      )
    );
  }

  // ───────── 연습 탭 ─────────
  function subjectChips() {
    const all = [{ id: 'all', short: '전체', ready: true }].concat(G.subjects);
    return h(
      'div',
      { class: 'chips', role: 'group', 'aria-label': '과목' },
      all.map((s) =>
        h(
          'button',
          {
            class: 'chip',
            'aria-pressed': String(S.settings.subject === s.id),
            onclick: () => {
              S.settings.subject = s.id;
              S.settings.focus = 'auto';
              view.mode = 'normal';
              view.reviewQueue = [];
              save();
              nextQuestion();
              render();
            },
          },
          s.short,
          s.ready ? null : h('span', { class: 'soon' }, s.id === 'code' ? '나중에' : '준비 중')
        )
      )
    );
  }

  function conceptPicker() {
    const sel = h('select', {
      id: 'concept-select',
      onchange: (e) => {
        S.settings.focus = e.target.value;
        if (view.mode === 'basics') view.mode = 'normal';
        save();
        nextQuestion();
        render();
      },
    });
    sel.appendChild(h('option', { value: 'auto' }, '자동 (열린 개념 골고루)'));
    groupsOf(S.settings.subject).forEach((g) => {
      const list = G.concepts.filter((c) => c.subject === g.subject && c.group === g.name);
      if (!list.length) return;
      const og = h('optgroup', { label: S.settings.subject === 'all' ? subjectName(g.subject) + ' · ' + g.name : g.name });
      list.forEach((c) => {
        const open = P.isUnlocked(S, c.id);
        og.appendChild(h('option', { value: c.id, disabled: !open }, c.name + (open ? '' : ' (잠김)')));
      });
      sel.appendChild(og);
    });
    sel.value = S.settings.focus;
    if (sel.value !== S.settings.focus) sel.value = 'auto';
    return h('div', { class: 'picker' }, h('label', { for: 'concept-select' }, '개념'), sel);
  }

  function modeBanner() {
    if (view.mode === 'review') {
      return h(
        'div',
        { class: 'banner' },
        '복습 중 · 남은 문제 ' + view.reviewQueue.length + '개',
        h('button', { class: 'btn small', onclick: () => { view.mode = 'normal'; view.reviewQueue = []; nextQuestion(); render(); } }, '복습 그만하기')
      );
    }
    if (view.mode === 'basics' && view.basics) {
      return h(
        'div',
        { class: 'banner' },
        '기초 다지는 중: ' + concept(view.basics.focus).name + ' (' + concept(view.basics.from).name + '에서 내려옴)',
        h('button', { class: 'btn small', onclick: () => { view.mode = 'normal'; S.settings.focus = view.basics.from; view.basics = null; save(); nextQuestion(); render(); } }, '원래 개념으로')
      );
    }
    return null;
  }

  function hintsBlock(q) {
    if (view.answered) return null;
    const body = [];
    if (view.hint >= 1) body.push(h('div', { class: 'hint-body' }, h('span', { class: 'eyebrow' }, '힌트 1 · 개념 카드'), h('p', null, q.hints.card)));
    if (view.hint >= 2) body.push(h('div', { class: 'hint-body' }, h('span', { class: 'eyebrow' }, '힌트 2 · 쓸 공식'), h('p', { class: 'formula' }, q.hints.formula)));
    return h(
      'div',
      { class: 'hints' },
      h(
        'div',
        { class: 'hint-row' },
        h('button', { class: 'btn small soft', id: 'hint1', disabled: view.hint >= 1, onclick: () => { view.hint = 1; render(); } }, '힌트 1 · 개념 카드'),
        h('button', { class: 'btn small soft', id: 'hint2', disabled: view.hint !== 1, onclick: () => { view.hint = 2; render(); } }, '힌트 2 · 쓸 공식')
      ),
      body
    );
  }

  function choiceList(q) {
    return h(
      'ol',
      { class: 'choices' },
      q.choices.map((c, i) => {
        let cls = 'choice';
        if (view.answered) {
          if (c.correct) cls += ' is-correct';
          else if (i === view.chosen) cls += ' is-wrong';
          else cls += ' is-dim';
        }
        return h(
          'li',
          null,
          h(
            'button',
            { class: cls, disabled: view.answered, onclick: () => answer(i), 'data-i': i },
            h('span', { class: 'no' }, NUMS[i]),
            h('span', { class: 'lab' }, c.label)
          )
        );
      })
    );
  }

  function reviewNote() {
    const e = view.event;
    if (e === 'added') return '틀린 문제라 같은 숫자 그대로 내일 복습 목록에 넣었어. (1일 → 3일 → 7일)';
    if (e === 'reset') return '복습 문제를 다시 틀려서 내일부터 다시 시작해.';
    if (e === 'advanced') return '복습 통과! 다음 복습 날짜: ' + (S.reviews[view.q.key] || {}).due;
    if (e === 'graduated') return '복습 3단계를 모두 통과해서 이 문제는 졸업했어.';
    return null;
  }

  function explainBlock(q) {
    const chosen = q.choices[view.chosen];
    const ok = chosen.correct;
    const ex = q.explain;
    const c = concept(q.conceptId);
    const cards = [];
    cards.push(
      h(
        'div',
        { class: 'verdict ' + (ok ? 'ok' : 'bad'), role: 'status' },
        ok ? '정답!' : '아쉽다, 오답이야',
        h('small', null, ok ? '연속 정답 ' + S.streak.cur + '개째' : '정답은 ' + NUMS[q.answerIndex] + '번 · ' + q.choices[q.answerIndex].label)
      )
    );
    const steps = ex.steps.map((s) => (s.indexOf('검산: ') === 0 ? h('li', { class: 'check' }, s) : h('li', null, s)));
    cards.push(
      h(
        'div',
        { class: 'explain' },
        h('section', { class: 'ex' }, h('h3', null, h('span', { class: 'n' }, '1'), '한 줄 결론'), h('p', { class: 'lead' }, ex.conclusion)),
        h(
          'section',
          { class: 'ex' },
          h('h3', null, h('span', { class: 'n' }, '2'), '개념 카드 · ' + c.name),
          h('p', null, ex.card),
          view.analogy
            ? h('p', { class: 'analogy' }, ex.analogy)
            : h('div', null, h('button', { class: 'btn small soft', id: 'easier', onclick: () => { view.analogy = true; render(); } }, '더 쉽게 설명'))
        ),
        h('section', { class: 'ex' }, h('h3', null, h('span', { class: 'n' }, '3'), '풀이'), h('ol', null, steps)),
        h('section', { class: 'ex' }, h('h3', null, h('span', { class: 'n' }, '4'), '함정 · 기억할 점'), h('ul', null, ex.traps.map((t) => h('li', null, t)))),
        h(
          'section',
          { class: 'ex' },
          h('h3', null, '보기별 해설'),
          h(
            'ul',
            { class: 'per-choice' },
            q.choices.map((ch, i) =>
              h(
                'li',
                null,
                h('span', { class: 'pc-mark ' + (ch.correct ? 'ok' : 'bad') }, NUMS[i] + ' ' + (ch.correct ? '정답' : '오답')),
                h('span', { class: 'pc-label' }, ch.label, i === view.chosen ? h('span', { class: 'mine' }, '내 선택') : null),
                h('span', { class: 'pc-why' }, ch.why)
              )
            )
          )
        )
      )
    );
    const notes = [];
    const rn = reviewNote();
    if (rn) notes.push(h('p', { class: 'note' }, rn));
    if (view.unlocked.length) notes.push(h('p', { class: 'note' }, '새 개념이 열렸어: ' + view.unlocked.map((id) => concept(id).name).join(', ')));
    cards.push(notes);
    const actions = [
      h('button', { class: 'btn primary', id: 'next', onclick: () => { nextQuestion(); render(); window.scrollTo(0, 0); } }, '다음 문제'),
      h('button', { class: 'btn', id: 'retry', onclick: () => { loadKey(q.key); render(); window.scrollTo(0, 0); } }, '같은 문제 다시'),
    ];
    if (!ok) {
      c.prereqs.forEach((pid) =>
        actions.push(
          h(
            'button',
            {
              class: 'btn soft',
              onclick: () => {
                view.mode = 'basics';
                view.basics = { focus: pid, from: c.id };
                nextQuestion();
                render();
                window.scrollTo(0, 0);
              },
            },
            '기초로 내려가기: ' + concept(pid).name
          )
        )
      );
    }
    cards.push(h('div', { class: 'actions' }, actions));
    return cards;
  }

  function questionCard() {
    if (!subjectReady()) {
      const s = G.subjects.find((x) => x.id === S.settings.subject);
      return h(
        'div',
        { class: 'empty' },
        h('strong', null, s.name),
        h('p', null, s.id === 'code' ? '전기설비기술기준은 최신 기준을 확인한 뒤에 따로 추가할 거야.' : '이 과목은 다음 단계에서 채울 예정이야. 지금은 회로이론 및 제어공학을 풀 수 있어.'),
        h('button', { class: 'btn', onclick: () => { S.settings.subject = 'circuit'; save(); nextQuestion(); render(); } }, '회로·제어로 가기')
      );
    }
    const q = view.q;
    if (!q) return h('div', { class: 'empty' }, '풀 수 있는 개념이 없어. 설정에서 "순서 건너뛰기"를 켜 봐.');
    const c = concept(q.conceptId);
    const isReview = !!S.reviews[q.key] && view.mode === 'review';
    return h(
      'article',
      { class: 'qcard', 'aria-live': 'polite' },
      h(
        'div',
        { class: 'qmeta' },
        h('span', { class: 'tag' }, c.name),
        h('span', { class: 'tag plain' }, c.group + (q.source === 'static' ? ' · 이론형' : '')),
        isReview ? h('span', { class: 'tag review' }, '복습') : null,
        h('span', { class: 'qid', title: '문제 번호 (설정에서 다시 불러올 수 있어)' }, q.key)
      ),
      h('p', { class: 'qtext' }, q.text),
      q.svg ? h('div', { class: 'figure', html: q.svg }) : null,
      hintsBlock(q),
      choiceList(q),
      G.aiTutor ? G.aiTutor.panel(q, () => ({ answered: view.answered, chosen: view.chosen })) : null,
      view.answered ? explainBlock(q) : null
    );
  }

  // 잠긴 개념이 있으면 몇 개가 열렸는지와 "전부 열기"를 연습 화면에서 바로 보여 준다
  function lockBar() {
    if (S.settings.skipOrder || !subjectReady()) return null;
    const list = G.concepts.filter(inSubject);
    const open = list.filter((c) => P.isUnlocked(S, c.id)).length;
    if (open === list.length) return null;
    return h(
      'div',
      { class: 'lockbar' },
      h('span', null, h('strong', null, '열린 개념 ' + open + '/' + list.length), ' · 선행 개념을 ' + P.UNLOCK_MIN_ATTEMPTS + '문제 이상, 정답률 ' + P.UNLOCK_MIN_RATE * 100 + '% 이상 맞히면 다음 개념이 열려.'),
      h('span', { class: 'lockbar-btns' },
        h('button', { class: 'btn small', onclick: () => goTab('learn') }, '배우기'),
        h('button', { class: 'btn small soft', id: 'open-all', onclick: () => { S.settings.skipOrder = true; save(); toast('모든 개념을 열었어. 설정에서 다시 끌 수 있어.'); render(); } }, '전부 열기')
      )
    );
  }

  function renderPractice(root) {
    root.appendChild(h('div', { class: 'panel' }, subjectChips(), lockBar(), subjectReady() && view.mode !== 'review' ? conceptPicker() : null));
    const b = modeBanner();
    if (b) root.appendChild(b);
    root.appendChild(questionCard());
  }

  // ───────── 배우기 탭 ─────────
  function lessonIndex(id) {
    return G.lessons.findIndex((l) => l.id === id);
  }
  function firstUnread() {
    return G.lessons.find((l) => !S.lessons[l.id]) || null;
  }
  function openLesson(id) {
    const l = G.lessonMap[id];
    view.lessonId = id;
    view.exampleKey = l && l.example ? 't:' + l.example.replace('#', '#') : null;
    view.quiz = null;
    view.tab = 'learn';
    render();
    window.scrollTo(0, 0);
  }
  function finishLesson(l) {
    P.markLessonRead(S, l.id);
    save();
  }
  function newQuiz(cid) {
    const tpls = G.templatesFor(cid);
    const t = tpls[Math.floor(Math.random() * tpls.length)];
    view.quiz = { q: G.generate(t.id, G.rng.newSeed()), chosen: -1 };
  }

  function renderLearnList(root) {
    const done = G.lessons.filter((l) => S.lessons[l.id]).length;
    const next = firstUnread();
    root.appendChild(
      h(
        'div',
        { class: 'panel' },
        h('h2', null, '배우기'),
        h('p', { class: 'muted small' }, '아무것도 모르는 상태에서 시작해서 한 단계씩 나아가는 순서야. 읽고 → 예제를 따라가고 → 확인 문제를 풀어. 레슨을 읽으면 그 개념의 문제도 열려.'),
        h(
          'div',
          { class: 'tile progress-tile' },
          h('div', { class: 'stat-line' }, h('span', null, '읽은 레슨'), h('span', null, done + ' / ' + G.lessons.length)),
          h('div', { class: 'bar' }, h('i', { style: 'width:' + Math.round((100 * done) / G.lessons.length) + '%' })),
          h('button', { class: 'btn primary', id: 'continue-lesson', onclick: () => openLesson((next || G.lessons[0]).id) }, next ? (done ? '이어서 읽기: ' : '처음부터 시작: ') + next.title : '처음부터 다시 보기')
        )
      )
    );
    G.lessonParts.forEach((part) => {
      root.appendChild(h('h3', { class: 'group-title eyebrow' }, part));
      root.appendChild(
        h(
          'div',
          { class: 'rows' },
          G.lessons
            .filter((l) => l.part === part)
            .map((l) => {
              const read = !!S.lessons[l.id];
              const c = l.concept ? concept(l.concept) : null;
              const st = c ? P.conceptStat(S, c.id) : null;
              const open = c ? P.isUnlocked(S, c.id) : true;
              return h(
                'button',
                { class: 'row lesson-row', 'data-lesson': l.id, onclick: () => openLesson(l.id) },
                h(
                  'span',
                  { class: 'row-head' },
                  h('span', { class: 'lesson-no' }, lessonIndex(l.id) + 1),
                  h('span', { class: 'name' }, l.title),
                  h('span', { class: 'right' }, read ? h('span', { class: 'state open' }, '읽음') : null)
                ),
                h('span', { class: 'stat-line' }, h('span', null, l.goal)),
                c
                  ? h('span', { class: 'stat-line' }, h('span', null, open ? '문제 ' + st.n + '개 풀이 · 정답률 ' + pct(st.c, st.n) : '문제 잠김 · 이 레슨을 읽으면 열려'), h('span', null, subjectName(c.subject)))
                  : null
              );
            })
        )
      );
    });
  }

  function exampleBlock(l) {
    if (!view.exampleKey) return null;
    let q;
    try {
      q = G.fromKey(view.exampleKey);
    } catch (e) {
      return null;
    }
    const steps = q.explain.steps.map((s) => (s.indexOf('검산: ') === 0 ? h('li', { class: 'check' }, s) : h('li', null, s)));
    return h(
      'section',
      { class: 'example' },
      h('div', { class: 'example-head' }, h('span', { class: 'eyebrow' }, '예제 풀이'), h('span', { class: 'qid' }, q.key)),
      h('p', { class: 'qtext' }, q.text),
      q.svg ? h('div', { class: 'figure', html: q.svg }) : null,
      h(
        'ol',
        { class: 'choices' },
        q.choices.map((c, i) => h('li', null, h('div', { class: 'choice' + (c.correct ? ' is-correct' : ' is-dim') }, h('span', { class: 'no' }, NUMS[i]), h('span', { class: 'lab' }, c.label))))
      ),
      h('h3', null, '풀이'),
      h('ol', { class: 'steps' }, steps),
      h('p', { class: 'lead' }, '답: ' + q.explain.conclusion),
      h(
        'button',
        {
          class: 'btn soft',
          id: 'another-example',
          onclick: () => {
            view.exampleKey = 't:' + l.example.split('#')[0] + '#' + G.rng.newSeed();
            render();
            const ex = document.querySelector('.example');
            if (ex && ex.scrollIntoView) ex.scrollIntoView({ block: 'start' });
          },
        },
        '다른 숫자로 예제 보기'
      )
    );
  }

  function quizBlock(l) {
    if (!l.concept) return null;
    if (!view.quiz) newQuiz(l.concept);
    const qz = view.quiz;
    const q = qz.q;
    const answered = qz.chosen >= 0;
    const kids = [
      h('div', { class: 'example-head' }, h('span', { class: 'eyebrow' }, '바로 확인'), h('span', { class: 'qid' }, q.key)),
      h('p', { class: 'qtext' }, q.text),
      q.svg ? h('div', { class: 'figure', html: q.svg }) : null,
      h(
        'ol',
        { class: 'choices' },
        q.choices.map((c, i) => {
          let cls = 'choice';
          if (answered) cls += c.correct ? ' is-correct' : i === qz.chosen ? ' is-wrong' : ' is-dim';
          return h(
            'li',
            null,
            h(
              'button',
              {
                class: cls,
                disabled: answered,
                'data-qi': i,
                onclick: () => {
                  qz.chosen = i;
                  P.record(S, q, c.correct);
                  finishLesson(l);
                  render();
                },
              },
              h('span', { class: 'no' }, NUMS[i]),
              h('span', { class: 'lab' }, c.label)
            )
          );
        })
      ),
    ];
    if (answered) {
      const ok = q.choices[qz.chosen].correct;
      kids.push(h('div', { class: 'verdict ' + (ok ? 'ok' : 'bad') }, ok ? '정답!' : '아쉽다, 오답이야', h('small', null, q.choices[qz.chosen].why)));
      if (!ok) kids.push(h('p', { class: 'note' }, '정답 ' + NUMS[q.answerIndex] + '번: ' + q.choices[q.answerIndex].why));
      kids.push(h('p', { class: 'lead' }, q.explain.conclusion));
      kids.push(h('button', { class: 'btn soft', id: 'quiz-next', onclick: () => { newQuiz(l.concept); render(); } }, '확인 문제 하나 더'));
    }
    return h('section', { class: 'example quiz' }, kids);
  }

  function renderLesson(root, l) {
    const idx = lessonIndex(l.id);
    const next = G.lessons[idx + 1] || null;
    const c = l.concept ? concept(l.concept) : null;
    root.appendChild(h('button', { class: 'btn small back', id: 'lesson-back', onclick: () => { view.lessonId = null; render(); window.scrollTo(0, 0); } }, '← 레슨 목록'));
    const art = h(
      'article',
      { class: 'lesson' },
      h('span', { class: 'eyebrow' }, l.part + ' · ' + (idx + 1) + '/' + G.lessons.length),
      h('h2', null, l.title),
      h('p', { class: 'goal' }, '이번 목표: ' + l.goal),
      l.sections.map((sec) =>
        h('section', { class: 'lesson-sec' }, h('h3', null, sec.h), (sec.p || []).map((t) => h('p', null, t)), sec.list ? h('ul', null, sec.list.map((t) => h('li', null, t))) : null)
      ),
      c ? h('div', { class: 'box analogy' }, h('span', { class: 'eyebrow' }, '비유로 보면'), h('p', null, c.analogy)) : null,
      c ? h('div', { class: 'box formula-box' }, h('span', { class: 'eyebrow' }, '핵심 공식'), h('p', { class: 'formula' }, c.formula)) : null,
      h('section', { class: 'lesson-sec' }, h('h3', null, '문제 푸는 순서'), h('ol', { class: 'how' }, l.how.map((t) => h('li', null, t)))),
      exampleBlock(l),
      quizBlock(l),
      h('section', { class: 'lesson-sec' }, h('h3', null, '시험 포인트'), h('ul', null, l.points.concat(c && c.remember ? [c.remember] : []).map((t) => h('li', null, t)))),
      h(
        'div',
        { class: 'actions' },
        next
          ? h('button', { class: 'btn primary', id: 'lesson-next', onclick: () => { finishLesson(l); openLesson(next.id); } }, '다 읽었어 · 다음: ' + next.title)
          : h('button', { class: 'btn primary', id: 'lesson-next', onclick: () => { finishLesson(l); view.lessonId = null; toast('마지막 레슨까지 다 읽었어!'); render(); } }, '다 읽었어 · 목록으로'),
        c
          ? h(
              'button',
              {
                class: 'btn',
                id: 'lesson-practice',
                onclick: () => {
                  finishLesson(l);
                  S.settings.subject = 'all';
                  S.settings.focus = c.id;
                  view.mode = 'normal';
                  save();
                  nextQuestion();
                  goTab('practice');
                },
              },
              '이 개념 문제 풀기'
            )
          : null
      )
    );
    root.appendChild(art);
  }

  function renderLearn(root) {
    const l = view.lessonId ? G.lessonMap[view.lessonId] : null;
    if (l) renderLesson(root, l);
    else renderLearnList(root);
  }

  // ───────── 복습 탭 ─────────
  function renderReview(root) {
    const due = P.dueReviews(S);
    const later = P.upcomingReviews(S);
    const stageName = (s) => ['1차(1일)', '2차(3일)', '3차(7일)'][s] || '';
    root.appendChild(
      h(
        'div',
        { class: 'panel' },
        h('h2', null, '복습'),
        h('p', { class: 'muted small' }, '틀린 문제는 숫자까지 똑같이 1일 → 3일 → 7일 뒤에 다시 나와. 세 번 연속 맞히면 졸업이고, 중간에 틀리면 1일부터 다시 시작해.'),
        h(
          'div',
          { class: 'tiles' },
          h('div', { class: 'tile' }, h('div', { class: 'v' }, due.length), h('div', { class: 'k' }, '오늘 복습할 문제')),
          h('div', { class: 'tile' }, h('div', { class: 'v' }, later.length), h('div', { class: 'k' }, '예정된 복습'))
        ),
        h(
          'button',
          {
            class: 'btn primary',
            id: 'start-review',
            disabled: !due.length,
            onclick: () => {
              view.mode = 'review';
              view.reviewQueue = due.map((r) => r.k);
              nextQuestion();
              goTab('practice');
            },
          },
          due.length ? '복습 시작 (' + due.length + '문제)' : '오늘은 복습할 문제가 없어'
        )
      )
    );
    const list = (title, items) =>
      items.length
        ? [
            h('h3', { class: 'group-title eyebrow' }, title),
            h(
              'div',
              { class: 'rows' },
              items.slice(0, 50).map((r) =>
                h(
                  'div',
                  { class: 'row' },
                  h('div', { class: 'row-head' }, h('span', { class: 'name' }, (concept(r.cid) || { name: r.cid }).name), h('span', { class: 'right muted small' }, r.due)),
                  h('div', { class: 'stat-line' }, h('span', null, r.k), h('span', null, stageName(r.stage)))
                )
              )
            ),
          ]
        : null;
    append(root, list('오늘', due));
    append(root, list('다가오는 복습', later));
  }

  // ───────── 기록 탭 ─────────
  function renderStats(root) {
    const recent = S.history.slice(-30);
    root.appendChild(
      h(
        'div',
        { class: 'panel' },
        h('h2', null, '기록'),
        h(
          'div',
          { class: 'tiles' },
          h('div', { class: 'tile' }, h('div', { class: 'v' }, S.streak.cur), h('div', { class: 'k' }, '현재 연속 정답')),
          h('div', { class: 'tile' }, h('div', { class: 'v' }, S.streak.best), h('div', { class: 'k' }, '최고 연속 정답')),
          h('div', { class: 'tile' }, h('div', { class: 'v' }, S.total.n), h('div', { class: 'k' }, '푼 문제')),
          h('div', { class: 'tile' }, h('div', { class: 'v' }, pct(S.total.c, S.total.n)), h('div', { class: 'k' }, '전체 정답률'))
        ),
        recent.length
          ? h('div', { class: 'panel' }, h('h3', { class: 'eyebrow' }, '최근 ' + recent.length + '문제 (왼쪽이 오래된 것)'), h('div', { class: 'dots', 'aria-label': '최근 결과' }, recent.map((x) => h('i', { class: x.ok ? 'ok' : '', title: x.k }))))
          : h('div', { class: 'empty' }, '아직 푼 문제가 없어. 연습 탭에서 첫 문제를 풀면 여기에 쌓여.')
      )
    );
    root.appendChild(h('h3', { class: 'group-title eyebrow' }, '개념별 정답률'));
    root.appendChild(
      h(
        'div',
        { class: 'rows' },
        G.concepts.map((c) => {
          const st = P.conceptStat(S, c.id);
          const rate = st.n ? st.c / st.n : 0;
          return h(
            'div',
            { class: 'row' },
            h('div', { class: 'row-head' }, h('span', { class: 'name' }, c.name), h('span', { class: 'right muted small' }, subjectName(c.subject) + (P.isUnlocked(S, c.id) ? '' : ' · 잠김'))),
            h('div', { class: 'bar' + (st.n && rate < P.UNLOCK_MIN_RATE ? ' low' : '') }, h('i', { style: 'width:' + Math.round(rate * 100) + '%' })),
            h('div', { class: 'stat-line' }, h('span', null, st.c + ' / ' + st.n + '문제'), h('span', null, pct(st.c, st.n)))
          );
        })
      )
    );
  }

  // ───────── 설정 탭 ─────────
  function renderSettings(root) {
    const m = view.msg;
    const sw = (id, key, title, desc) =>
      h(
        'label',
        { class: 'switch field', for: id },
        h('input', {
          type: 'checkbox',
          id,
          checked: !!S.settings[key],
          onchange: (e) => {
            S.settings[key] = e.target.checked;
            save();
            if (key === 'skipOrder') nextQuestion();
            render();
          },
        }),
        h('span', null, h('strong', null, title), h('br'), h('span', { class: 'muted small' }, desc))
      );
    const themeSel = h(
      'select',
      {
        id: 'theme-select',
        onchange: (e) => {
          S.settings.theme = e.target.value;
          save();
          applyTheme();
        },
      },
      h('option', { value: 'system' }, '기기 설정 따라가기'),
      h('option', { value: 'light' }, '밝게'),
      h('option', { value: 'dark' }, '어둡게')
    );
    themeSel.value = S.settings.theme || 'system';

    root.appendChild(h('h2', null, '설정'));
    if (!G.store.isAvailable())
      root.appendChild(h('div', { class: 'banner' }, '이 브라우저에서는 기록을 저장할 수 없어(개인정보 보호 모드일 수 있어). 새로고침하면 기록이 사라져.'));
    root.appendChild(
      h(
        'div',
        { class: 'rows' },
        sw('skip-order', 'skipOrder', '순서 건너뛰기 (전부 열기)', '선행 개념 조건 없이 모든 개념을 열어.'),
        sw('mix-static', 'mixStatic', '이론형 문제 섞기', '숫자 계산이 아닌 개념 문제도 가끔(약 20%) 섞어서 내.'),
        h('div', { class: 'field' }, h('label', { for: 'theme-select' }, h('strong', null, '화면 테마')), themeSel)
      )
    );

    const keyInput = h('input', { type: 'text', id: 'key-input', placeholder: '예: t:ohm-current#12345', autocapitalize: 'off', autocomplete: 'off', spellcheck: 'false' });
    root.appendChild(h('h3', { class: 'group-title eyebrow' }, '문제 번호로 다시 풀기'));
    root.appendChild(
      h(
        'div',
        { class: 'rows' },
        h(
          'div',
          { class: 'field' },
          h('p', { class: 'small muted' }, '문제 카드 오른쪽 위의 번호를 넣으면 숫자까지 똑같은 문제가 다시 나와.'),
          h(
            'div',
            { class: 'inline' },
            keyInput,
            h(
              'button',
              {
                class: 'btn',
                id: 'load-key',
                onclick: () => {
                  try {
                    loadKey(keyInput.value);
                    view.msg = {};
                    goTab('practice');
                  } catch (e) {
                    view.msg = { key: e.message };
                    render();
                  }
                },
              },
              '불러오기'
            )
          ),
          m.key ? h('p', { class: 'msg err' }, m.key) : null
        )
      )
    );

    const pasteBox = h('textarea', { id: 'import-box', placeholder: '백업 코드를 여기에 붙여 넣어' });
    root.appendChild(h('h3', { class: 'group-title eyebrow' }, '기록 백업'));
    root.appendChild(
      h(
        'div',
        { class: 'rows' },
        h(
          'div',
          { class: 'field' },
          h('p', { class: 'small muted' }, '기록은 이 브라우저(localStorage)에만 저장돼. 아이폰과 맥은 따로 저장되니까, 옮기거나 지켜 두고 싶으면 백업 코드를 만들어 메모에 붙여 둬.'),
          h(
            'div',
            { class: 'inline' },
            h('button', { class: 'btn', id: 'make-backup', onclick: () => { view.backupOut = JSON.stringify(S); render(); } }, '백업 코드 만들기'),
            view.backupOut
              ? h(
                  'button',
                  {
                    class: 'btn',
                    onclick: () => {
                      const box = document.getElementById('export-box');
                      const done = () => toast('복사했어');
                      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(view.backupOut).then(done, () => { box.select(); toast('복사가 막혀 있어. 선택된 글을 직접 복사해 줘.'); });
                      else { box.select(); toast('선택된 글을 직접 복사해 줘.'); }
                    },
                  },
                  '복사'
                )
              : null
          ),
          view.backupOut ? h('textarea', { id: 'export-box', readonly: true }, view.backupOut) : null
        ),
        h(
          'div',
          { class: 'field' },
          pasteBox,
          h(
            'button',
            {
              class: 'btn',
              id: 'import-backup',
              onclick: () => {
                try {
                  const data = JSON.parse(pasteBox.value);
                  if (!data || data.v !== 1) throw new Error('형식이 달라');
                  S = P.normalize(data);
                  save();
                  applyTheme();
                  view.msg = { imp: '가져왔어. 푼 문제 ' + S.total.n + '개.' };
                  nextQuestion();
                } catch (e) {
                  view.msg = { impErr: '백업 코드를 읽지 못했어. 처음부터 끝까지 빠짐없이 붙여 넣었는지 확인해 줘.' };
                }
                render();
              },
            },
            '백업 가져오기'
          ),
          m.imp ? h('p', { class: 'msg ok' }, m.imp) : null,
          m.impErr ? h('p', { class: 'msg err' }, m.impErr) : null
        )
      )
    );

    root.appendChild(h('h3', { class: 'group-title eyebrow' }, '초기화'));
    root.appendChild(
      h(
        'div',
        { class: 'rows' },
        h(
          'div',
          { class: 'field' },
          h('p', { class: 'small muted' }, '푼 기록, 정답률, 복습 일정을 모두 지워. 되돌릴 수 없어.'),
          view.resetArmed
            ? h(
                'div',
                { class: 'inline' },
                h(
                  'button',
                  {
                    class: 'btn danger',
                    id: 'reset-confirm',
                    onclick: () => {
                      const theme = S.settings.theme;
                      G.store.clear();
                      S = P.emptyState();
                      S.settings.theme = theme;
                      save();
                      view.resetArmed = false;
                      view.mode = 'normal';
                      nextQuestion();
                      toast('기록을 모두 지웠어');
                      render();
                    },
                  },
                  '정말 지우기'
                ),
                h('button', { class: 'btn', onclick: () => { view.resetArmed = false; render(); } }, '취소')
              )
            : h('button', { class: 'btn', id: 'reset', onclick: () => { view.resetArmed = true; render(); } }, '기록 초기화')
        )
      )
    );
    root.appendChild(h('p', { class: 'muted small' }, '버전 ' + G.version + ' · 문제 템플릿 ' + G.templateList.length + '개 · 이론형 ' + G.staticBank.length + '개 · 모든 문제는 자체 제작'));
  }

  // ───────── 그리기 ─────────
  function render() {
    renderBar();
    const root = document.getElementById('view');
    root.textContent = '';
    const fn = { learn: renderLearn, practice: renderPractice, review: renderReview, stats: renderStats, settings: renderSettings }[view.tab];
    fn(root);
  }

  // 맥 키보드: 1~4 고르기, Enter/N 다음 문제
  document.addEventListener('keydown', (e) => {
    if (view.tab !== 'practice' || !view.q || e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (!view.answered && /^[1-4]$/.test(e.key)) {
      answer(Number(e.key) - 1);
      e.preventDefault();
    } else if (view.answered && (e.key === 'Enter' || e.key === 'n' || e.key === 'N')) {
      nextQuestion();
      render();
      window.scrollTo(0, 0);
      e.preventDefault();
    }
  });

  function start() {
    if (!S.settings.theme) S.settings.theme = 'system';
    if (S.total.n === 0 && !Object.keys(S.lessons || {}).length) view.tab = 'learn';
    applyTheme();
    nextQuestion();
    render();
    if (G.aiTutor) G.aiTutor.onReady(() => render());
  }

  // 테스트(브라우저 점검)용 진입점
  function _load(key) {
    loadKey(key);
    view.tab = 'practice';
    render();
  }
  G.ui = { start, _view: view, _state: () => S, _load, _answer: answer, _openLesson: openLesson };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})(globalThis.GISA);

</script>
</body>
</html>
