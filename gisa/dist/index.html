  P('base-ratio', '몇 배가 될까', 'A = B²/C 같은 관계에서 B와 C를 몇 배 바꾸면 A가 몇 배가 되는지 묻는 문제야.', '분자 값의 배수는 곱하고 분모 값의 배수는 나눠. 제곱이 붙은 값은 배수도 제곱해서 넣어.', '제곱이 붙은 값만 제곱해야 해. 전부 제곱하거나 하나도 안 하면 틀려.');
  P('s:st-base-ampere', '전류의 정의', '1 A가 무엇을 뜻하는지 묻는 이론 문제야.', '전류는 1초 동안 지나가는 전하량이야. I = Q/t, 그래서 1 A = 1 C/s.', '전력의 정의(1 W = 1 J/s)와 헷갈리기 쉬워. 전하는 C, 에너지는 J야.');

  // ───────── 회로: 기초 ─────────
  P('ohm-current', '전류 구하기', '저항과 걸린 전압을 주고 흐르는 전류를 묻는 문제야.', 'I = V ÷ R. 저항이 클수록 전류는 작아지는 감각으로 답을 확인해.', 'V × R이나 R ÷ V는 나올 수 없는 계산이야. 보기에 있으면 함정이야.');
  P('ohm-voltage', '전압 구하기', '저항과 흐르는 전류를 주고 저항 양 끝의 전압을 묻는 문제야.', 'V = I × R. 전류가 같으면 저항이 클수록 전압도 커.', '나누면 안 돼. 전압은 전류와 저항의 "곱"이야.');
  P('ohm-resistance', 'mA로 저항 구하기', '전압과 mA 단위의 전류를 주고 저항을 Ω으로 묻는 문제야.', 'mA를 A로(÷1000) 먼저 바꾸고 R = V ÷ I. 결과가 크면 kΩ으로 바꿔 읽어.', 'mA를 그대로 넣으면 1000배 틀려. 오답 보기에 단골로 들어 있어.');
  P('series-total', '직렬 합성저항', '저항 여러 개를 직렬로 연결했을 때 합성저항을 묻는 문제야.', '저항을 전부 더해. 답은 가장 큰 저항보다 커야 해.', '역수를 더하는 건 병렬 계산이야. 직렬은 값 자체를 더해.');
  P('series-current', '직렬 회로의 전류', '직렬 저항과 전원 전압을 주고 전류를 묻는 문제야.', '합성저항(저항 합)을 먼저 구하고 I = V ÷ 합성저항. 직렬이라 모든 저항에 같은 전류가 흘러.', '저항 하나만으로 나누면 틀려. 전원은 전체 저항을 상대해.');
  P('parallel-two', '저항 2개 병렬', '저항 두 개를 병렬로 연결한 합성저항을 묻는 문제야.', '곱 나누기 합: R₁R₂/(R₁ + R₂). 답은 작은 저항보다 작아야 해. 같은 저항 두 개면 절반이야.', '그냥 더하면 직렬 계산이야. 병렬은 오히려 작아져.');
  P('parallel-three', '저항 3개 병렬', '저항 세 개를 모두 병렬로 연결한 합성저항을 묻는 문제야.', '1/R = 1/R₁ + 1/R₂ + 1/R₃을 더한 뒤 마지막에 뒤집어. 또는 두 개씩 차례로 합쳐.', '역수 합에서 멈추거나, 곱 나누기 합을 세 개에 그대로 쓰면 틀려.');
  P('parallel-current', '병렬 회로의 전체 전류', '병렬 저항과 전원 전압을 주고 전원에서 나오는 전체 전류를 묻는 문제야.', '병렬은 모든 갈래에 같은 전압이야. 갈래마다 I = V ÷ R을 구해서 더해.', '한 갈래 전류만 답하면 안 돼. 전체는 갈래 전류의 합이야.');
  P('divider-two', '저항 2개 전압 분배', '직렬 저항 두 개 중 하나에 걸리는 전압을 묻는 문제야.', '구하는 저항 ÷ 전체 저항 = 그 저항의 몫. 전원 전압에 그 몫을 곱해.', '분자에 반대쪽 저항을 넣으면 다른 저항의 전압이 나와.');
  P('divider-three', '저항 3개 전압 분배', '직렬 저항 세 개 중 가운데 저항에 걸리는 전압을 묻는 문제야.', '분모는 세 저항의 합, 분자는 구하는 저항. 나머지 전압과 더해서 전원 전압이 되는지 검산해.', '분모에서 하나를 빠뜨리거나 셋이 똑같이 나눈다고 생각하면 틀려.');
  P('power-i2r', '전류와 저항으로 전력', '저항과 흐르는 전류를 주고 소비전력을 묻는 문제야.', '주어진 값이 I와 R이니까 P = I²R. 제곱을 먼저 계산해.', 'I × R은 전압이야. 제곱을 빠뜨리지 마.');
  P('power-v2r', '전압과 저항으로 전력', '저항과 걸린 전압을 주고 소비전력을 묻는 문제야.', '주어진 값이 V와 R이니까 P = V²/R. 전압이 일정하면 저항이 작을수록 전력이 커.', 'V/R은 전류야. 제곱과 나눗셈 순서를 확인해.');
  P('power-ratio', '전력이 몇 배가 될까', '전압·전류·저항을 몇 배 바꾸면 전력이 몇 배가 되는지 묻는 문제야.', '무엇이 일정한지부터 봐. 전압 일정이면 P = V²/R, 전류 일정이면 P = I²R을 써서 배수를 계산해.', '저항을 바꾸면 전류도 바뀌어. 일정하지 않은 값이 들어간 공식을 그대로 쓰면 틀려.');
  P('energy-kwh', '전력량(kWh) 구하기', '전력, 하루 사용 시간, 일수를 주고 전력량을 묻는 문제야.', 'W를 kW로(÷1000) 바꿔서 kW × 시간 × 일수.', 'W 그대로 곱하면 1000배 커져. 초로 바꾸는 건 J로 바꿀 때만이야.');
  P('energy-cost', '전기요금 구하기', '사용량과 kWh당 단가를 주고 요금을 묻는 문제야.', '전력량(kWh)부터 구하고 단가를 곱해.', 'kW(전력)에 단가를 곱하면 안 돼. 요금은 전력량 기준이야.');
  P('energy-joule', 'kWh를 J·MJ로 바꾸기', 'kWh를 열량 J나 MJ로 바꾸는 문제야.', '1 kWh = 1000 W × 3600 s = 3.6 MJ. 이 숫자 하나로 풀려.', '1시간을 60초로 계산하거나 kJ와 MJ를 헷갈리기 쉬워.');
  P('tp-power', '3상 유효전력', '선간전압·선전류·역률을 주고 3상 소비전력을 묻는 문제야.', 'P = √3 × V × I × cosθ. √3 × V × I가 피상전력, 거기에 역률을 곱해.', '√3을 빠뜨리거나 √3 대신 3을 곱하는 게 단골 오답이야.');
  P('tp-current', '3상 선전류', '3상 전력·전압·역률을 주고 선전류를 묻는 문제야.', 'I = P ÷ (√3 × V × cosθ). kW는 먼저 W로(×1000) 바꿔.', '역률은 곱하는 게 아니라 나눠야 해. 역률이 낮으면 전류가 커져.');

  // ───────── 회로: 교류 ─────────
  P('ac-rms', '최댓값에서 실효값', 'v = 220√2 sin ωt처럼 식이 주어지고 실효값을 묻는 문제야.', 'sin 앞의 숫자가 최댓값이야. 실효값 = 최댓값 ÷ √2.', '최댓값을 그대로 답하거나 평균값(2/π)과 헷갈리면 틀려.');
  P('ac-average', '평균값', '최댓값이 주어지고 정현파의 평균값을 묻는 문제야.', '반주기 평균값 = 2 × 최댓값 ÷ π ≈ 0.637 × 최댓값.', '절반(0.5)이나 실효값(0.707)으로 답하면 안 돼.');
  P('ac-period', '주파수와 주기', '주파수를 주고 주기를, 또는 주기를 주고 주파수를 묻는 문제야.', 'T = 1/f, f = 1/T. ms를 쓰면 s로 바꿔서 계산해.', 'ms를 s로 안 바꾸면 1000배 틀려.');
  P('ac-omega', '식에서 주파수 읽기', 'v = 311 sin(800πt)처럼 식이 주어지고 주파수를 묻는 문제야.', 't 앞의 숫자가 ω(각주파수)야. f = ω ÷ 2π.', 'ω를 그대로 주파수로 답하면 안 돼. 2π로 나눠야 해.');
  P('s:st-meter-rms', '교류계기가 가리키는 값', '교류 전압계·전류계가 어떤 값을 가리키는지 묻는 이론 문제야.', '계기와 정격 표시는 모두 실효값이야. 220 V의 최댓값은 약 311 V.', '문제에 말이 없으면 교류 값은 실효값이야.');
  P('rlc-rl', 'R-L 직렬 임피던스', 'R과 XL이 주어지고 임피던스 Z를 묻는 문제야.', 'Z = √(R² + XL²). 3-4-5, 6-8-10, 5-12-13 같은 직각삼각형이면 바로 읽혀.', 'R + XL처럼 그냥 더하면 틀려. 두 값은 직각 방향이야.');
  P('rlc-series', 'R-L-C 직렬 임피던스', 'R, XL, XC가 모두 주어지고 임피던스를 묻는 문제야.', 'XL과 XC는 반대 방향이라 먼저 빼서 X를 구해. 그다음 Z = √(R² + X²).', 'XL + XC로 더하거나 세 값을 그냥 더하면 틀려.');
  P('rlc-omega', 'ω·L·C에서 임피던스', 'R, L(mH), C(μF), ω가 주어지고 임피던스를 묻는 문제야.', 'XL = ωL, XC = 1/(ωC)를 기본 단위(H, F)로 계산한 뒤 X = XL − XC, Z = √(R² + X²).', 'mH, μF를 그대로 넣으면 10³~10⁶배 틀려.');
  P('rlc-current', '교류 회로의 전류', '전압과 R, XL이 주어지고 전류를 묻는 문제야.', 'Z를 먼저 구하고 I = V ÷ Z. 교류에서도 옴의 법칙이 그대로야.', 'R이나 X 하나만으로 나누면 틀려. 반드시 Z로 나눠.');
  P('s:st-inductor-phase', '코일의 전류 위상', '순수 코일 회로에서 전류와 전압의 위상 관계를 묻는 이론 문제야.', '코일은 전류가 전압보다 90° 늦어(지상). 콘덴서는 90° 앞서고(진상), 저항은 같아.', 'L과 C는 정반대야. 한쪽만 외우고 나머지는 거꾸로 하면 돼.');
  P('acp-active', '유효전력', '전압·전류·역률을 주고 유효전력을 묻는 문제야.', 'P = V × I × cosθ. VI는 피상전력이니까 역률만큼만 일한 몫이야.', 'sinθ를 곱하면 무효전력이 나와. 역률로 나누면 피상전력보다 커져서 틀려.');
  P('acp-reactive', '무효전력', '전압·전류·역률을 주고 무효전력을 묻는 문제야.', 'sinθ = √(1 − cos²θ)를 먼저 구하고 Q = V × I × sinθ. 역률 0.8 ↔ sin 0.6, 역률 0.6 ↔ sin 0.8.', 'sinθ = 1 − cosθ로 계산하면 틀려.');
  P('acp-apparent', 'P와 Q로 피상전력', '유효전력과 무효전력이 주어지고 피상전력을 묻는 문제야.', 'S = √(P² + Q²). 전력 삼각형의 빗변이야.', 'P + Q로 더하거나 제곱을 빼면 틀려. 답은 P, Q보다 커야 해.');
  P('acp-pf', 'R과 X로 역률', 'R-L 직렬회로에서 역률을 묻는 문제야.', 'Z = √(R² + X²)를 구하고 cosθ = R ÷ Z. 역률은 항상 1 이하야.', 'X/Z는 sinθ야. R/Z를 뒤집은 값은 1보다 커서 오답이야.');
  P('acp-q-from-p', 'P와 역률로 무효전력', '유효전력과 역률이 주어지고 무효전력을 묻는 문제야.', 'S = P ÷ cosθ를 먼저 구하고 Q = S × sinθ. (또는 Q = P × tanθ)', 'P에 sinθ를 바로 곱하면 틀려. sin은 피상전력에 곱해.');
  P('res-omega', '공진 각주파수', 'L(mH)과 C(μF)가 주어지고 공진 각주파수를 묻는 문제야.', 'ω₀ = 1 ÷ √(LC). H, F로 바꿔서 LC를 곱하고 √를 씌워.', '√를 빠뜨리거나, f₀(Hz)와 ω₀(rad/s)를 헷갈려.');
  P('res-f0', '공진 주파수', 'L과 C가 주어지고 공진 주파수 f₀를 Hz로 묻는 문제야.', 'ω₀ = 1/√(LC)를 구한 뒤 f₀ = ω₀ ÷ 2π.', '2π를 빠뜨리면 각주파수가 돼.');
  P('res-current', '공진 때의 전류', 'XL = XC인 회로에 전압을 걸고 전류를 묻는 문제야.', 'XL = XC면 공진이야. 리액턴스가 지워져서 Z = R이니까 I = V ÷ R.', '리액턴스를 계산에 넣으면 안 돼. 공진 전류가 가장 커.');
  P('res-scale', '공진 주파수가 몇 배', 'L이나 C를 몇 배 바꾸면 공진 주파수가 몇 배가 되는지 묻는 문제야.', 'f₀ ∝ 1/√(LC). LC가 몇 배 되는지 곱한 뒤 √를 씌우고 뒤집어.', '√를 빠뜨리거나 방향(반비례)을 거꾸로 하면 틀려.');
  P('res-q', '선택도 Q', 'R, L, C가 주어지고 직렬 공진회로의 선택도를 묻는 문제야.', 'Q = (1/R) × √(L/C). H, F로 바꾸고 L/C를 구해 √를 씌운 뒤 R로 나눠.', 'R로 나누는 걸 빠뜨리거나 √를 빼먹으면 틀려. R이 작을수록 Q가 커.');
  P('s:st-resonance-state', '직렬 공진 상태', '직렬 공진일 때 임피던스·전류·역률이 어떻게 되는지 묻는 이론 문제야.', 'Z는 최소(= R), 전류는 최대, 역률은 1. 병렬 공진은 정반대야.', '직렬과 병렬 공진을 서로 바꿔 외우지 마.');
  P('yd-voltage', 'Y결선 전압', 'Y결선에서 상전압과 선간전압을 서로 바꾸는 문제야.', '선간전압 = √3 × 상전압. 거꾸로면 상전압 = 선간전압 ÷ √3.', '√3을 곱할지 나눌지 방향을 헷갈려. 선간전압이 더 커야 해.');
  P('yd-current', 'Δ결선 전류', 'Δ결선에서 상전류와 선전류를 서로 바꾸는 문제야.', '선전류 = √3 × 상전류. 거꾸로면 상전류 = 선전류 ÷ √3.', 'Δ는 전압에 √3이 붙는 게 아니라 전류에 붙어.');
  P('yd-load', '결선된 부하의 선전류', '선간전압과 한 상 임피던스를 주고 Y 또는 Δ 부하의 선전류를 묻는 문제야.', '한 상으로 바꿔서 풀어. Y는 상전압 = VL/√3(선전류 = 상전류), Δ는 상전압 = VL(선전류 = √3 × 상전류).', '결선을 확인하지 않고 한 공식으로 풀면 틀려.');
  P('yd-convert', 'Δ↔Y 임피던스 변환', '같은 부하를 Δ에서 Y로, 또는 Y에서 Δ로 바꿀 때 한 상 임피던스를 묻는 문제야.', '평형 부하에서 Δ → Y는 1/3, Y → Δ는 3배.', '√3으로 계산하면 틀려. 임피던스 변환은 3이야.');
  P('s:st-wye-phase', 'Y결선 선간전압의 위상', 'Y결선 선간전압의 크기와 위상을 묻는 이론 문제야.', '선간전압은 상전압의 √3배이고 위상은 30° 앞서.', '크기는 같아도 위상 방향(앞섬/뒤짐)을 거꾸로 외우기 쉬워.');

  // ───────── 회로: 제어 ─────────
  P('lp-power', 'tⁿ의 라플라스 변환', 'f(t) = 4t³ 같은 식의 F(s)를 구하는 문제야.', 'tⁿ → n!/sⁿ⁺¹. 상수배는 그대로 앞에 두고 n!과 s의 지수 n+1을 챙겨.', 'n!을 빠뜨리거나 s의 지수를 n으로 쓰면 틀려.');
  P('lp-exp', '지수함수의 변환', 'f(t) = 3e^(−2t) 같은 식의 F(s)를 구하는 문제야.', 'e^(−at) → 1/(s + a). 상수배는 분자에 그대로 남아.', '부호를 바꿔 1/(s − a)로 쓰는 게 단골 오답이야.');
  P('lp-trig', 'sin·cos의 변환', 'f(t) = 2 sin 5t 같은 식의 F(s)를 구하는 문제야.', 'sin ωt → ω/(s² + ω²), cos ωt → s/(s² + ω²). 분자는 sin이면 ω, cos이면 s.', 'sin과 cos의 분자를 바꿔 쓰거나 분모를 s² − ω²로 쓰면 틀려.');
  P('lp-final', '초기값·최종값 정리', 'F(s)가 주어지고 f(0⁺) 또는 f(∞)를 묻는 문제야.', 'sF(s)를 만든 뒤 최종값은 s → 0, 초기값은 s → ∞ 극한을 구해.', '초기값과 최종값의 극한 방향을 바꾸거나 s를 곱하는 걸 빠뜨려.');
  P('tf-rc', 'RC 회로 전달함수', 'R과 C를 직렬로 연결하고 R 또는 C 양단을 출력으로 할 때 전달함수를 묻는 문제야.', '전압 분배로 풀어. 출력이 C면 1/(RCs+1), R이면 RCs/(RCs+1). 시정수 τ = RC.', '출력 위치(C냐 R이냐)를 확인하지 않으면 틀려. kΩ × μF = ms 단위도 조심해.');
  P('tf-rl', 'RL 회로 전달함수', 'R과 L을 직렬로 연결하고 R 또는 L 양단을 출력으로 할 때 전달함수를 묻는 문제야.', '전압 분배로 풀어. 출력이 R이면 1/((L/R)s + 1), L이면 (L/R)s/((L/R)s + 1). τ = L/R.', 'RC는 τ = RC, RL은 τ = L/R이야. 곱과 나눗셈을 바꿔 쓰지 마.');
  P('tf-feedback', '피드백 전체 이득', '전향 이득 G와 피드백 H가 숫자로 주어지고 전체 이득을 묻는 문제야.', 'C/R = G ÷ (1 + GH). 부궤환(−)이면 1 + GH야.', '분모를 1 + H로 쓰거나 1 − GH(정궤환)로 쓰면 틀려.');
  P('tf-feedback-s', 's 영역 피드백', 'G(s)가 s의 식으로 주어지고 H = 1인 피드백의 전달함수를 묻는 문제야.', 'G/(1 + G)에서 분자·분모에 G의 분모를 곱해 정리해. 극점이 −a에서 −(a + K)로 이동해.', 'G(s)를 그대로 답하거나 분모를 통분하지 않으면 틀려.');
  P('tf-standard', '1차 표준형 읽기', 'G(s) = 100/(40s + 10)을 K/(Ts + 1)로 바꿔 K나 T를 읽는 문제야.', '분자·분모를 분모의 상수항으로 나눠 상수항을 1로 만들어. 분자가 K, s 앞이 T야.', '표준형으로 바꾸기 전에 숫자를 바로 읽으면 틀려.');
  P('s:st-transfer-def', '전달함수의 정의', '전달함수가 무엇인지 묻는 이론 문제야.', '초기값을 0으로 했을 때 출력의 라플라스 변환 ÷ 입력의 라플라스 변환.', '입력과 출력을 뒤집거나 초기값을 0으로 안 두면 틀려.');

  // ───────── 전기자기학 ─────────
  P('em-coulomb-force', '쿨롱의 힘', '두 점전하의 크기와 거리를 주고 힘의 크기를 묻는 문제야.', 'F = 9×10⁹ × Q₁Q₂ ÷ r². μC, nC는 C로 바꾸고 거리는 제곱해.', '두 전하 모두 단위를 바꿔야 해. 거리 제곱을 빠뜨리지 마.');
  P('em-coulomb-ratio', '쿨롱의 힘이 몇 배', '전하나 거리를 몇 배 바꾸면 힘이 몇 배가 되는지 묻는 문제야.', 'F ∝ Q₁Q₂/r². 전하 배수는 곱하고 거리 배수는 제곱해서 나눠.', '거리가 멀어지면 힘이 커진다고 착각하지 마. 거리 제곱에 반비례야.');
  P('em-point', '점전하의 전계·전위', '점전하의 크기와 거리를 주고 전계 또는 전위를 묻는 문제야.', '전계 E = 9×10⁹ Q/r² [V/m], 전위 V = 9×10⁹ Q/r [V]. nC이면 9×10⁹ × 10⁻⁹ = 9로 간단해져.', '전계는 r², 전위는 r이야. 단위(V/m, V)로 구분해.');
  P('em-line', '직선 전하의 전계', '무한히 긴 직선 전하의 선전하밀도와 거리를 주고 전계를 묻는 문제야.', 'E = λ/(2πε₀r) = 18×10⁹ × λ/r. 거리에 한 번만 반비례해.', '점전하 공식(9×10⁹, r²)을 그대로 쓰면 틀려.');
  P('s:st-em-conductor', '도체 내부의 전계', '정전 평형 상태 도체 내부의 전계를 묻는 이론 문제야.', '도체 내부 전계는 0이고 전하는 표면에만 있어. 도체 전체가 등전위야.', '내부 전계는 0이지만 전위는 0이 아니야. 표면과 같은 값이야.');
  P('em-cap-scale', '콘덴서 용량이 몇 배', '극판 면적, 간격, 유전체를 바꾸면 용량이 몇 배가 되는지 묻는 문제야.', 'C = ε₀εₛS/d. 면적과 비유전율은 곱하고 간격은 나눠.', '간격을 분자에 넣으면 틀려. 간격이 멀어지면 용량은 줄어.');
  P('em-cap-plate', '평행판 콘덴서 용량', '면적, 간격, 비유전율을 주고 정전용량을 pF로 묻는 문제야.', 'C = ε₀εₛS/d (ε₀ = 8.855×10⁻¹²). mm는 m로 바꿔 계산하고 pF로 환산해.', 'mm를 m로 안 바꾸면 1000배 틀려. 비유전율도 빠뜨리지 마.');
  P('em-cap-combo', '콘덴서 직렬·병렬', '콘덴서 두 개를 직렬 또는 병렬로 연결한 합성 용량을 묻는 문제야.', '병렬은 더하고, 직렬은 곱 나누기 합. 저항과 정반대야.', '저항 공식을 그대로 쓰면 틀려. 콘덴서 직렬 = 저항 병렬 꼴이야.');
  P('em-cap-energy', '콘덴서 저장 에너지', '정전용량과 충전 전압을 주고 저장된 에너지를 묻는 문제야.', 'W = ½CV². μF는 F로 바꾸고 전압은 제곱해.', '½을 빠뜨리거나 전압을 제곱하지 않으면 틀려.');
  P('em-mag-wire', '직선 도선의 자계', '긴 직선 도선의 전류와 거리를 주고 자계를 묻는 문제야.', 'H = I ÷ (2πr). 앙페르 법칙에서 원둘레 2πr로 나눈 거야.', '원형 코일 공식(2a)과 바꿔 쓰지 마.');
  P('em-mag-coil', '원형 코일 중심의 자계', '반지름, 감은 수, 전류를 주고 코일 중심의 자계를 묻는 문제야.', 'H = NI ÷ (2a). 감은 수 N을 곱하고 지름(2a)으로 나눠.', 'π가 들어가는 직선·환상 공식을 쓰면 틀려. N을 빠뜨리지 마.');
  P('em-mag-solenoid', '솔레노이드의 자계', '환상 솔레노이드나 무한장 솔레노이드의 내부 자계를 묻는 문제야.', '환상은 H = NI/(2πr), 무한장은 H = nI (n = N/l, 1 m당 감은 수).', 'n이 "1 m당" 감은 수라는 걸 잊고 N을 그대로 쓰면 틀려.');
  P('em-force-bil', '도체가 받는 힘', '자속밀도, 전류, 길이, 각도를 주고 전자력을 묻는 문제야.', 'F = BIl·sinθ. θ는 도체와 자계 사이 각이야. 90°면 최대, 0°면 0.', 'sin 대신 cos을 쓰거나 각도를 빠뜨리면 틀려.');
  P('em-force-parallel', '평행 도선 사이의 힘', '평행한 두 도선의 전류와 거리를 주고 1 m당 힘을 묻는 문제야.', 'F = 2I₁I₂/r × 10⁻⁷ [N/m]. 같은 방향이면 흡인, 반대 방향이면 반발.', '2를 빠뜨리거나 거리를 제곱하면 틀려. 전하(같은 부호 반발)와 반대 규칙이야.');
  P('s:st-em-parallel-current', '평행 전류의 힘의 방향', '같은 방향으로 흐르는 평행 도선 사이의 힘을 묻는 이론 문제야.', '같은 방향 전류는 끌어당기고(흡인), 반대 방향은 밀어내(반발).', '전하는 같은 부호가 반발이라 정반대야.');
  P('em-faraday', '자속 변화로 생기는 기전력', '코일의 감은 수와 자속 변화·시간을 주고 유도 기전력을 묻는 문제야.', 'e = N × ΔΦ/Δt. ΔΦ는 나중 자속 − 처음 자속.', '자속의 크기가 아니라 변화량을 써야 해. 시간으로 나누는 걸 잊지 마.');
  P('em-motional', '움직이는 도체의 기전력', '자속밀도, 길이, 속도, 각도를 주고 도체에 생기는 기전력을 묻는 문제야.', 'e = Blv·sinθ. 자계를 직각으로 가를 때(90°) 최대야.', 'sin 대신 cos을 쓰거나 각도를 빠뜨리면 틀려.');
  P('em-ind-energy', '코일 저장 에너지', '인덕턴스와 전류를 주고 코일에 저장된 에너지를 묻는 문제야.', 'W = ½LI². mH는 H로 바꾸고 전류는 제곱해.', '½을 빠뜨리거나 전류를 제곱하지 않으면 틀려.');
  P('em-ind-self', '자기 인덕턴스 구하기', '감은 수, 전류, 쇄교 자속으로 자기 인덕턴스를 묻는 문제야.', 'L = NΦ ÷ I. 단위를 mWb로 맞추면 답이 mH로 나와.', '감은 수 N을 빠뜨리면 틀려. 자속과 전류의 위치도 확인해.');
  P('em-ind-mutual', '상호 인덕턴스', '두 코일의 인덕턴스와 결합계수로 상호 인덕턴스를 묻는 문제야.', 'M = k × √(L₁L₂). 기하평균을 구한 뒤 k를 곱해.', '√를 빠뜨리거나 평균(산술)을 내면 틀려. k는 1 이하야.');
  P('em-ind-series', '코일 직렬 합성', '두 코일을 가동 또는 차동 결합으로 직렬 연결한 합성 인덕턴스를 묻는 문제야.', '가동(자속 같은 방향)은 L₁ + L₂ + 2M, 차동은 L₁ + L₂ − 2M.', '2를 빠뜨리거나 가동·차동 부호를 바꾸면 틀려.');
  P('em-mc-flux', '철심의 자속', '자기저항, 감은 수, 전류를 주고 자속을 묻는 문제야.', '기자력 F = NI를 구하고 Φ = F ÷ Rm. 자기회로 옴의 법칙이야.', '자기저항으로 나눠야 해. 곱하거나 N을 빠뜨리면 틀려.');
  P('em-mc-scale', '자기저항이 몇 배', '길이, 단면적, 투자율을 바꾸면 자기저항이 몇 배가 되는지 묻는 문제야.', 'Rm = l/(μS). 길이는 분자, 투자율과 단면적은 분모로 배수를 계산해.', '전기저항 R = ρl/S와 같은 꼴이라는 걸 기억해. 투자율이 크면 저항은 작아져.');

  // ───────── 전력공학 ─────────
  P('pw-vdrop-3ph', '3상 선로의 전압강하', 'R, X, 전류, 역률을 주고 전압강하나 송전단 전압을 묻는 문제야.', 'e = √3 × I × (R cosθ + X sinθ). 송전단 전압 = 수전단 전압 + e.', 'R에는 cos, X에는 sin이야. 단상 2선식 계수(2)와 헷갈리지 마.');
  P('pw-vdrop-rate', '전압강하율', '송전단·수전단 전압을 주고 전압강하율을 % 로 묻는 문제야.', '(송전단 − 수전단) ÷ 수전단 × 100.', '분모는 수전단이야. 송전단으로 나누면 틀려.');
  P('s:st-pw-ferranti', '페란티 현상', '장거리 선로에서 수전단 전압이 오르는 현상의 원인·대책을 묻는 이론 문제야.', '원인은 선로 정전용량의 충전전류(진상)야. 대책은 분로 리액터.', '콘덴서를 달면 오히려 심해져. 진상 문제에는 리액터를 써.');
  P('pw-loss-3i2r', '3상 선로 손실 3I²R', '선전류와 한 선의 저항을 주고 선로 전체 손실을 묻는 문제야.', 'Pℓ = 3I²R. 선이 세 가닥이라 한 선 손실의 3배야.', '한 선만 구하거나 √3을 곱하면 틀려.');
  P('pw-loss-power', '전력·전압·역률로 손실', '송전 전력, 전압, 역률, 저항을 주고 선로 손실을 묻는 문제야.', 'I = P/(√3 V cosθ)를 구해 3I²R. 또는 Pℓ = P²R/(V²cos²θ). W, V 단위로 계산하고 마지막에 kW로.', '역률을 빠뜨리거나 제곱하지 않으면 틀려. 단위(kW, kV)를 맞춰.');
  P('pw-loss-ratio', '손실이 몇 배', '전압을 올리거나 역률을 개선하면 손실이 몇 배가 되는지 묻는 문제야.', '손실 ∝ 1/V², ∝ 1/cos²θ. 전압 k배면 1/k², 역률 a → b면 (a/b)².', '제곱을 빠뜨리거나 방향을 거꾸로 하면 틀려. 좋아지면 손실은 줄어.');
  P('pw-short-current', '단락전류', '정격전류와 %임피던스를 주고 단락전류를 묻는 문제야.', 'Is = (100 ÷ %Z) × In.', '%Z를 곱하면 안 돼. %Z가 작을수록 단락전류가 커.');

// 학습 기록 로직(순수 함수). 저장은 storage.js가 맡는다.
(function (G) {
  'use strict';

  const UNLOCK_MIN_ATTEMPTS = 3;
  const UNLOCK_MIN_RATE = 0.6;
  const REVIEW_DAYS = [1, 3, 7]; // 틀림 → 1일 뒤 → (맞히면) 3일 뒤 → (맞히면) 7일 뒤 → (맞히면) 졸업
  const HISTORY_MAX = 500;
  const MASTER_STREAK = 3; // 한 포인트에서 연속 3문제를 맞히면 "익숙해짐"
  // 기기를 넘나들며 합치는 설정. 나머지(화면 테마, 과목 필터, 동기화 켜기)는 기기마다 따로 둔다.
  const SYNC_SETTINGS = ['skipOrder', 'mixStatic'];
  const DONE_MAX = 500;

  function emptyState() {
    return {
      v: 1,
      settings: { skipOrder: false, mixStatic: true, subject: 'all', focus: 'auto', theme: 'system', allSubjects: true, syncOn: true },
      concepts: {},
      streak: { cur: 0, best: 0 },
      total: { n: 0, c: 0 },
      reviews: {},
      history: [],
      lessons: {},
      points: {},
      reviewDone: {}, // 졸업한 복습 {문제 번호: 시각} — 다른 기기에서 되살아나지 않게
      updatedAt: 0, // 기록이 마지막으로 바뀐 시각(ms)
      resetAt: 0, // 기록을 초기화한 시각(ms)
    };
  }

  // 날짜는 기기 현지 기준 'YYYY-MM-DD'
  function today(d) {
    const x = d || new Date();
    const p = (k) => String(k).padStart(2, '0');
    return x.getFullYear() + '-' + p(x.getMonth() + 1) + '-' + p(x.getDate());
  }

  function addDays(day, k) {
    const [y, m, d] = day.split('-').map(Number);
    return today(new Date(y, m - 1, d + k));
  }

  function conceptStat(state, id) {
    return state.concepts[id] || { n: 0, c: 0 };
  }

  function prereqMet(state, id) {
    const s = conceptStat(state, id);
    return s.n >= UNLOCK_MIN_ATTEMPTS && s.c / s.n >= UNLOCK_MIN_RATE;
  }

  // 레슨을 읽은 개념도 열린다(읽기 = 레벨업)
  function lessonRead(state, conceptId) {
    const l = G.lessonFor ? G.lessonFor(conceptId) : null;
    return !!(l && state.lessons && state.lessons[l.id]);
  }

  function markLessonRead(state, lessonId) {
    if (!state.lessons) state.lessons = {};
    if (!state.lessons[lessonId]) state.lessons[lessonId] = { t: Date.now() };
  }

  function isUnlocked(state, id) {
    if (state.settings.skipOrder) return true;
    if (lessonRead(state, id)) return true;
    const c = G.conceptMap[id];
    return !!c && c.prereqs.every((p) => prereqMet(state, p));
  }

  // 잠금 해제 조건 진행도: [{id, name, n, rate, met}]
  function unlockStatus(state, id) {
    return G.conceptMap[id].prereqs.map((p) => {
      const s = conceptStat(state, p);
      return { id: p, name: G.conceptMap[p].name, n: s.n, rate: s.n ? s.c / s.n : 0, met: prereqMet(state, p) };
    });
  }

  // 정답 기록. opts.day = 오늘 날짜(테스트용 주입)
  function record(state, q, ok, opts) {
    const day = (opts && opts.day) || today();
    const cs = state.concepts[q.conceptId] || (state.concepts[q.conceptId] = { n: 0, c: 0 });
    cs.n += 1;
    if (ok) cs.c += 1;
    state.total.n += 1;
    if (ok) state.total.c += 1;
    state.streak.cur = ok ? state.streak.cur + 1 : 0;
    state.streak.best = Math.max(state.streak.best, state.streak.cur);

    const rv = state.reviews[q.key];
    let reviewEvent = null;
    if (!ok) {
      state.reviews[q.key] = { k: q.key, cid: q.conceptId, stage: 0, due: addDays(day, REVIEW_DAYS[0]), u: Date.now() };
      if (state.reviewDone) delete state.reviewDone[q.key];
      reviewEvent = rv ? 'reset' : 'added';
    } else if (rv && rv.due <= day) {
      const next = rv.stage + 1;
      if (next >= REVIEW_DAYS.length) {
        delete state.reviews[q.key];
        if (!state.reviewDone) state.reviewDone = {};
        state.reviewDone[q.key] = Date.now();
        reviewEvent = 'graduated';
      } else {
        rv.stage = next;
        rv.u = Date.now();
        rv.due = addDays(day, REVIEW_DAYS[next]);
        reviewEvent = 'advanced';
      }
    }
    // 포인트(문제 유형)별 기록: 연속 정답을 세어 "익숙해짐"을 판단
    const pid = G.pointId ? G.pointId(q) : null;
    if (pid) {
      if (!state.points) state.points = {};
      const ps = state.points[pid] || (state.points[pid] = { n: 0, c: 0, streak: 0 });
      ps.n += 1;
      if (ok) ps.c += 1;
      ps.streak = ok ? ps.streak + 1 : 0;
    }
    state.history.push({ k: q.key, cid: q.conceptId, ok: !!ok, t: Date.now() });
    if (state.history.length > HISTORY_MAX) state.history.splice(0, state.history.length - HISTORY_MAX);
    return reviewEvent;
  }

  function pointStat(state, pid) {
    return (state.points && state.points[pid]) || { n: 0, c: 0, streak: 0 };
  }
  function pointMastered(state, pid) {
    return pointStat(state, pid).streak >= MASTER_STREAK;
  }
  // 개념 안에서 익숙해진 포인트 수
  function conceptPoints(state, cid) {
    const list = G.pointsFor ? G.pointsFor(cid) : [];
    const pid = (p) => (p.kind === 'static' ? 's:' + p.ref : p.ref);
    return { total: list.length, mastered: list.filter((p) => pointMastered(state, pid(p))).length };
  }

  function dueReviews(state, day) {
    const d = day || today();
    return Object.values(state.reviews)
      .filter((r) => r.due <= d)
      .sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : 0));
  }

  function upcomingReviews(state, day) {
    const d = day || today();
    return Object.values(state.reviews)
      .filter((r) => r.due > d)
      .sort((a, b) => (a.due < b.due ? -1 : 1));
  }

  // 정답률 낮고 덜 푼 개념에 가중치
  function pickConcept(state, ids, rand) {
    const weights = ids.map((id) => {
      const s = conceptStat(state, id);
      let w = 1;
      if (s.n < 5) w += 2;
      if (s.n > 0 && s.c / s.n < UNLOCK_MIN_RATE) w += 2;
      return w;
    });
    const total = weights.reduce((a, b) => a + b, 0);
    let x = (rand || Math.random)() * total;
    for (let i = 0; i < ids.length; i++) {
      x -= weights[i];
      if (x < 0) return ids[i];
    }
    return ids[ids.length - 1];
  }

  // 저장본을 현재 형식에 맞춰 채움(필드가 빠졌거나 깨진 경우 대비)
  function normalize(raw) {
    const base = emptyState();
    if (!raw || typeof raw !== 'object') return base;
    const out = base;
    if (raw.settings && typeof raw.settings === 'object') Object.assign(out.settings, raw.settings);
    // 1단계(회로만 있던 때) 저장본은 한 번만 "전체" 과목으로 옮겨 준다
    if (!out.settings.allSubjects) {
      out.settings.subject = 'all';
      out.settings.focus = 'auto';
      out.settings.allSubjects = true;
    }
    if (raw.concepts && typeof raw.concepts === 'object') out.concepts = raw.concepts;
    if (raw.streak) out.streak = { cur: raw.streak.cur | 0, best: raw.streak.best | 0 };
    if (raw.total) out.total = { n: raw.total.n | 0, c: raw.total.c | 0 };
    if (raw.reviews && typeof raw.reviews === 'object') out.reviews = raw.reviews;
    if (Array.isArray(raw.history)) out.history = raw.history.slice(-HISTORY_MAX);
    if (raw.lessons && typeof raw.lessons === 'object') out.lessons = raw.lessons;
    if (raw.points && typeof raw.points === 'object') out.points = raw.points;
    if (raw.reviewDone && typeof raw.reviewDone === 'object') out.reviewDone = raw.reviewDone;
    out.updatedAt = Number(raw.updatedAt) || 0;
    out.resetAt = Number(raw.resetAt) || 0;
    return out;
  }

  // ───────── 기기 간 합치기 ─────────
  // 목적: 아이폰과 맥의 기록을 한 계정으로 이어 쓰기. 원칙은 "잃지 않기".
  //  - 개념·포인트 통계: 문제를 더 많이 푼 쪽(n이 큰 쪽)을 채택
  //  - 읽은 레슨: 합집합, 풀이 기록: 합집합(최근 500개)
  //  - 복습: 합집합. 같은 문제는 더 나중에 바뀐 쪽, 졸업했으면 졸업이 우선
  //  - 초기화(resetAt) 이후 아무 활동이 없는 쪽 기록은 버림
  // local의 기기별 설정(테마 등)은 그대로 두고, 공유 설정은 더 최근 쪽을 따른다.
  function pickBigger(a, b) {
    if (!a) return b;
    if (!b) return a;
    if (b.n > a.n || (b.n === a.n && b.c > a.c)) return b;
    return a;
  }

  function merge(local, remote) {
    const resetAt = Math.max(local.resetAt || 0, remote.resetAt || 0);
    const parts = [local, remote].filter((s) => !resetAt || (s.updatedAt || 0) > resetAt);
    const newest = parts.slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0];
    const out = emptyState();
    out.settings = Object.assign({}, local.settings);
    out.resetAt = resetAt;
    out.updatedAt = Math.max(local.updatedAt || 0, remote.updatedAt || 0, resetAt);
    if (!parts.length) return out;

    SYNC_SETTINGS.forEach((k) => {
      if (newest.settings && newest.settings[k] !== undefined) out.settings[k] = newest.settings[k];
    });
    ['concepts', 'points'].forEach((f) => {
      parts.forEach((s) => {
        Object.keys(s[f] || {}).forEach((id) => (out[f][id] = pickBigger(out[f][id], s[f][id])));
      });
    });

//  - 이 계정으로 로그인해서 연 모든 기기(아이폰·맥)가 같은 기록을 이어 쓴다. 다른 사람과는 섞이지 않는다.

//  - 올리기 전에 항상 서버 기록을 읽어 와 합친다(P.merge). 그래서 한 기기가 다른 기기 기록을 덮어쓰지 않는다.
(function (G) {
  'use strict';
  const P = G.progress;
  const DEBOUNCE_MS = 3000;
  const MAX_JSON = 220000; // 문서 한도(256 KiB) 아래로 유지

  let hooks = null; // { getState(), apply(merged, info), onStatus() }
  let ref = null;
  let timer = null;
  let chain = Promise.resolve(); // 동시에 두 번 돌지 않게 한 줄로 세움
  const status = { state: 'starting', at: 0, message: '' };

    status.state = state;
    status.message = message || '';
    if (state === 'ok') status.at = Date.now();
    if (hooks && hooks.onStatus) hooks.onStatus(status);
  }

  async function withRetry(fn) {
    try {
      return await fn();
    } catch (e) {
      if (e && e.code === 'unavailable') {
        await wait(400 + Math.random() * 600);
        return fn();
      }
      throw e;
    }
  }

  function encode(state) {
    let json = P.canon(P.syncView(state));
    if (json.length > MAX_JSON) {
      const slim = P.syncView(state);
      slim.history = slim.history.slice(-150);
      json = P.canon(slim);
    }
    return json;
  }

  function enabled() {
    const st = hooks && hooks.getState();
    return !!st && st.settings.syncOn !== false;
  }

  async function runOnce() {
    if (!ref || !enabled()) return;
    set('syncing');
    try {
      const snap = await withRetry(() => ref.get());
      const local = hooks.getState();
      let remote = null;
      let remoteJson = '';
      if (snap.exists) {
        const body = snap.data() || {};
        remoteJson = typeof body.json === 'string' ? body.json : '';
        try {
          remote = P.normalize(JSON.parse(remoteJson));
        } catch (e) {
          remote = null; // 깨진 서버 기록은 이 기기 기록으로 덮어쓴다
        }
      }
      const merged = remote ? P.merge(local, remote) : local;
      const localJson = P.canon(P.syncView(local));
      const mergedJson = P.canon(P.syncView(merged));
      const changedHere = mergedJson !== localJson;
      if (changedHere) hooks.apply(merged, { hadLocal: local.total.n > 0, hadRemote: !!remote });

        await withRetry(() => ref.set({ json: outJson, t: Date.now() }));
      }
      set('ok');

      const code = (e && e.code) || '';
      if (code === 'invalid_argument') set('readonly', '이 계정은 기록을 저장할 권한이 없어(보기 전용으로 열었을 수 있어).');
      else if (code === 'quota_exceeded') set('error', '저장 공간이 가득 찼어.');
      else if (code === 'revoked') set('error', '접근 권한이 바뀌었어. 페이지를 새로 열어 줘.');
      else set('error', '서버와 연결이 잠깐 끊겼어. 기록은 이 기기에 저장돼 있어.');
    }

  function syncNow() {
    chain = chain.then(runOnce, runOnce);
    return chain;
  }

  function schedule() {
    if (!ref || !enabled()) return;

    timer = setTimeout(syncNow, DEBOUNCE_MS);
  }

      if (!db || !user) return set('unavailable');
      const id = await user.id();
      if (!id) return set('unavailable');
      ref = db.doc('data/users/' + id + '/save');
    } catch (e) {
      return set('unavailable');
    }
    if (!enabled()) {
      set('off');
    } else {
      await syncNow();
    }
    // 다른 기기에서 쓰다 돌아왔을 때 최신 기록을 받아 온다
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && enabled()) syncNow();
      else if (document.visibilityState === 'hidden' && timer) {
        clearTimeout(timer);
        syncNow(); // 탭을 떠나기 전에 밀린 기록을 올린다
      }
    });
  }

  function setEnabled(on) {
    if (!ref) return;
    if (on) syncNow();
    else set('off');
  }

  G.sync = { init, schedule, syncNow, setEnabled, status: () => status, available: () => !!ref };
})(globalThis.GISA);

// 수식 화면: 글 속의 한 줄 수식(1/√(LC), V × R₂ / (R₁ + R₂) …)을 기출 문제집처럼
// 분자 위·분모 아래 분수, 윗줄 있는 제곱근, 위첨자로 바꿔 그린다. 바꾸는 규칙은 engine/typeset.js.
(function (G) {
  'use strict';
  if (typeof document === 'undefined' || !G.typeset) return;

  // 건드리지 않는 자리: 입력칸, 그림, 계산기·AI 패널(자기 글자를 따로 그림), 이미 바꾼 수식
  // (진행 표시 "16/44", "연속 2/3", "열린 개념 17/42" 같은 화면 장식 글자도 건드리지 않는다)
  const SKIP =
    'script,style,svg,input,textarea,select,option,#calc,#side,.ai-msg,.mf,.mf-r,.mf-sup,.cele,.toast,.qid,code.expr,' +
    '.eyebrow,.stat-line,.state,.banner,.lockbar,.tabs,.tag,.chip,.streak,.lesson-no,.bar,.progress-tile,.field,.switch,.msg,.stat-sub,.nowrap,button.row,.row-head';

  const plain = (nodes) =>
    nodes
      .map((n) => {
        if (n.t === 'tx') return n.s;
        if (n.t === 'frac') return plain(n.n) + ' 나누기 ' + plain(n.d);
        if (n.t === 'sqrt') return (n.i ? '세제곱근 ' : '루트 ') + plain(n.b);
        return ' 제곱 ' + plain(n.b);
      })
      .join('');

  function build(nodes) {
    const f = document.createDocumentFragment();
    nodes.forEach((n) => f.appendChild(one(n)));
    return f;
  }
  function el(tag, cls) {
    const e = document.createElement(tag);
    e.className = cls;
    return e;
  }
  function one(n) {
    if (n.t === 'tx') return document.createTextNode(n.s);
    if (n.t === 'frac') {
      const s = el('span', 'mf');
      s.setAttribute('role', 'math');
      s.setAttribute('aria-label', plain([n]));
      const a = el('span', 'mf-n');
      a.appendChild(build(n.n));
      const b = el('span', 'mf-d');
      b.appendChild(build(n.d));
      s.append(a, b);
      return s;
    }
    if (n.t === 'sqrt') {
      const s = el('span', 'mf-r');
      s.setAttribute('role', 'math');
      s.setAttribute('aria-label', plain([n]));
      if (n.i) {
        const i = el('span', 'mf-ri');
        i.appendChild(build(n.i));
        s.appendChild(i);
      }
      const sign = el('span', 'mf-rs');
      sign.textContent = '√';
      const body = el('span', 'mf-rb');
      body.appendChild(build(n.b));
      s.append(sign, body);
      return s;
    }
    const sup = el('sup', 'mf-sup');
    sup.appendChild(build(n.b));
    return sup;
  }

  function typeset(root) {
    if (!root) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    const targets = [];
    let n;
    while ((n = walker.nextNode())) {
      const v = n.nodeValue;
      if (!v || !/[/√∛^]/.test(v)) continue;
      const p = n.parentElement;
      if (!p || p.closest(SKIP)) continue;
      targets.push(n);
    }
    targets.forEach((tn) => {
      const nodes = G.typeset(tn.nodeValue);
      if (nodes) tn.parentNode.replaceChild(build(nodes), tn);
    });
  }

  G.mathUi = { typeset };
})(globalThis.GISA);

// 익숙해졌을 때 축하 효과: 🎉 파티 폭죽처럼 작은 색종이가 그 자리(anchor)에서만 터진다.

(function (G) {
  'use strict';
  if (typeof document === 'undefined') return;

  const COLORS = ['#e8553d', '#f2b134', '#3fae7a', '#3d8fe0', '#a867d6', '#ef6aa0'];
  const PER_CANNON = 14;
  let layer = null;
  let timer = 0;

  const reduced = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const rnd = (a, b) => a + Math.random() * (b - a);

  function clear() {
    clearTimeout(timer);

  }

  function cannon(x, y, dir) {

      p.className = 'cele-bit' + (i % 3 === 0 ? ' round' : '');
      const size = rnd(5, 9);
      p.style.width = size + 'px';
      p.style.height = (i % 3 === 0 ? size : size * 1.7) + 'px';
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      p.style.background = COLORS[(i + (dir > 0 ? 0 : 3)) % COLORS.length];
      layer.appendChild(p);
      const dx = dir * rnd(18, 90);
      const up = rnd(40, 95);
      const fall = rnd(20, 70);
      const rot = rnd(-540, 540);
      const dur = rnd(900, 1500);
      if (p.animate) {
        p.animate(
          [
            { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
            { transform: 'translate(' + dx * 0.65 + 'px,' + -up + 'px) rotate(' + rot * 0.5 + 'deg)', opacity: 1, offset: 0.4 },
            { transform: 'translate(' + dx + 'px,' + fall + 'px) rotate(' + rot + 'deg)', opacity: 0 },
          ],
          { duration: dur, easing: 'cubic-bezier(.2,.7,.4,1)', fill: 'forwards' }
        );
      }

  }

    const top = r.top + sy;
    const badge = document.createElement('div');
    badge.className = 'cele-badge';
    const b1 = document.createElement('strong');
    b1.textContent = '🎉 ' + title;
    badge.appendChild(b1);
    if (sub) {
      const b2 = document.createElement('span');
      b2.textContent = sub;
      badge.appendChild(b2);
    }
    badge.style.left = r.left + sx + r.width / 2 + 'px';
    badge.style.top = top - 6 + 'px';
    layer.appendChild(badge);
    cannon(r.left + sx + 6, top + 4, 1);
    cannon(r.right + sx - 6, top + 4, -1);

        html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><rect x="8" y="5.5" width="8" height="3.5" rx="0.8"/><path d="M8.5 13h.01M12 13h.01M15.5 13h.01M8.5 16.5h.01M12 16.5h.01M15.5 16.5h.01"/></svg>',
      }
    );
  }

  // 풀기 전에 풀이를 보려 하면 정답이 드러난다고 한 번 알려 준다
  function calcAsk(q) {
    if (!view.calcAsk || view.answered) return null;
    return h(
      'div',
      { class: 'calc-ask', id: 'calc-ask' },
      h('span', null, '계산기 풀이를 보면 정답이 드러나. 그래도 볼래?'),
      h('button', { class: 'btn small primary', id: 'calc-ask-yes', onclick: () => { view.calcAsk = false; G.calcDemo.start(q); render(); } }, '볼래'),
      h('button', { class: 'btn small', id: 'calc-ask-no', onclick: () => { view.calcAsk = false; render(); } }, '아니, 내가 풀래')
    );
  }

  function hintsBlock(q) {
    if (view.answered) return null;
    const body = [];
    if (view.hint >= 1) body.push(h('div', { class: 'hint-body' }, h('span', { class: 'eyebrow' }, '힌트 1 · 개념 카드'), h('p', null, q.hints.card)));
    if (view.hint >= 2) body.push(h('div', { class: 'hint-body' }, h('span', { class: 'eyebrow' }, '힌트 2 · 쓸 공식'), h('p', { class: 'formula' }, q.hints.formula)));
    return h(
      'div',
      { class: 'hints' },
      h(
        'div',
        { class: 'hint-row' },
        h('button', { class: 'btn small soft', id: 'hint1', disabled: view.hint >= 1, onclick: () => { view.hint = 1; render(); } }, '힌트 1 · 개념 카드'),
        h('button', { class: 'btn small soft', id: 'hint2', disabled: view.hint !== 1, onclick: () => { view.hint = 2; render(); } }, '힌트 2 · 쓸 공식')
      ),
      body
    );
  }

  function choiceList(q) {
    return h(
      'ol',
      { class: 'choices' },
      q.choices.map((c, i) => {
        let cls = 'choice';
        if (view.answered) {
          if (c.correct) cls += ' is-correct';
          else if (i === view.chosen) cls += ' is-wrong';
          else cls += ' is-dim';
        }
        return h(
          'li',
          null,
          h(
            'button',
            { class: cls, disabled: view.answered, onclick: () => answer(i), 'data-i': i },
            h('span', { class: 'no' }, NUMS[i]),
            h('span', { class: 'lab' }, c.label)
          )
        );
      })
    );
  }

  function reviewNote() {
    const e = view.event;
    if (e === 'added') return '틀린 문제라 같은 숫자 그대로 내일 복습 목록에 넣었어. (1일 → 3일 → 7일)';
    if (e === 'reset') return '복습 문제를 다시 틀려서 내일부터 다시 시작해.';
    if (e === 'advanced') return '복습 통과! 다음 복습 날짜: ' + (S.reviews[view.q.key] || {}).due;
    if (e === 'graduated') return '복습 3단계를 모두 통과해서 이 문제는 졸업했어.';
    return null;
  }

  function explainBlock(q) {
    const chosen = q.choices[view.chosen];
    const ok = chosen.correct;
    const ex = q.explain;
    const c = concept(q.conceptId);
    const cards = [];
    cards.push(
      h(
        'div',
        { class: 'verdict ' + (ok ? 'ok' : 'bad'), role: 'status' },
        ok ? '정답!' : '아쉽다, 오답이야',
        h('small', null, ok ? '연속 정답 ' + S.streak.cur + '개째' : '정답은 ' + NUMS[q.answerIndex] + '번 · ' + q.choices[q.answerIndex].label)
      )
    );
    const steps = ex.steps.map((s) => (s.indexOf('검산: ') === 0 ? h('li', { class: 'check' }, s) : h('li', null, s)));
    cards.push(
      h(
        'div',
        { class: 'explain' },
        h('section', { class: 'ex' }, h('h3', null, h('span', { class: 'n' }, '1'), '한 줄 결론'), h('p', { class: 'lead' }, ex.conclusion)),
        h(
          'section',
          { class: 'ex' },
          h('h3', null, h('span', { class: 'n' }, '2'), '개념 카드 · ' + c.name),
          h('p', null, ex.card),
          view.analogy
            ? h('p', { class: 'analogy' }, ex.analogy)
            : h('div', null, h('button', { class: 'btn small soft', id: 'easier', onclick: () => { view.analogy = true; render(); } }, '더 쉽게 설명'))
        ),
        h('section', { class: 'ex' }, h('h3', null, h('span', { class: 'n' }, '3'), '풀이'), h('ol', null, steps)),
        h('section', { class: 'ex' }, h('h3', null, h('span', { class: 'n' }, '4'), '함정 · 기억할 점'), h('ul', null, ex.traps.map((t) => h('li', null, t)))),
        h(
          'section',
          { class: 'ex' },
          h('h3', null, '보기별 해설'),
          h(
            'ul',
            { class: 'per-choice' },
            q.choices.map((ch, i) =>
              h(
                'li',
                null,
                h('span', { class: 'pc-mark ' + (ch.correct ? 'ok' : 'bad') }, NUMS[i] + ' ' + (ch.correct ? '정답' : '오답')),
                h('span', { class: 'pc-label' }, ch.label, i === view.chosen ? h('span', { class: 'mine' }, '내 선택') : null),
                h('span', { class: 'pc-why' }, ch.why)
              )
            )
          )
        )
      )
    );
    const notes = [];
    const rn = reviewNote();
    if (rn) notes.push(h('p', { class: 'note' }, rn));
    if (view.unlocked.length) notes.push(h('p', { class: 'note' }, '새 개념이 열렸어: ' + view.unlocked.map((id) => concept(id).name).join(', ')));
    cards.push(notes);
    const actions = [
      h('button', { class: 'btn primary', id: 'next', onclick: () => { nextQuestion(); render(); window.scrollTo(0, 0); } }, '다음 문제'),
      h('button', { class: 'btn', id: 'retry', onclick: () => { resetCard(); view.q = G.fromKey(q.key); render(); window.scrollTo(0, 0); } }, '같은 문제 다시'),
    ];
    if (!ok) {
      c.prereqs.forEach((pid) =>
        actions.push(
          h(
            'button',
            {
              class: 'btn soft',
              onclick: () => {
                view.mode = 'basics';
                view.basics = { focus: pid, from: c.id };
                nextQuestion();
                render();
                window.scrollTo(0, 0);
              },
            },
            '기초로 내려가기: ' + concept(pid).name
          )
        )
      );
    }
    if (view.mode === 'drill' && view.drill && view.drill.pid && P.pointMastered(S, view.drill.pid)) {
      const d = view.drill;
      actions.push(
        h('button', { class: 'btn soft', id: 'drill-back-bottom', onclick: () => { view.mode = 'normal'; view.drill = null; openUnit(d.cid, true); } }, '익숙해졌어! 단락으로 돌아가기')
      );
    }
    cards.push(h('div', { class: 'actions' }, actions));
    return cards;
  }

  function questionCard() {
    if (!subjectReady()) {
      const s = G.subjects.find((x) => x.id === practiceSubject());
      return h(
        'div',
        { class: 'empty' },
        h('strong', null, s.name),
        h('p', null, s.id === 'code' ? '전기설비기술기준은 최신 기준을 확인한 뒤에 따로 추가할 거야.' : '이 과목은 다음 단계에서 채울 예정이야. 지금은 회로이론 및 제어공학을 풀 수 있어.'),
        h('button', { class: 'btn', onclick: () => { S.settings.subject = 'circuit'; save(); nextQuestion(); render(); } }, '회로·제어로 가기')
      );
    }
    const q = view.q;
    if (!q) return h('div', { class: 'empty' }, '풀 수 있는 개념이 없어. 설정에서 "순서 건너뛰기"를 켜 봐.');
    const c = concept(q.conceptId);
    const isReview = !!S.reviews[q.key] && view.mode === 'review';
    return h(
      'article',
      { class: 'qcard', 'aria-live': 'polite' },
      h(
        'div',
        { class: 'qmeta' },
        h('span', { class: 'tag' }, c.name),
        h('span', { class: 'tag plain' }, c.group + (q.source === 'static' ? ' · 이론형' : '')),
        isReview ? h('span', { class: 'tag review' }, '복습') : null,
        h('span', { class: 'qid', title: '문제 번호 (설정에서 다시 불러올 수 있어)' }, q.key)
      ),
      h('div', { class: 'qrow' }, h('p', { class: 'qtext' }, q.text), calcButton(q)),
      calcAsk(q),
      q.svg ? h('div', { class: 'figure', html: q.svg }) : null,
      hintsBlock(q),
      choiceList(q),
      G.aiTutor ? G.aiTutor.panel(q, () => ({ answered: view.answered, chosen: view.chosen })) : null,
      view.answered ? explainBlock(q) : null
    );
  }

  // 잠긴 개념이 있으면 몇 개가 열렸는지와 "전부 열기"를 연습 화면에서 바로 보여 준다
  function lockBar() {
    if (S.settings.skipOrder || !subjectReady() || view.mode === 'drill') return null;
    const list = G.concepts.filter((c) => c.subject !== 'base' && inSubject(c));
    const open = list.filter((c) => P.isUnlocked(S, c.id)).length;
    if (open === list.length) return null;
    return h(
      'div',
      { class: 'lockbar' },
      h('span', null, h('strong', null, '열린 개념 ' + open + '/' + list.length), ' · 선행 개념을 ' + P.UNLOCK_MIN_ATTEMPTS + '문제 이상, 정답률 ' + P.UNLOCK_MIN_RATE * 100 + '% 이상 맞히면 다음 개념이 열려.'),
      h('span', { class: 'lockbar-btns' },
        h('button', { class: 'btn small', onclick: () => goTab('learn') }, '배우기'),
        h('button', { class: 'btn small soft', id: 'open-all', onclick: () => { S.settings.skipOrder = true; save(); toast('모든 개념을 열었어. 설정에서 다시 끌 수 있어.'); render(); } }, '전부 열기')
      )
    );
  }

  function renderPractice(root) {
    root.appendChild(h('div', { class: 'panel' }, subjectChips(), lockBar(), subjectReady() && view.mode !== 'review' && view.mode !== 'drill' ? conceptPicker() : null));
    const b = modeBanner();
    if (b) root.appendChild(b);
    root.appendChild(questionCard());
  }

  // ───────── 배우기 탭 ─────────
  function lessonIndex(id) {
    return G.lessons.findIndex((l) => l.id === id);
  }
  function firstUnread() {
    return G.lessons.find((l) => !S.lessons[l.id]) || null;
  }
  function openLesson(id) {
    const l = G.lessonMap[id];
    view.lessonId = id;
    view.exampleKey = l && l.example ? 't:' + l.example.replace('#', '#') : null;
    view.quiz = null;
    view.tab = 'learn';
    render();
    window.scrollTo(0, 0);
  }
  function finishLesson(l) {
    P.markLessonRead(S, l.id);
    save();
  }
  function newQuiz(cid) {
    const tpls = G.templatesFor(cid);
    const t = tpls[Math.floor(Math.random() * tpls.length)];
    view.quiz = { q: G.generate(t.id, G.rng.newSeed()), chosen: -1 };
  }

  // 검색: 용어 해설 · 개념(레슨·단락) · 그 개념의 문제 유형을 한 번에
  function searchPanel(listEl) {
    const box = h('div', { class: 'search-results', id: 'search-results', 'aria-live': 'polite' });
    const input = h('input', {
      class: 'search-input',
      id: 'search-input',
      type: 'search',
      placeholder: '궁금한 개념·용어 검색 (예: 역률, 임피던스, 슬립)',
      'aria-label': '개념·용어 검색',
      autocomplete: 'off',
    });
    input.value = view.search || '';
    input.addEventListener('input', () => {
      view.search = input.value;
      if (listEl) listEl.hidden = !!view.search.trim();
      fillSearch(box);
    });
    fillSearch(box);
    return h('div', { class: 'panel search-panel' }, h('label', { class: 'search-label', for: 'search-input' }, '무엇이 궁금해?'), input, box);
  }

  const snippet = (t, n) => (t.length > n ? t.slice(0, n).replace(/\s+\S*$/, '') + '…' : t);

  function fillSearch(box) {
    box.textContent = '';
    const q = (view.search || '').trim();
    if (!q) return;
    const r = G.search(q);
    if (!r.terms.length && !r.concepts.length) {
      box.appendChild(h('p', { class: 'muted small', id: 'search-empty' }, '"' + q + '"에 맞는 게 없어. 다른 말로 검색해 봐. (예: 옴, 전력, 변압기)'));
      return;
    }
    if (r.terms.length) {
      box.appendChild(h('h3', { class: 'group-title eyebrow' }, '용어 해설 ' + r.terms.length));
      r.terms.slice(0, 8).forEach((t) =>
        box.appendChild(h('button', { class: 'wiki-item', type: 'button', 'data-term': t.id }, h('strong', null, t.name), h('span', null, t.brief)))
      );
    }
    if (r.concepts.length) {
      box.appendChild(h('h3', { class: 'group-title eyebrow' }, '개념과 문제 ' + r.concepts.length));
      r.concepts.slice(0, 10).forEach(({ c, points, via }) => {
        const lesson = G.lessonFor(c.id);
        const st = P.conceptStat(S, c.id);
        box.appendChild(
          h(
            'div',
            { class: 'tile search-concept', 'data-concept': c.id },
            h('div', { class: 'row-head' }, h('strong', { class: 'name' }, c.name), h('span', { class: 'tag plain' }, c.group)),
            h('p', { class: 'muted small' }, snippet(c.card, 110)),
            via ? h('p', { class: 'muted small' }, '“' + via + '” 용어와 이어진 개념') : null,
            st && st.n ? h('p', { class: 'muted small' }, '푼 문제 ' + st.n + '개 · 정답률 ' + Math.round((100 * st.c) / st.n) + '%') : null,
            points.length
              ? h(
                  'div',
                  { class: 'search-points' },
                  points.map((p) => h('button', { class: 'btn small soft', type: 'button', 'data-point': ptKey(p), onclick: () => { view.search = ''; startDrill(c.id, ptKey(p)); } }, '문제 유형: ' + p.t))
                )
              : null,
            h(
              'div',
              { class: 'actions' },
              lesson ? h('button', { class: 'btn small', type: 'button', 'data-lesson': lesson.id, onclick: () => openLesson(lesson.id) }, '레슨 읽기') : null,
              h('button', { class: 'btn small', type: 'button', 'data-unit': c.id, onclick: () => openUnit(c.id) }, '단락 보기'),
              h('button', { class: 'btn small primary', type: 'button', 'data-drill': c.id, onclick: () => { view.search = ''; startDrill(c.id, null); } }, '문제 풀기')
            )
          )
        );
      });
    }
    if (G.mathUi) G.mathUi.typeset(box);
    if (G.wikiUi) G.wikiUi.link(box);
  }

  function renderLearnList(outer) {
    // 검색어가 있는 동안에는 레슨 목록을 숨기고 결과만 보여 준다(입력 중에 화면을 다시 그리지 않으려고 hidden으로 처리)
    const root = h('div', { id: 'learn-lists' });
    root.hidden = !!(view.search || '').trim();
    outer.appendChild(searchPanel(root));
    outer.appendChild(root);
    const done = G.lessons.filter((l) => S.lessons[l.id]).length;
    const next = firstUnread();
    root.appendChild(
      h(
        'div',
        { class: 'panel' },
        h('h2', null, '배우기'),
        h('p', { class: 'muted small' }, '아무것도 모르는 상태에서 시작해서 한 단계씩 나아가는 순서야. 읽고 → 예제를 따라가고 → 확인 문제를 풀어. 레슨을 읽으면 그 개념의 문제도 열려.'),
        h(
          'div',
          { class: 'tile progress-tile' },
          h('div', { class: 'stat-line' }, h('span', null, '읽은 레슨'), h('span', null, done + ' / ' + G.lessons.length)),
          h('div', { class: 'bar' }, h('i', { style: 'width:' + Math.round((100 * done) / G.lessons.length) + '%' })),
          h('button', { class: 'btn primary', id: 'continue-lesson', onclick: () => openLesson((next || G.lessons[0]).id) }, next ? (done ? '이어서 읽기: ' : '처음부터 시작: ') + next.title : '처음부터 다시 보기')
        )
      )
    );
    G.lessonParts.forEach((part) => {
      root.appendChild(h('h3', { class: 'group-title eyebrow' }, part));
      root.appendChild(
        h(
          'div',
          { class: 'rows' },
          G.lessons
            .filter((l) => l.part === part)
            .map((l) => {
              const read = !!S.lessons[l.id];
              const c = l.concept ? concept(l.concept) : null;
              const st = c ? P.conceptStat(S, c.id) : null;
              const open = c ? P.isUnlocked(S, c.id) : true;
              return h(
                'button',
                { class: 'row lesson-row', 'data-lesson': l.id, onclick: () => openLesson(l.id) },
                h(
                  'span',
                  { class: 'row-head' },
                  h('span', { class: 'lesson-no' }, lessonIndex(l.id) + 1),
                  h('span', { class: 'name' }, l.title),
                  h('span', { class: 'right' }, read ? h('span', { class: 'state open' }, '읽음') : null)
                ),
                h('span', { class: 'stat-line' }, h('span', null, l.goal)),
                c
                  ? h('span', { class: 'stat-line' }, h('span', null, open ? '문제 ' + st.n + '개 풀이 · 정답률 ' + pct(st.c, st.n) : '문제 잠김 · 이 레슨을 읽으면 열려'), h('span', null, subjectName(c.subject)))
                  : null
              );
            })
        )
      );
    });
  }

  function exampleBlock(l) {
    if (!view.exampleKey) return null;
    let q;
    try {
      q = G.fromKey(view.exampleKey);
    } catch (e) {
      return null;
    }
    const steps = q.explain.steps.map((s) => (s.indexOf('검산: ') === 0 ? h('li', { class: 'check' }, s) : h('li', null, s)));
    return h(
      'section',
      { class: 'example' },
      h('div', { class: 'example-head' }, h('span', { class: 'eyebrow' }, '예제 풀이'), h('span', { class: 'qid' }, q.key)),
      h('p', { class: 'qtext' }, q.text),
      q.svg ? h('div', { class: 'figure', html: q.svg }) : null,
      h(
        'ol',
        { class: 'choices' },
        q.choices.map((c, i) => h('li', null, h('div', { class: 'choice' + (c.correct ? ' is-correct' : ' is-dim') }, h('span', { class: 'no' }, NUMS[i]), h('span', { class: 'lab' }, c.label))))
      ),
      h('h3', null, '풀이'),
      h('ol', { class: 'steps' }, steps),
      h('p', { class: 'lead' }, '답: ' + q.explain.conclusion),
      h(
        'button',
        {
          class: 'btn soft',
          id: 'another-example',
          onclick: () => {
            view.exampleKey = 't:' + l.example.split('#')[0] + '#' + G.rng.newSeed();
            render();
            const ex = document.querySelector('.example');
            if (ex && ex.scrollIntoView) ex.scrollIntoView({ block: 'start' });
          },
        },
        '다른 숫자로 예제 보기'
      )
    );
  }

  function quizBlock(l) {
    if (!l.concept) return null;
    if (!view.quiz) newQuiz(l.concept);
    const qz = view.quiz;
    const q = qz.q;
    const answered = qz.chosen >= 0;
    const kids = [
      h('div', { class: 'example-head' }, h('span', { class: 'eyebrow' }, '바로 확인'), h('span', { class: 'qid' }, q.key)),
      h('p', { class: 'qtext' }, q.text),
      q.svg ? h('div', { class: 'figure', html: q.svg }) : null,
      h(
        'ol',
        { class: 'choices' },
        q.choices.map((c, i) => {
          let cls = 'choice';
          if (answered) cls += c.correct ? ' is-correct' : i === qz.chosen ? ' is-wrong' : ' is-dim';
          return h(
            'li',
            null,
            h(
              'button',
              {
                class: cls,
                disabled: answered,
                'data-qi': i,
                onclick: () => {
                  qz.chosen = i;
                  P.record(S, q, c.correct);
                  finishLesson(l);
                  render();
                },
              },
              h('span', { class: 'no' }, NUMS[i]),
              h('span', { class: 'lab' }, c.label)
            )
          );
        })
      ),
    ];
    if (answered) {
      const ok = q.choices[qz.chosen].correct;
      kids.push(h('div', { class: 'verdict ' + (ok ? 'ok' : 'bad') }, ok ? '정답!' : '아쉽다, 오답이야', h('small', null, q.choices[qz.chosen].why)));
      if (!ok) kids.push(h('p', { class: 'note' }, '정답 ' + NUMS[q.answerIndex] + '번: ' + q.choices[q.answerIndex].why));
      kids.push(h('p', { class: 'lead' }, q.explain.conclusion));
      kids.push(h('button', { class: 'btn soft', id: 'quiz-next', onclick: () => { newQuiz(l.concept); render(); } }, '확인 문제 하나 더'));
    }
    return h('section', { class: 'example quiz' }, kids);
  }

  function renderLesson(root, l) {
    const idx = lessonIndex(l.id);
    const next = G.lessons[idx + 1] || null;
    const c = l.concept ? concept(l.concept) : null;
    root.appendChild(h('button', { class: 'btn small back', id: 'lesson-back', onclick: () => { view.lessonId = null; render(); window.scrollTo(0, 0); } }, '← 레슨 목록'));
    const art = h(
      'article',
      { class: 'lesson' },
      h('span', { class: 'eyebrow' }, l.part + ' · ' + (idx + 1) + '/' + G.lessons.length),
      h('h2', null, l.title),
      h('p', { class: 'goal' }, '이번 목표: ' + l.goal),
      l.sections.map((sec) =>
        h('section', { class: 'lesson-sec' }, h('h3', null, sec.h), (sec.p || []).map((t) => h('p', null, t)), sec.list ? h('ul', null, sec.list.map((t) => h('li', null, t))) : null)
      ),
      c ? h('div', { class: 'box analogy' }, h('span', { class: 'eyebrow' }, '비유로 보면'), h('p', null, c.analogy)) : null,
      c ? h('div', { class: 'box formula-box' }, h('span', { class: 'eyebrow' }, '핵심 공식'), h('p', { class: 'formula' }, c.formula)) : null,
      h('section', { class: 'lesson-sec' }, h('h3', null, '문제 푸는 순서'), h('ol', { class: 'how' }, l.how.map((t) => h('li', null, t)))),
      exampleBlock(l),
      quizBlock(l),
      h('section', { class: 'lesson-sec' }, h('h3', null, '시험 포인트'), h('ul', null, l.points.concat(c && c.remember ? [c.remember] : []).map((t) => h('li', null, t)))),
      h(
        'div',
        { class: 'actions' },
        next
          ? h('button', { class: 'btn primary', id: 'lesson-next', onclick: () => { finishLesson(l); openLesson(next.id); } }, '다 읽었어 · 다음: ' + next.title)
          : h('button', { class: 'btn primary', id: 'lesson-next', onclick: () => { finishLesson(l); view.lessonId = null; toast('마지막 레슨까지 다 읽었어!'); render(); } }, '다 읽었어 · 목록으로'),
        c
          ? h(
              'button',
              {
                class: 'btn',
                id: 'lesson-practice',
                onclick: () => {
                  finishLesson(l);
                  S.settings.subject = 'all';
                  S.settings.focus = c.id;
                  view.mode = 'normal';
                  save();
                  nextQuestion();
                  goTab('practice');
                },
              },
              '이 개념 문제 풀기'
            )
          : null,
        c ? h('button', { class: 'btn', id: 'lesson-units', onclick: () => { finishLesson(l); openUnit(c.id); } }, '포인트별로 반복하기') : null
      )
    );
    root.appendChild(art);
  }

  function renderLearn(root) {
    const l = view.lessonId ? G.lessonMap[view.lessonId] : null;
    if (l) renderLesson(root, l);
    else renderLearnList(root);
  }

  // ───────── 과목별(단원) 탭 ─────────
  // restore가 true면(문제 풀다가 돌아올 때) 읽던 자리로, 아니면 맨 위로
  function openUnit(cid, restore) {
    view.unitSubject = concept(cid).subject;
    view.unitCid = cid;
    view.tab = 'units';
    render();
    window.scrollTo(0, (restore && view.scrollMemo['unit:' + cid]) || 0);
  }

  // 포인트 문제만 반복. 반복을 시작하면 개념을 읽은 것으로 쳐서 잠금도 풀어 준다.
  function startDrill(cid, pid) {
    const l = G.lessonFor(cid);
    if (l) P.markLessonRead(S, l.id);
    view.mode = 'drill';
    view.drill = { cid, pid: pid || null };
    save();
    nextQuestion();
    goTab('practice');
  }

  function pointStatus(pid) {
    const st = P.pointStat(S, pid);
    if (P.pointMastered(S, pid)) return { cls: 'open', text: '익숙해짐 ✓' };
    if (st.n) return { cls: 'locked', text: '연속 ' + st.streak + '/' + P.MASTER_STREAK };
    return { cls: 'locked', text: '아직 안 풀었어' };
  }

  function progressTile(label, mastered, total) {
    return h(
      'div',
      { class: 'tile progress-tile' },
      h('div', { class: 'stat-line' }, h('span', null, label), h('span', { class: 'nowrap' }, mastered + ' / ' + total)),
      h('div', { class: 'bar' }, h('i', { style: 'width:' + (total ? Math.round((100 * mastered) / total) : 0) + '%' }))
    );
  }

  function renderUnitList(root) {
    const subs = G.subjects.filter((s) => s.ready || s.id === 'code');
    if (!subs.some((s) => s.id === view.unitSubject)) view.unitSubject = 'circuit';
    root.appendChild(
      h(
        'div',
        { class: 'panel' },
        h('h2', null, '과목별 단원'),
        h('p', { class: 'muted small' }, '과목 → 단원 → 세부 단락 순서로 들어가. 단락마다 "문제 포인트 → 개념 설명 → 그 포인트 문제만 반복"으로 공부해. 한 포인트에서 연속 ' + P.MASTER_STREAK + '문제를 맞히면 익숙해진 걸로 쳐.'),
        h(
          'div',
          { class: 'chips', role: 'group', 'aria-label': '과목' },
          subs.map((s) =>
            h('button', { class: 'chip', 'data-subject': s.id, 'aria-pressed': String(view.unitSubject === s.id), onclick: () => { view.unitSubject = s.id; render(); } }, s.short, s.ready ? null : h('span', { class: 'soon' }, '나중에'))
          )
        )
      )
    );
    const sj = G.subjects.find((s) => s.id === view.unitSubject);
    if (!sj.ready) {
      root.appendChild(h('div', { class: 'empty' }, h('strong', null, sj.name), h('p', null, '최신 기준을 확인한 뒤에 따로 추가할 거야.')));
      return;
    }
    let m = 0;
    let t = 0;
    G.concepts.filter((c) => c.subject === sj.id).forEach((c) => {
      const cp = P.conceptPoints(S, c.id);
      m += cp.mastered;
      t += cp.total;
    });
    root.appendChild(progressTile('익숙해진 포인트', m, t));
    groupsOf(sj.id).forEach((g) => {
      root.appendChild(h('h3', { class: 'group-title eyebrow' }, g.name));
      root.appendChild(
        h(
          'div',
          { class: 'rows' },
          G.concepts
            .filter((c) => c.subject === g.subject && c.group === g.name)
            .map((c) => {
              const cp = P.conceptPoints(S, c.id);
              const st = P.conceptStat(S, c.id);
              return h(
                'button',
                { class: 'row lesson-row', 'data-unit': c.id, onclick: () => openUnit(c.id) },
                h('span', { class: 'row-head' }, h('span', { class: 'name' }, c.name), h('span', { class: 'right' }, h('span', { class: 'state ' + (cp.total && cp.mastered === cp.total ? 'open' : 'locked') }, '포인트 ' + cp.mastered + '/' + cp.total))),
                h('span', { class: 'bar' + (cp.mastered === 0 ? '' : '') }, h('i', { style: 'width:' + (cp.total ? Math.round((100 * cp.mastered) / cp.total) : 0) + '%' })),
                h('span', { class: 'stat-line' }, h('span', null, st.n + '문제 풀이'), h('span', null, '정답률 ' + pct(st.c, st.n)))
              );
            })
        )
      );
    });
  }

  // 포인트 카드 안의 예제(같은 숫자로 항상 같은 예제, "다른 숫자로"로 바꿀 수 있음)
  function pointExample(p) {
    const pid = ptKey(p);
    let q;
    try {
      q = G.questionForPoint(p, view.exSeeds[pid] || 1);
    } catch (e) {
      return null;
    }
    const steps = q.explain.steps.map((s) => (s.indexOf('검산: ') === 0 ? h('li', { class: 'check' }, s) : h('li', null, s)));
    return h(
      'details',
      { class: 'mini-example', open: !!view.exOpen[pid], ontoggle: (e) => { view.exOpen[pid] = e.target.open; } },
      h('summary', null, '예제 풀이 보기'),
      h(
        'div',
        { class: 'example' },
        h('div', { class: 'example-head' }, h('span', { class: 'eyebrow' }, '예제'), h('span', { class: 'qid' }, q.key)),
        h('p', { class: 'qtext' }, q.text),
        q.svg ? h('div', { class: 'figure', html: q.svg }) : null,
        h('ol', { class: 'choices' }, q.choices.map((c, i) => h('li', null, h('div', { class: 'choice' + (c.correct ? ' is-correct' : ' is-dim') }, h('span', { class: 'no' }, NUMS[i]), h('span', { class: 'lab' }, c.label))))),
        h('h3', null, '풀이'),
        h('ol', { class: 'steps' }, steps),
        h('p', { class: 'lead' }, '답: ' + q.explain.conclusion),
        h('button', { class: 'btn soft', 'data-another': pid, onclick: () => { view.exSeeds[pid] = G.rng.newSeed(); view.exOpen[pid] = true; render(); } }, '다른 숫자로 보기')
      )
    );
  }

  function renderUnitDetail(root, c) {
    const l = G.lessonFor(c.id);
    const points = G.pointsFor(c.id);
    const cp = P.conceptPoints(S, c.id);
    const sj = G.subjects.find((s) => s.id === c.subject);
    const sameSubject = G.concepts.filter((x) => x.subject === c.subject);
    const nextC = sameSubject[sameSubject.findIndex((x) => x.id === c.id) + 1] || null;

    root.appendChild(h('button', { class: 'btn small back', id: 'unit-back', onclick: () => { view.unitCid = null; render(); window.scrollTo(0, 0); } }, '← ' + sj.short + ' 단원 목록'));
    const kids = [
      h('span', { class: 'eyebrow' }, sj.name + ' · ' + c.group),
      h('h2', null, c.name),
      l ? h('p', { class: 'goal' }, '이번 목표: ' + l.goal) : null,
      progressTile('익숙해진 포인트', cp.mastered, cp.total),
      h('div', { class: 'actions' }, h('button', { class: 'btn primary', id: 'drill-all', onclick: () => startDrill(c.id, null) }, '이 단락 전부 섞어서 반복')),

      // 1) 문제 포인트 한눈에
      h(
        'section',
        { class: 'lesson-sec' },
        h('h3', null, '1. 이 단락에서 나오는 문제 포인트'),
        h('p', { class: 'muted small' }, '시험에서 이 개념은 아래 ' + points.length + '가지 모양으로 나와. 먼저 훑어보고, 아래 개념 설명을 읽은 뒤 포인트별로 풀어 봐.'),
        h('ol', { class: 'pt-list' }, points.map((p) => h('li', null, h('strong', null, p.t), h('span', { class: 'muted' }, ' — ' + p.ask))))
      ),

      // 2) 개념을 쉽고 자세하게
      h(
        'section',
        { class: 'lesson-sec' },
        h('h3', null, '2. 개념을 쉽게 이해하기'),
        h('p', null, c.card)
      ),
      l
        ? l.sections.map((sec) => h('section', { class: 'lesson-sec' }, h('h3', null, sec.h), (sec.p || []).map((t) => h('p', null, t)), sec.list ? h('ul', null, sec.list.map((t) => h('li', null, t))) : null))
        : null,
      h('div', { class: 'box analogy' }, h('span', { class: 'eyebrow' }, '비유로 보면'), h('p', null, c.analogy)),
      h('div', { class: 'box formula-box' }, h('span', { class: 'eyebrow' }, '핵심 공식'), h('p', { class: 'formula' }, c.formula)),
      l ? h('section', { class: 'lesson-sec' }, h('h3', null, '문제 푸는 순서'), h('ol', { class: 'how' }, l.how.map((t) => h('li', null, t)))) : null,

      // 3) 포인트별로 풀어 보기
      h('section', { class: 'lesson-sec' }, h('h3', null, '3. 포인트별로 풀어 보기'), h('p', { class: 'muted small' }, '포인트마다 풀이 핵심과 함정을 읽고, 예제를 본 다음, 그 모양의 문제만 계속 풀어서 익숙하게 만들어.')),
      points.map((p, i) => {
        const pid = ptKey(p);
        const stt = pointStatus(pid);
        const ps = P.pointStat(S, pid);
        return h(
          'section',
          { class: 'point-card', 'data-point': pid },
          h('div', { class: 'point-head' }, h('span', { class: 'lesson-no' }, i + 1), h('h3', null, p.t), h('span', { class: 'state ' + stt.cls }, stt.text)),
          h('p', { class: 'point-ask' }, p.ask),
          h('div', { class: 'box formula-box' }, h('span', { class: 'eyebrow' }, '풀이 핵심'), h('p', null, p.key)),
          h('div', { class: 'box trap-box' }, h('span', { class: 'eyebrow' }, '자주 틀리는 곳'), h('p', null, p.trap)),
          pointExample(p),
          h(
            'div',
            { class: 'point-foot' },
            h('button', { class: 'btn primary', 'data-drill': pid, onclick: () => startDrill(c.id, pid) }, '이 포인트 문제만 반복'),
            h('span', { class: 'muted small' }, ps.n ? ps.n + '문제 풀이 · 정답 ' + ps.c + '개' : '아직 안 풀었어')
          )
        );
      }),
      h(
        'div',
        { class: 'actions' },
        nextC ? h('button', { class: 'btn', id: 'unit-next', onclick: () => openUnit(nextC.id) }, '다음 단락: ' + nextC.name) : null,
        h('button', { class: 'btn', onclick: () => { view.unitCid = null; render(); window.scrollTo(0, 0); } }, '단원 목록으로')
      ),
    ];
    root.appendChild(h('article', { class: 'lesson unit' }, kids));
  }

  function renderUnits(root) {
    const c = view.unitCid ? G.conceptMap[view.unitCid] : null;
    if (c) renderUnitDetail(root, c);
    else renderUnitList(root);
  }

  // ───────── 복습 탭 ─────────
  function renderReview(root) {
    const due = P.dueReviews(S);
    const later = P.upcomingReviews(S);
    const stageName = (s) => ['1차(1일)', '2차(3일)', '3차(7일)'][s] || '';
    root.appendChild(
      h(
        'div',
        { class: 'panel' },
        h('h2', null, '복습'),
        h('p', { class: 'muted small' }, '틀린 문제는 숫자까지 똑같이 1일 → 3일 → 7일 뒤에 다시 나와. 세 번 연속 맞히면 졸업이고, 중간에 틀리면 1일부터 다시 시작해.'),
        h(
          'div',
          { class: 'tiles' },
          h('div', { class: 'tile' }, h('div', { class: 'v' }, due.length), h('div', { class: 'k' }, '오늘 복습할 문제')),
          h('div', { class: 'tile' }, h('div', { class: 'v' }, later.length), h('div', { class: 'k' }, '예정된 복습'))
        ),
        h(
          'button',
          {
            class: 'btn primary',
            id: 'start-review',
            disabled: !due.length,
            onclick: () => {
              view.mode = 'review';
              view.reviewQueue = due.map((r) => r.k);
              nextQuestion();
              goTab('practice');
            },
          },
          due.length ? '복습 시작 (' + due.length + '문제)' : '오늘은 복습할 문제가 없어'
        )
      )
    );
    const list = (title, items) =>
      items.length
        ? [
            h('h3', { class: 'group-title eyebrow' }, title),
            h(
              'div',
              { class: 'rows' },
              items.slice(0, 50).map((r) =>
                h(
                  'div',
                  { class: 'row' },
                  h('div', { class: 'row-head' }, h('span', { class: 'name' }, (concept(r.cid) || { name: r.cid }).name), h('span', { class: 'right muted small' }, r.due)),
                  h('div', { class: 'stat-line' }, h('span', null, r.k), h('span', null, stageName(r.stage)))
                )
              )
            ),
          ]
        : null;
    append(root, list('오늘', due));
    append(root, list('다가오는 복습', later));
  }

  // ───────── 기록 탭 ─────────
  function renderStats(root) {
    const recent = S.history.slice(-30);
    root.appendChild(
      h(
        'div',
        { class: 'panel' },
        h('h2', null, '기록'),
        h(
          'div',
          { class: 'tiles' },
          h('div', { class: 'tile' }, h('div', { class: 'v' }, S.streak.cur), h('div', { class: 'k' }, '현재 연속 정답')),
          h('div', { class: 'tile' }, h('div', { class: 'v' }, S.streak.best), h('div', { class: 'k' }, '최고 연속 정답')),
          h('div', { class: 'tile' }, h('div', { class: 'v' }, S.total.n), h('div', { class: 'k' }, '푼 문제')),
          h('div', { class: 'tile' }, h('div', { class: 'v' }, pct(S.total.c, S.total.n)), h('div', { class: 'k' }, '전체 정답률'))
        ),
        recent.length
          ? h('div', { class: 'panel' }, h('h3', { class: 'eyebrow' }, '최근 ' + recent.length + '문제 (왼쪽이 오래된 것)'), h('div', { class: 'dots', 'aria-label': '최근 결과' }, recent.map((x) => h('i', { class: x.ok ? 'ok' : '', title: x.k }))))
          : h('div', { class: 'empty' }, '아직 푼 문제가 없어. 연습 탭에서 첫 문제를 풀면 여기에 쌓여.')
      )
    );
    root.appendChild(h('h3', { class: 'group-title eyebrow' }, '개념별 정답률'));
    root.appendChild(
      h(
        'div',
        { class: 'rows' },
        G.concepts.map((c) => {
          const st = P.conceptStat(S, c.id);
          const rate = st.n ? st.c / st.n : 0;
          return h(
            'div',
            { class: 'row' },
            h('div', { class: 'row-head' }, h('span', { class: 'name' }, c.name), h('span', { class: 'right muted small' }, subjectName(c.subject) + (P.isUnlocked(S, c.id) ? '' : ' · 잠김'))),
            h('div', { class: 'bar' + (st.n && rate < P.UNLOCK_MIN_RATE ? ' low' : '') }, h('i', { style: 'width:' + Math.round(rate * 100) + '%' })),
            h('div', { class: 'stat-line' }, h('span', null, st.c + ' / ' + st.n + '문제'), h('span', null, pct(st.c, st.n)))
          );
        })
      )
    );
  }

  // ───────── 기록 동기화(설정 화면) ─────────
  function syncLabel(sy) {
    const when = sy.at ? new Date(sy.at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : '';
    return (
      {
        starting: '연결을 확인하는 중이야…',
        unavailable: '이 화면에서는 쓸 수 없어. claude.ai에 로그인한 상태로 웹 주소(is.gd/gisa2026)를 열면 아이폰·맥 기록이 하나로 이어져. 지금은 이 브라우저에만 저장돼.',
        syncing: '동기화하는 중…',
        ok: 'claude.ai 계정에 연결돼 있어' + (when ? ' · 마지막 동기화 ' + when : ''),
        readonly: sy.message,
        error: sy.message,
        off: '꺼져 있어. 기록은 이 브라우저에만 저장돼.',
      }[sy.state] || ''
    );
  }

  function renderSyncSettings(root, sw) {
    const sy = G.sync ? G.sync.status() : { state: 'unavailable' };
    const canUse = G.sync && G.sync.available();
    root.appendChild(h('h3', { class: 'group-title eyebrow' }, '기록 동기화'));
    root.appendChild(
      h(
        'div',
        { class: 'rows' },
        h(
          'div',
          { class: 'field' },
          h('p', { class: 'small', id: 'sync-status' }, syncLabel(sy)),
          h('p', { class: 'small muted' }, 'claude.ai 계정 기준으로 저장돼서 다른 사람과는 섞이지 않아. 두 기기에서 따로 풀었으면 문제를 더 많이 푼 쪽의 통계를 남기고, 읽은 레슨·풀이 기록·복습 일정은 합쳐.')
        ),
        canUse ? sw('sync-on', 'syncOn', '자동 동기화', '기록이 바뀌면 몇 초 뒤에 올리고, 앱을 열 때와 다시 돌아왔을 때 최신 기록을 받아 와.') : null,
        canUse ? h('div', { class: 'field' }, h('div', { class: 'inline' }, h('button', { class: 'btn', id: 'sync-now', disabled: sy.state === 'syncing', onclick: () => { G.sync.syncNow(); } }, '지금 동기화'))) : null
      )
    );
  }

  // ───────── 설정 탭 ─────────
  function renderSettings(root) {
    const m = view.msg;
    const sw = (id, key, title, desc) =>
      h(
        'label',
        { class: 'switch field', for: id },
        h('input', {
          type: 'checkbox',
          id,
          checked: !!S.settings[key],
          onchange: (e) => {
            S.settings[key] = e.target.checked;
            save();
            if (key === 'skipOrder') nextQuestion();
            if (key === 'syncOn' && G.sync) G.sync.setEnabled(e.target.checked);
            render();
          },
        }),
        h('span', null, h('strong', null, title), h('br'), h('span', { class: 'muted small' }, desc))
      );
    const themeSel = h(
      'select',
      {
        id: 'theme-select',
        onchange: (e) => {
          S.settings.theme = e.target.value;
          save();
          applyTheme();
        },
      },
      h('option', { value: 'system' }, '기기 설정 따라가기'),
      h('option', { value: 'light' }, '밝게'),
      h('option', { value: 'dark' }, '어둡게')
    );
    themeSel.value = S.settings.theme || 'system';

    root.appendChild(h('h2', null, '설정'));
    if (!G.store.isAvailable())
      root.appendChild(h('div', { class: 'banner' }, '이 브라우저에서는 기록을 저장할 수 없어(개인정보 보호 모드일 수 있어). 새로고침하면 기록이 사라져.'));
    root.appendChild(
      h(
        'div',
        { class: 'rows' },
        sw('skip-order', 'skipOrder', '순서 건너뛰기 (전부 열기)', '선행 개념 조건 없이 모든 개념을 열어.'),
        sw('mix-static', 'mixStatic', '이론형 문제 섞기', '숫자 계산이 아닌 개념 문제도 가끔(약 20%) 섞어서 내.'),
        h('div', { class: 'field' }, h('label', { for: 'theme-select' }, h('strong', null, '화면 테마')), themeSel)
      )
    );
    renderSyncSettings(root, sw);

    const keyInput = h('input', { type: 'text', id: 'key-input', placeholder: '예: t:ohm-current#12345', autocapitalize: 'off', autocomplete: 'off', spellcheck: 'false' });
    root.appendChild(h('h3', { class: 'group-title eyebrow' }, '문제 번호로 다시 풀기'));
    root.appendChild(
      h(
        'div',
        { class: 'rows' },
        h(
          'div',
          { class: 'field' },
          h('p', { class: 'small muted' }, '문제 카드 오른쪽 위의 번호를 넣으면 숫자까지 똑같은 문제가 다시 나와.'),
          h(
            'div',
            { class: 'inline' },
            keyInput,
            h(
              'button',
              {
                class: 'btn',
                id: 'load-key',
                onclick: () => {
                  try {
                    loadKey(keyInput.value);
                    view.msg = {};
                    goTab('practice');
                  } catch (e) {
                    view.msg = { key: e.message };
                    render();
                  }
                },
              },
              '불러오기'
            )
          ),
          m.key ? h('p', { class: 'msg err' }, m.key) : null
        )
      )
    );

    const pasteBox = h('textarea', { id: 'import-box', placeholder: '백업 코드를 여기에 붙여 넣어' });
    root.appendChild(h('h3', { class: 'group-title eyebrow' }, '기록 백업'));
    root.appendChild(
      h(
        'div',
        { class: 'rows' },
        h(
          'div',
          { class: 'field' },
          h('p', { class: 'small muted' }, '동기화를 쓸 수 없거나 꺼 두면 기록은 이 브라우저(localStorage)에만 저장돼. 지켜 두고 싶으면 백업 코드를 만들어 메모에 붙여 둬. 백업을 가져오면 동기화 중인 다른 기기의 기록도 그 백업으로 바뀌어.'),
          h(
            'div',
            { class: 'inline' },
            h('button', { class: 'btn', id: 'make-backup', onclick: () => { view.backupOut = JSON.stringify(S); render(); } }, '백업 코드 만들기'),
            view.backupOut
              ? h(
                  'button',
                  {
                    class: 'btn',
                    onclick: () => {
                      const box = document.getElementById('export-box');
                      const done = () => toast('복사했어');
                      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(view.backupOut).then(done, () => { box.select(); toast('복사가 막혀 있어. 선택된 글을 직접 복사해 줘.'); });
                      else { box.select(); toast('선택된 글을 직접 복사해 줘.'); }
                    },
                  },
                  '복사'
                )
              : null
          ),
          view.backupOut ? h('textarea', { id: 'export-box', readonly: true }, view.backupOut) : null
        ),
        h(
          'div',
          { class: 'field' },
          pasteBox,
          h(
            'button',
            {
              class: 'btn',
              id: 'import-backup',
              onclick: () => {
                try {
                  const data = JSON.parse(pasteBox.value);
                  if (!data || data.v !== 1) throw new Error('형식이 달라');
                  S = P.normalize(data);
                  P.replaceAll(S);
                  save();
                  applyTheme();
                  view.msg = { imp: '가져왔어. 푼 문제 ' + S.total.n + '개.' };
                  nextQuestion();
                } catch (e) {
                  view.msg = { impErr: '백업 코드를 읽지 못했어. 처음부터 끝까지 빠짐없이 붙여 넣었는지 확인해 줘.' };
                }
                render();
              },
            },
            '백업 가져오기'
          ),
          m.imp ? h('p', { class: 'msg ok' }, m.imp) : null,
          m.impErr ? h('p', { class: 'msg err' }, m.impErr) : null
        )
      )
    );

    root.appendChild(h('h3', { class: 'group-title eyebrow' }, '초기화'));
    root.appendChild(
      h(
        'div',
        { class: 'rows' },
        h(
          'div',
          { class: 'field' },
          h('p', { class: 'small muted' }, '푼 기록, 정답률, 복습 일정을 모두 지워. 되돌릴 수 없어. 동기화 중이면 다른 기기의 기록도 같이 지워져.'),
          view.resetArmed
            ? h(
                'div',
                { class: 'inline' },
                h(
                  'button',
                  {
                    class: 'btn danger',
                    id: 'reset-confirm',
                    onclick: () => {
                      const theme = S.settings.theme;
                      G.store.clear();
                      S = P.emptyState();
                      S.settings.theme = theme;
                      P.replaceAll(S);
                      save();
                      view.resetArmed = false;
                      view.mode = 'normal';
                      nextQuestion();
                      toast('기록을 모두 지웠어');
                      render();
                    },
                  },
                  '정말 지우기'
                ),
                h('button', { class: 'btn', onclick: () => { view.resetArmed = false; render(); } }, '취소')
              )
            : h('button', { class: 'btn', id: 'reset', onclick: () => { view.resetArmed = true; render(); } }, '기록 초기화')
        )
      )
    );
    root.appendChild(h('p', { class: 'muted small' }, '버전 ' + G.version + ' · 문제 템플릿 ' + G.templateList.length + '개 · 이론형 ' + G.staticBank.length + '개 · 모든 문제는 자체 제작'));
  }

  // ───────── 그리기 ─────────
  // PC 오른쪽 AI 패널이 "지금 무엇을 보고 있는지" 알 수 있게 화면 상태를 정리해서 건넨다
  function statsSummary() {
    const rows = G.concepts
      .map((c) => ({ name: c.name, st: P.conceptStat(S, c.id) }))
      .filter((r) => r.st.n >= 3)
      .sort((a, b) => a.st.c / a.st.n - b.st.c / b.st.n)
      .slice(0, 6);
    const read = Object.keys(S.lessons || {}).length;
    return (
      '푼 문제 ' + S.total.n + '개, 전체 정답률 ' + pct(S.total.c, S.total.n) + ', 읽은 레슨 ' + read + '/' + G.lessons.length + '. ' +
      (rows.length ? '정답률이 낮은 개념: ' + rows.map((r) => r.name + ' ' + pct(r.st.c, r.st.n) + '(' + r.st.n + '문제)').join(', ') : '아직 3문제 이상 푼 개념이 없어.')
    );
  }

  function aiContext() {
    if (view.tab === 'practice' && view.q) {
      return { kind: 'question', q: view.q, answered: view.answered, chosen: view.chosen, label: '문제 · ' + concept(view.q.conceptId).name };
    }
    if (view.tab === 'learn' && view.lessonId) {
      const l = G.lessonMap[view.lessonId];
      return {
        kind: 'lesson',
        lesson: l,
        concept: l.concept ? concept(l.concept) : null,
        quiz: view.quiz ? { q: view.quiz.q, answered: view.quiz.chosen >= 0 } : null,
        label: '레슨 · ' + l.title,
      };
    }
    if (view.tab === 'units' && view.unitCid) {
      const c = concept(view.unitCid);
      return { kind: 'unit', concept: c, points: G.pointsFor(c.id), label: '단락 · ' + c.name };
    }
    const names = { learn: '배우기 목록', units: '과목별 단원 목록', practice: '연습', review: '복습', stats: '기록', settings: '설정' };
    return { kind: 'general', label: names[view.tab] || '', stats: statsSummary() };
  }

  function render() {
    // 다른 문제로 넘어가면 계산기 시연을 끝낸다
    if (G.calcDemo && G.calcDemo.active() && G.calcDemo.scope() === 'question' && G.calcDemo.key() !== (view.q && view.q.key)) G.calcDemo.stop();
    renderBar();
    const root = document.getElementById('view');
    root.textContent = '';
    const fn = { learn: renderLearn, units: renderUnits, practice: renderPractice, review: renderReview, stats: renderStats, settings: renderSettings }[view.tab];
    fn(root);
    if (G.mathUi) G.mathUi.typeset(root);
    if (G.wikiUi) G.wikiUi.link(root);
    if (G.aiTutor) G.aiTutor.updateSide();
  }

  // 맥 키보드: 1~4 고르기, Enter/N 다음 문제
  document.addEventListener('keydown', (e) => {
    if (view.tab !== 'practice' || !view.q || e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (e.target && e.target.closest && e.target.closest('#calc')) return; // 계산기에 입력 중일 땐 문제 단축키 끔
    if (!view.answered && /^[1-4]$/.test(e.key)) {
      answer(Number(e.key) - 1);
      e.preventDefault();
    } else if (view.answered && (e.key === 'Enter' || e.key === 'n' || e.key === 'N')) {
      nextQuestion();
      render();
      window.scrollTo(0, 0);
      e.preventDefault();
    }
  });

  function start() {
    if (!S.settings.theme) S.settings.theme = 'system';
    if (S.total.n === 0 && !Object.keys(S.lessons || {}).length) view.tab = 'learn';
    applyTheme();
    nextQuestion();
    render();
    if (G.sync) {
      G.sync.init({
        getState: () => S,
        // 서버 기록과 합친 결과를 이 기기에 적용(로컬 저장만 하고, 다시 올리는 건 동기화가 알아서 함)
        apply(merged, info) {
          S = merged;
          G.store.save(S);
          applyTheme();
          if (info && info.hadLocal && info.hadRemote) toast('다른 기기의 기록과 합쳤어');
          render();
        },
        onStatus() {
          paintSyncDot();
          if (view.tab === 'settings') render();
        },
      });
    }
    if (G.aiTutor) {
      G.aiTutor.mountSide(aiContext);
      G.aiTutor.onReady(() => render());
      G.aiTutor.onLayoutChange(() => render());
    }
  }

  // 테스트(브라우저 점검)용 진입점
  function _load(key) {
    loadKey(key);
    view.tab = 'practice';
    render();
  }
  G.ui = { openLesson, openUnit, start, _view: view, _state: () => S, _load, _answer: answer, _openLesson: openLesson, _openUnit: openUnit, _startDrill: startDrill };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})(globalThis.GISA);

</script>
</body>
</html>
