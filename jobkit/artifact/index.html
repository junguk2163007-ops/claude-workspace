<title>jobkit 구직 서류</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<style>
/* 레이아웃: 공고 찾기는 [지원 기준 | 공고 목록 | AI 대화] 3단, 좁으면 한 줄로 쌓는다.
   밝은 하늘빛 바탕 + 코발트 파랑(행동) + 해바라기 노랑(강조). 글자는 크고 진하게. */
:root {
  --bg: #f4f8ff;
  --surface: #ffffff;
  --surface-2: #f0f5fe;
  --ink: #0f1c33;
  --muted: #4a5873;
  --line: #dbe4f2;
  --accent: #2160e8;
  --accent-strong: #1748b8;
  --accent-ink: #ffffff;
  --accent-soft: #e5edff;
  --sun: #ffb020;
  --sun-soft: #fff3d6;
  --sun-ink: #6b4300;
  --shadow: 0 1px 2px rgba(15, 28, 51, .05), 0 6px 18px rgba(33, 96, 232, .07);
  --paper-shadow: 0 1px 3px rgba(15, 28, 51, .12), 0 10px 28px rgba(15, 28, 51, .10);
  --g-bg: #dcf7ea; --g-fg: #0b7a4f;
  --y-bg: #fff1cc; --y-fg: #7a5200;
  --r-bg: #ffe2df; --r-fg: #b4231a;
  --b-bg: #e1ebff; --b-fg: #1a4fc4;
  --p-bg: #efe5ff; --p-fg: #6232c4;
  --o-bg: #ffe8d6; --o-fg: #a5470f;
  --n-bg: #edf1f7; --n-fg: #45536b;
  --src-dghma: #12b886; --src-jobkorea: #2160e8; --src-saramin: #ff7a45; --src-work24: #8b5cf6; --src-all: #ffb020;
  --font-ui: "JobkitKR", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --fs-s: 13.5px; --fs: 15px; --fs-h: 17px;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1424; --surface: #142038; --surface-2: #1a2845; --ink: #eef3ff; --muted: #a9b6d0; --line: #2a3b5e;
    --accent: #6f9bff; --accent-strong: #9bbaff; --accent-ink: #0d1424; --accent-soft: #1d2f55;
    --sun: #ffc24d; --sun-soft: #3a2f12; --sun-ink: #ffd98a;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.25); --paper-shadow: 0 1px 3px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.4);
    --g-bg: #133b2b; --g-fg: #7ee2b2; --y-bg: #3d3011; --y-fg: #ffd77a; --r-bg: #451d1c; --r-fg: #ffa59d;
    --b-bg: #1b2f5a; --b-fg: #a9c3ff; --p-bg: #2e2152; --p-fg: #cdb6ff; --o-bg: #43271a; --o-fg: #ffbb8c; --n-bg: #22304a; --n-fg: #b5c1d8;
    --src-dghma: #3ad6a0; --src-jobkorea: #6f9bff; --src-saramin: #ff9a6f; --src-work24: #b49bff; --src-all: #ffc24d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1424; --surface: #142038; --surface-2: #1a2845; --ink: #eef3ff; --muted: #a9b6d0; --line: #2a3b5e;
  --accent: #6f9bff; --accent-strong: #9bbaff; --accent-ink: #0d1424; --accent-soft: #1d2f55;
  --sun: #ffc24d; --sun-soft: #3a2f12; --sun-ink: #ffd98a;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.25); --paper-shadow: 0 1px 3px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.4);
  --g-bg: #133b2b; --g-fg: #7ee2b2; --y-bg: #3d3011; --y-fg: #ffd77a; --r-bg: #451d1c; --r-fg: #ffa59d;
  --b-bg: #1b2f5a; --b-fg: #a9c3ff; --p-bg: #2e2152; --p-fg: #cdb6ff; --o-bg: #43271a; --o-fg: #ffbb8c; --n-bg: #22304a; --n-fg: #b5c1d8;
  --src-dghma: #3ad6a0; --src-jobkorea: #6f9bff; --src-saramin: #ff9a6f; --src-work24: #b49bff; --src-all: #ffc24d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: var(--fs); line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere; }
h2 { font-size: var(--fs-h); margin: 0; font-weight: 700; text-wrap: balance; letter-spacing: -0.01em; }
h3 { font-size: 15px; margin: 6px 0 0; color: var(--accent); }
p { margin: 0; }
a { color: var(--accent); font-weight: 500; }
.small { font-size: var(--fs-s); }
.muted { color: var(--muted); font-weight: 400; }
.num { font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.warn-text { color: var(--y-fg); font-weight: 600; }
.ok-text { color: var(--g-fg); font-weight: 600; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: 0 2px 10px rgba(33, 96, 232, .06); }
.top::after { content: ""; display: block; height: 3px; background: linear-gradient(90deg, var(--accent) 0 70%, var(--sun) 70% 100%); }
.top-in, .page-main { max-width: 1680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; padding-block: 11px; }
.brand { font-weight: 800; font-size: 19px; color: var(--ink); letter-spacing: -0.01em; display: flex; align-items: center; gap: 9px; }
.brand::before { content: ""; width: 14px; height: 14px; border-radius: 4px; background: var(--sun); box-shadow: 5px 5px 0 var(--accent); margin-right: 6px; }
.brand span { font-size: 13px; color: var(--muted); font-weight: 500; }
nav { display: flex; gap: 6px; flex-wrap: wrap; }
nav a { text-decoration: none; color: var(--ink); padding: 7px 14px; border-radius: 999px; font-size: 14.5px; font-weight: 600; }
nav a:hover { background: var(--accent-soft); color: var(--accent-strong); }
nav a.on { background: var(--accent); color: var(--accent-ink); }
.store-state { margin-left: auto; color: var(--muted); font-weight: 600; }
.page-main { padding-block: 22px 48px; display: flex; flex-direction: column; gap: 16px; }

.split { display: grid; grid-template-columns: 1fr; gap: 18px; align-items: start; }
@media (min-width: 1100px) {
  .split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; }
  .sticky { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); }
  .history.split { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
}
.col { min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-s { display: flex; flex-direction: column; gap: 9px; }
.row { display: flex; align-items: center; gap: 9px; }
.row.wrap { flex-wrap: wrap; }
.row.top { align-items: flex-start; gap: 16px; }
.row.end { justify-content: flex-end; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.card.empty { padding: 56px 20px; text-align: center; color: var(--muted); }
.how ol { margin: 8px 0 12px; padding-left: 22px; display: grid; gap: 5px; }

input, select, textarea { font: inherit; font-size: 15px; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 11px; width: 100%; min-width: 0; }
input:hover, select:hover, textarea:hover { border-color: #b9c8e4; }
textarea { resize: vertical; line-height: 1.65; }
input:focus-visible, select:focus-visible, textarea:focus-visible, .btn:focus-visible, nav a:focus-visible, .seg button:focus-visible, .source-tab:focus-visible, .example:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; border-color: var(--accent); }
input[type="checkbox"], input[type="radio"] { width: 17px; height: 17px; accent-color: var(--accent); }
input.short { width: 180px; }
select.mini { padding: 4px 8px; font-size: 13.5px; width: auto; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field-label { font-size: 13.5px; color: var(--muted); font-weight: 600; }
.field-label em { font-style: normal; color: var(--y-fg); }
.field.warn input { border-color: var(--sun); background: var(--sun-soft); }
.field-hint { font-size: 13px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.grid2 .wide, .grid-fields .wide { grid-column: 1 / -1; }
@media (max-width: 560px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.checks { gap: 16px; padding-block: 2px; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 14.5px; white-space: nowrap; }

.btn { font: inherit; font-size: 14.5px; font-weight: 700; border-radius: 9px; padding: 8px 15px; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: background .12s, border-color .12s, transform .06s; }
.btn:hover { background: var(--accent-soft); border-color: #b9c8e4; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--accent-ink); }
.btn-danger { color: var(--r-fg); border-color: var(--r-fg); }
.btn-quiet { border-color: transparent; background: transparent; color: var(--muted); font-weight: 600; }
.btn-quiet:hover { background: var(--surface-2); border-color: transparent; }
.btn.big { padding: 11px 28px; font-size: 16px; }
.linklike { font: inherit; background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; }
.email-in { padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px dashed var(--line); }
.email-in input { flex: 1; min-width: 0; }
.howto { margin: 6px 0; padding-left: 20px; display: grid; gap: 4px; }
details > summary { cursor: pointer; color: var(--accent); font-weight: 600; }
.file-btn input { display: none; }
.link-btn { font: inherit; background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 0; text-align: left; }

.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { font: inherit; font-size: 14px; font-weight: 600; padding: 7px 14px; border: 0; background: var(--surface); color: var(--ink); cursor: pointer; }
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.seg button.on .muted { color: inherit; opacity: .85; }

.notice { border-radius: 10px; padding: 10px 14px; font-size: 14.5px; border-left: 4px solid; }
.notice-info { background: var(--b-bg); color: var(--b-fg); }
.notice-warn { background: var(--y-bg); color: var(--y-fg); }
.notice-danger { background: var(--r-bg); color: var(--r-fg); }
.notice-ok { background: var(--g-bg); color: var(--g-fg); }
.notice a { color: inherit; }

.pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.pill-green { background: var(--g-bg); color: var(--g-fg); } .pill-yellow { background: var(--y-bg); color: var(--y-fg); }
.pill-red { background: var(--r-bg); color: var(--r-fg); } .pill-blue { background: var(--b-bg); color: var(--b-fg); }
.pill-purple { background: var(--p-bg); color: var(--p-fg); } .pill-orange { background: var(--o-bg); color: var(--o-fg); }
.pill-gray { background: var(--n-bg); color: var(--n-fg); }

.kvs { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2px 22px; margin: 10px 0 0; }
.kv { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--line); min-width: 0; }
.kv dt { width: 76px; flex: none; color: var(--muted); font-size: 14px; font-weight: 600; }
.kv dd { margin: 0; min-width: 0; }

.table-wrap { overflow-x: auto; margin-top: 8px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.tbl th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 700; padding: 8px 9px; border-bottom: 1.5px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.tbl td { padding: 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr.dim td { color: var(--muted); background: var(--surface-2); }
.tbl.hover tbody tr { cursor: pointer; }
.tbl.hover tbody tr:hover td, .tbl tr.sel td { background: var(--accent-soft); }
.empty-cell { text-align: center; color: var(--muted); padding: 28px 8px !important; }

.signal { display: flex; gap: 14px; align-items: flex-start; }
.lamp { display: flex; gap: 6px; padding: 7px 9px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 20px; flex: none; }
.lamp span { width: 14px; height: 14px; border-radius: 50%; background: var(--n-bg); }
.lamp-green span:nth-child(1) { background: #18c070; }
.lamp-yellow span:nth-child(2) { background: #ffb020; }
.lamp-red span:nth-child(3) { background: #f0443a; }
.signal p { margin-top: 2px; }

.preview { display: flex; flex-direction: column; gap: 14px; margin: 12px 0 8px; max-height: 78vh; overflow-y: auto; padding: 4px; background: var(--surface-2); border-radius: 10px; }
.page-canvas { display: block; background: #fff; box-shadow: var(--paper-shadow); border-radius: 2px; max-width: 100%; }
.pre { white-space: pre-wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px; font: inherit; font-size: 14px; max-height: 480px; overflow: auto; margin: 0; }

.list-item { display: flex; gap: 10px; align-items: flex-end; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 12px; }
.grid-fields { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.list-ctl { display: flex; flex-direction: column; gap: 2px; }
.photo-box { width: 120px; height: 160px; flex: none; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; background: var(--surface-2); }
.photo-box.empty { border-style: dashed; }
.photo-box img { width: 100%; height: 100%; object-fit: cover; display: block; max-width: 100%; }
.qual { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.qual.have { border-color: var(--g-fg); background: var(--g-bg); }
.qual.have input:not([type]), .qual.have select { background: var(--surface); }
.qual-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.qual-name { flex: 1 1 180px; font-weight: 700; }
.qual-top select { width: auto; }
.blocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 18px 24px; }

.checks-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.chk { display: flex; gap: 9px; align-items: baseline; font-size: 14.5px; padding: 6px 11px; border-radius: 8px; font-weight: 500; }
.chk span { font-weight: 800; width: 14px; flex: none; text-align: center; }
.chk-ok { background: var(--g-bg); color: var(--g-fg); }
.chk-warn { background: var(--y-bg); color: var(--y-fg); }
.chk-block { background: var(--r-bg); color: var(--r-fg); }
.chip-x { border: 0; background: none; color: inherit; cursor: pointer; font-size: 15px; padding: 0 2px; }
.file-chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 5px 11px; font-size: 14px; font-weight: 500; }
.attach { display: flex; flex-direction: column; gap: 5px; }
.ack { white-space: normal; font-weight: 700; }
.confirm { border: 2px solid var(--accent); border-radius: 12px; padding: 14px; background: var(--accent-soft); }
.final { max-width: 920px; width: 100%; margin: 0 auto; }
.manual { border-top: 1.5px dashed var(--line); padding-top: 14px; }
.disabled-link { opacity: .45; cursor: default; }

/* 공고 찾기 3단 */
.jobs-layout { display: grid; gap: 18px; align-items: start; grid-template-columns: minmax(0, 1fr); grid-template-areas: "crit" "main" "chat"; }
.jobs-layout > .crit { grid-area: crit; }
.jobs-layout > .jobs-main { grid-area: main; min-width: 0; }
.jobs-layout > .chat { grid-area: chat; }
@media (min-width: 960px) {
  .jobs-layout { grid-template-columns: 290px minmax(0, 1fr); grid-template-areas: "crit main" "chat main"; }
}
@media (min-width: 1320px) {
  .jobs-layout { grid-template-columns: 300px minmax(0, 1fr) 370px; grid-template-areas: "crit main chat"; }
  .jobs-layout > .crit, .jobs-layout > .chat { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 78px); }
  .jobs-layout > .chat { max-height: calc(100vh - 100px); }
}
.hero { background: linear-gradient(180deg, var(--accent-soft), var(--surface) 70%); }
.crit { display: flex; flex-direction: column; gap: 14px; border-top: 4px solid var(--sun); }
.crit-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.crit-kicker { font-size: 13px; font-weight: 800; letter-spacing: .04em; color: var(--accent); }
.crit-goal { font-size: 16px; font-weight: 700; line-height: 1.6; background: var(--sun-soft); color: var(--ink); border-radius: 10px; padding: 12px 14px; }
.crit-list { margin: 0; display: flex; flex-direction: column; gap: 10px; }
.crit-list div { display: flex; flex-direction: column; gap: 4px; }
.crit-list dt { font-size: 13px; font-weight: 700; color: var(--muted); }
.crit-list dd { margin: 0; font-size: 14.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border-radius: 999px; padding: 2px 10px; font-size: 13.5px; font-weight: 600; }
.chip-in { background: var(--b-bg); color: var(--b-fg); }
.chip-out { background: var(--n-bg); color: var(--n-fg); text-decoration: line-through; text-decoration-thickness: 1px; }
.crit-notes ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }

.chat { display: flex; flex-direction: column; gap: 12px; border-top: 4px solid var(--accent); min-height: 420px; }
.chat-log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 9px; min-height: 160px; max-height: 52vh; padding-right: 2px; }
.bubble { padding: 10px 13px; border-radius: 14px; font-size: 14.5px; line-height: 1.6; white-space: pre-wrap; max-width: 92%; }
.bubble-ai { background: var(--surface-2); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }
.bubble-me { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
.typing { color: var(--muted); font-style: italic; }
.chat-examples { display: flex; flex-wrap: wrap; gap: 6px; }
.example { font: inherit; font-size: 13.5px; font-weight: 600; border: 1.5px solid var(--sun); background: var(--sun-soft); color: var(--sun-ink); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
.example:hover { background: var(--sun); color: #3d2600; }
.example:disabled { opacity: .5; cursor: default; }
.chat-input { display: flex; gap: 8px; align-items: flex-end; }
.chat-input textarea { flex: 1; resize: none; }

.source-tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.source-tab { font: inherit; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 13px 15px; border: 1.5px solid var(--line); border-top: 4px solid var(--src, var(--accent)); border-radius: 12px; background: var(--surface); color: var(--ink); cursor: pointer; text-align: left; transition: background .12s, box-shadow .12s; }
.source-tab:hover { background: var(--surface-2); }
.source-tab.on { background: var(--surface); box-shadow: 0 0 0 2px var(--src, var(--accent)), var(--shadow); }
.src-dghma { --src: var(--src-dghma); } .src-jobkorea { --src: var(--src-jobkorea); } .src-saramin { --src: var(--src-saramin); } .src-work24 { --src: var(--src-work24); } .src-all { --src: var(--src-all); }
.origin { display: inline-block; flex: none; font-size: 12px; font-weight: 700; line-height: 1; padding: 4px 7px; margin-right: 6px; border-radius: 6px; vertical-align: 2px; color: #fff; background: var(--src, var(--accent)); white-space: nowrap; }
:root[data-theme="dark"] .origin { color: #0d1424; }
.origin.origin-also { background: transparent; color: var(--src); box-shadow: inset 0 0 0 1.5px var(--src); }
