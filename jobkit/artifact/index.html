<title>jobkit 구직 서류</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<style>
/* 레이아웃: 왼쪽 작업 흐름(붙여넣기→확인→생성), 오른쪽 결과(A4 미리보기·메일)를 고정. 좁으면 한 줄로. */
:root {
  --bg: #f2f4f7;
  --surface: #ffffff;
  --surface-2: #f7f9fb;
  --ink: #15202b;
  --muted: #5a6674;
  --line: #d8dee6;
  --accent: #1f4e79;
  --accent-ink: #ffffff;
  --accent-soft: #e2ebf4;
  --paper-shadow: 0 1px 2px rgba(21, 32, 43, .08), 0 6px 20px rgba(21, 32, 43, .08);
  --g-bg: #e3f3e7; --g-fg: #1d6b34;
  --y-bg: #fbf0d3; --y-fg: #7a5507;
  --r-bg: #fbe3e1; --r-fg: #a02a22;
  --b-bg: #e1ecfa; --b-fg: #1d4f8f;
  --p-bg: #ede6fa; --p-fg: #5b3a9e;
  --o-bg: #fce9da; --o-fg: #9a4a12;
  --n-bg: #eceff3; --n-fg: #4c5866;
  --font-ui: "JobkitKR", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --fs-s: 12.5px; --fs: 14px; --fs-h: 15.5px;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141a; --surface: #171e26; --surface-2: #1c242e; --ink: #e5eaf0; --muted: #94a1af; --line: #2a3440;
    --accent: #84aedb; --accent-ink: #0f141a; --accent-soft: #1d2a39; --paper-shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    --g-bg: #17331f; --g-fg: #8fd6a2; --y-bg: #3a2e10; --y-fg: #f0cd7a; --r-bg: #3d1a18; --r-fg: #f2a59e;
    --b-bg: #172a40; --b-fg: #9cc2f0; --p-bg: #2a2140; --p-fg: #c5b0f0; --o-bg: #3a2414; --o-fg: #f3b88a; --n-bg: #242d38; --n-fg: #aab5c2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141a; --surface: #171e26; --surface-2: #1c242e; --ink: #e5eaf0; --muted: #94a1af; --line: #2a3440;
  --accent: #84aedb; --accent-ink: #0f141a; --accent-soft: #1d2a39; --paper-shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  --g-bg: #17331f; --g-fg: #8fd6a2; --y-bg: #3a2e10; --y-fg: #f0cd7a; --r-bg: #3d1a18; --r-fg: #f2a59e;
  --b-bg: #172a40; --b-fg: #9cc2f0; --p-bg: #2a2140; --p-fg: #c5b0f0; --o-bg: #3a2414; --o-fg: #f3b88a; --n-bg: #242d38; --n-fg: #aab5c2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: var(--fs); line-height: 1.55; word-break: keep-all; overflow-wrap: anywhere; }
h2 { font-size: var(--fs-h); margin: 0; font-weight: 700; text-wrap: balance; }
h3 { font-size: 13.5px; margin: 6px 0 0; color: var(--accent); }
p { margin: 0; }
a { color: var(--accent); }
.small { font-size: var(--fs-s); }
.muted { color: var(--muted); font-weight: 400; }
.num { font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.warn-text { color: var(--y-fg); }
.ok-text { color: var(--g-fg); }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in, .page-main { max-width: 1560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding-block: 10px; }
.brand { font-weight: 700; font-size: 17px; color: var(--accent); letter-spacing: .01em; display: flex; align-items: baseline; gap: 8px; }
.brand span { font-size: 12px; color: var(--muted); font-weight: 400; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a { text-decoration: none; color: var(--ink); padding: 6px 12px; border-radius: 6px; font-size: 13.5px; }
nav a:hover { background: var(--surface-2); }
nav a.on { background: var(--accent); color: var(--accent-ink); }
.store-state { margin-left: auto; color: var(--muted); }
.page-main { padding-block: 18px 40px; display: flex; flex-direction: column; gap: 14px; }

.split { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
@media (min-width: 1100px) {
  .split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
  .sticky { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); }
  .history.split { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
}
.col { min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-s { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.row.top { align-items: flex-start; gap: 16px; }
.row.end { justify-content: flex-end; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.card-head { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.card.empty { padding: 56px 20px; text-align: center; color: var(--muted); }
.how ol { margin: 8px 0 12px; padding-left: 20px; display: grid; gap: 4px; }

input, select, textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; min-width: 0; }
textarea { resize: vertical; line-height: 1.6; }
input:focus-visible, select:focus-visible, textarea:focus-visible, .btn:focus-visible, nav a:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type="checkbox"], input[type="radio"] { width: auto; accent-color: var(--accent); }
input.short { width: 180px; }
select.mini { padding: 3px 6px; font-size: 12.5px; width: auto; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field-label { font-size: 12.5px; color: var(--muted); }
.field-label em { font-style: normal; color: var(--y-fg); }
.field.warn input { border-color: var(--y-fg); background: var(--y-bg); }
.field-hint { font-size: 12px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.grid2 .wide, .grid-fields .wide { grid-column: 1 / -1; }
@media (max-width: 560px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.checks { gap: 14px; padding-block: 2px; }
.check { display: inline-flex; align-items: center; gap: 5px; font-size: 13.5px; white-space: nowrap; }

.btn { font: inherit; font-size: 13.5px; font-weight: 600; border-radius: 6px; padding: 7px 13px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: default; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn-danger { color: var(--r-fg); border-color: var(--r-fg); }
.btn-quiet { border-color: transparent; background: transparent; color: var(--muted); font-weight: 500; }
.btn.big { padding: 10px 26px; font-size: 15px; }
.file-btn input { display: none; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; padding: 6px 12px; border: 0; background: var(--surface); color: var(--ink); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.seg button.on .muted { color: inherit; opacity: .8; }

.notice { border-radius: 6px; padding: 9px 12px; font-size: 13.5px; border-left: 3px solid; }
.notice-info { background: var(--b-bg); color: var(--b-fg); }
.notice-warn { background: var(--y-bg); color: var(--y-fg); }
.notice-danger { background: var(--r-bg); color: var(--r-fg); }
.notice-ok { background: var(--g-bg); color: var(--g-fg); }
.notice a { color: inherit; }

.pill { display: inline-block; border-radius: 4px; padding: 1px 7px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill-green { background: var(--g-bg); color: var(--g-fg); } .pill-yellow { background: var(--y-bg); color: var(--y-fg); }
.pill-red { background: var(--r-bg); color: var(--r-fg); } .pill-blue { background: var(--b-bg); color: var(--b-fg); }
.pill-purple { background: var(--p-bg); color: var(--p-fg); } .pill-orange { background: var(--o-bg); color: var(--o-fg); }
.pill-gray { background: var(--n-bg); color: var(--n-fg); }

.kvs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 2px 20px; margin: 10px 0 0; }
.kv { display: flex; gap: 10px; padding: 4px 0; border-bottom: 1px dashed var(--line); min-width: 0; }
.kv dt { width: 72px; flex: none; color: var(--muted); font-size: 13px; }
.kv dd { margin: 0; min-width: 0; }

.table-wrap { overflow-x: auto; margin-top: 8px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 7px 8px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.tbl td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr.dim td { color: var(--muted); background: var(--surface-2); }
.tbl.hover tbody tr { cursor: pointer; }
.tbl.hover tbody tr:hover td, .tbl tr.sel td { background: var(--accent-soft); }
.empty-cell { text-align: center; color: var(--muted); padding: 28px 8px !important; }

.signal { display: flex; gap: 14px; align-items: flex-start; }
.lamp { display: flex; gap: 5px; padding: 6px 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 20px; flex: none; }
.lamp span { width: 13px; height: 13px; border-radius: 50%; background: var(--n-bg); }
.lamp-green span:nth-child(1) { background: #2f9e55; }
.lamp-yellow span:nth-child(2) { background: #e0a400; }
.lamp-red span:nth-child(3) { background: #d33a2f; }
.signal p { margin-top: 2px; }

.preview { display: flex; flex-direction: column; gap: 12px; margin: 12px 0 8px; max-height: 78vh; overflow-y: auto; padding: 2px; }
.page-canvas { display: block; background: #fff; box-shadow: var(--paper-shadow); border-radius: 2px; max-width: 100%; }
.pre { white-space: pre-wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 12px; font: inherit; font-size: 13px; max-height: 480px; overflow: auto; margin: 0; }

.list-item { display: flex; gap: 10px; align-items: flex-end; border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 10px; }
.grid-fields { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.list-ctl { display: flex; flex-direction: column; gap: 2px; }
.photo-box { width: 120px; height: 160px; flex: none; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12.5px; background: var(--surface-2); }
.photo-box.empty { border-style: dashed; }
.photo-box img { width: 100%; height: 100%; object-fit: cover; display: block; max-width: 100%; }
.qual { border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.qual.have { border-color: var(--g-fg); background: var(--g-bg); }
.qual.have input:not([type]), .qual.have select { background: var(--surface); }
.qual-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.qual-name { flex: 1 1 180px; font-weight: 600; }
.qual-top select { width: auto; }
.blocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 18px 24px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<div id="root"></div>
<script src="app.js"></script>
