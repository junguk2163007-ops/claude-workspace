<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#07070f" />
  <title>정전의 왕국</title>
  <style>
    :root {
      --sal: env(safe-area-inset-left, 0px);
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #07070f;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, sans-serif;
    }
    canvas { display: block; position: fixed; inset: 0; }

    #mute {
      position: fixed;
      top: calc(10px + var(--sat));
      right: calc(10px + var(--sar));
      width: 40px; height: 40px;
      border: 0; border-radius: 10px;
      background: rgba(20, 14, 30, 0.55);
      color: #fff; font-size: 20px;
      cursor: pointer;
    }

    #music {
      position: fixed;
      top: calc(10px + var(--sat));
      right: calc(58px + var(--sar));
      width: 40px; height: 40px;
      border: 0; border-radius: 10px;
      background: rgba(20, 14, 30, 0.55);
      color: #fff; font-size: 20px;
      cursor: pointer;
    }
    #music.off { opacity: 0.35; text-decoration: line-through; }

    .pad { display: none; }
    body.touch .pad {
      display: flex;
      position: fixed;
      bottom: calc(14px + var(--sab));
      gap: 12px;
    }
    .pad.left { left: calc(14px + var(--sal)); }
    .pad.right { right: calc(14px + var(--sar)); }
    .pad button {
      width: 74px; height: 74px;
      border: 2px solid rgba(255, 230, 170, 0.35);
      border-radius: 18px;
      background: rgba(20, 14, 30, 0.45);
      color: #f3e6c4;
      font-size: 28px;
      touch-action: none;
      padding: 0;
    }
    .pad button.invest {
      width: 92px; border-radius: 46px;
      font-size: 15px; font-weight: bold;
      border-color: rgba(255, 211, 77, 0.6);
      color: #ffd34d;
    }
    .pad button.pressed {
      background: rgba(255, 211, 77, 0.3);
      transform: scale(0.94);
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <button id="music" aria-label="배경음악 켜기/끄기">🎵</button>
  <button id="mute" aria-label="소리 켜기/끄기">🔊</button>
  <div class="pad left">
    <button data-btn="left" aria-label="왼쪽">◀</button>
    <button data-btn="right" aria-label="오른쪽">▶</button>
  </div>
  <div class="pad right">
    <button data-btn="invest" class="invest" aria-label="코인 투자">🪙 투자</button>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
